<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBDOLA LEPUS / BOOT</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#252117;
  --bg2:#30291d;
  --panel:#3c3427;
  --panel2:#473d2e;
  --line:#665a46;
  --line2:#8a7a5d;
  --text:#eee7da;
  --sub:#b9ad98;
  --accent:#c5b07a;
  --accent-dark:#948152;
  --danger:#c37769;
  --glow:rgba(197,176,122,.16);
  --shadow:0 20px 60px rgba(0,0,0,.34);
}

html,body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
    radial-gradient(circle at 50% 30%, rgba(197,176,122,.10), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(148,129,82,.08), transparent 26%),
    var(--bg);
  background-size:32px 32px,32px 32px,auto,auto;
  color:var(--text);
  font-family:
    "IBM Plex Mono",
    "Noto Sans TC",
    "Microsoft JhengHei",
    monospace;
  display:flex;
  align-items:center;
  justify-content:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.03),
      rgba(255,255,255,0) 3%,
      rgba(0,0,0,.08) 50%,
      rgba(255,255,255,0) 97%
    );
  opacity:.24;
  mix-blend-mode:screen;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.02) 0px,
      rgba(255,255,255,.02) 1px,
      transparent 2px,
      transparent 4px
    );
  opacity:.22;
}

.boot-wrap{
  width:min(900px, calc(100vw - 32px));
  min-height:520px;
  padding:28px;
  border:1px solid var(--line);
  background:rgba(60,52,39,.72);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  position:relative;
}

.boot-wrap::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(255,255,255,.05);
  pointer-events:none;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:var(--sub);
  letter-spacing:.08em;
  margin-bottom:34px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.mark{
  width:24px;
  height:24px;
  border:1px solid var(--accent);
  transform:rotate(45deg);
  background:linear-gradient(135deg,var(--accent-dark),var(--panel2));
  box-shadow:0 0 18px var(--glow);
}

.main{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:26px;
}

.left{
  min-height:380px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.kicker{
  color:var(--sub);
  font-size:11px;
  letter-spacing:.25em;
  margin-bottom:10px;
}

.title{
  font-size:42px;
  line-height:1.1;
  margin:0;
  letter-spacing:.06em;
  font-weight:500;
}

.subtitle{
  margin-top:12px;
  color:var(--sub);
  font-size:12px;
  line-height:1.9;
  max-width:520px;
}

.boot-panel{
  margin-top:28px;
  padding:16px;
  border:1px solid var(--line);
  background:rgba(71,61,46,.35);
}

.label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:10px;
  color:var(--sub);
}

.progress{
  height:12px;
  border:1px solid var(--line2);
  background:#221e16;
  position:relative;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #8d7c55 0%,
      #c5b07a 40%,
      #e1cf9b 100%
    );
  box-shadow:0 0 16px rgba(197,176,122,.22);
  transition:width .35s ease;
}

.status{
  margin-top:12px;
  color:var(--text);
  font-size:11px;
  min-height:18px;
}

.enter-area{
  margin-top:18px;
  display:none;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.enter-area.show{
  display:flex;
}

.enter-btn{
  padding:12px 18px;
  border:1px solid var(--accent-dark);
  background:var(--panel2);
  color:var(--text);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.08em;
  cursor:pointer;
  transition:.18s;
}

.enter-btn:hover{
  background:#5a4d3a;
  border-color:var(--accent);
  color:#fff7e8;
}

.enter-note{
  font-size:10px;
  color:var(--sub);
}

.right{
  border:1px solid var(--line);
  background:rgba(36,31,23,.55);
  padding:16px;
  display:flex;
  flex-direction:column;
  min-height:380px;
}

.side-title{
  color:var(--accent);
  font-size:10px;
  letter-spacing:.15em;
  margin-bottom:12px;
}

.log{
  flex:1;
  overflow:hidden;
  font-size:10px;
  line-height:1.9;
  color:var(--sub);
}

.log-line{
  opacity:0;
  transform:translateY(4px);
  animation:showLine .35s forwards;
}

.log-line.ok{
  color:var(--text);
}

.log-line.warn{
  color:#d7c28c;
}

.sys-grid{
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:12px;
}

.sys-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
  font-size:10px;
}

.sys-row span:first-child{
  color:var(--sub);
}

.sys-row span:last-child{
  color:var(--text);
}

.corner{
  position:absolute;
  right:20px;
  bottom:16px;
  color:rgba(255,255,255,.08);
  font-size:52px;
  letter-spacing:.08em;
  pointer-events:none;
}

.blink{
  animation:blink 1s steps(1) infinite;
}

@keyframes blink{
  0%,50%{opacity:1;}
  50.01%,100%{opacity:.15;}
}

@keyframes showLine{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:780px){
  .boot-wrap{
    min-height:auto;
    padding:20px;
  }

  .main{
    grid-template-columns:1fr;
  }

  .title{
    font-size:32px;
  }

  .right{
    min-height:260px;
  }

  .corner{
    font-size:34px;
  }
}
</style>
</head>
<body>

<div class="boot-wrap">

  <div class="topline">
    <div class="brand">
      <div class="mark"></div>
      <div>SUBDOLA LEPUS / TERMINAL BOOT</div>
    </div>
    <div id="timeText">00:00</div>
  </div>

  <div class="main">
    <section class="left">
      <div class="kicker">SYSTEM INITIALIZATION</div>
      <h1 class="title">ARCHIVE NODE<br>STARTUP</h1>
      <div class="subtitle">
        啟動資料終端、索引快取與限制區域驗證模組。<br>
        此畫面可作為網站的開機首頁、進入動畫頁，或跳轉到主終端前的前置頁面。
      </div>

      <div class="boot-panel">
        <div class="label-row">
          <span>BOOT SEQUENCE</span>
          <span id="percentText">0%</span>
        </div>

        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="statusText">Initializing core system...</div>

        <div class="enter-area" id="enterArea">
          <button class="enter-btn" onclick="enterTerminal()">ENTER TERMINAL</button>
          <div class="enter-note">按 Enter 也可以進入 <span class="blink">_</span></div>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="side-title">SYSTEM LOG</div>
      <div class="log" id="logBox"></div>

      <div class="sys-grid">
        <div class="sys-row">
          <span>NODE</span>
          <span>ARCHIVE-01</span>
        </div>
        <div class="sys-row">
          <span>MODE</span>
          <span>BOOT / WARM START</span>
        </div>
        <div class="sys-row">
          <span>ACCESS</span>
          <span>L-02</span>
        </div>
        <div class="sys-row">
          <span>THEME</span>
          <span>DARK SAND GOLD</span>
        </div>
      </div>
    </aside>
  </div>

  <div class="corner">BOOT</div>
</div>

<script>
const progressFill = document.getElementById("progressFill");
const percentText = document.getElementById("percentText");
const statusText = document.getElementById("statusText");
const enterArea = document.getElementById("enterArea");
const logBox = document.getElementById("logBox");

const logLines = [
  ["[ OK ]  Establishing terminal core", "ok"],
  ["[ OK ]  Mounting subject archive", "ok"],
  ["[ OK ]  Syncing event records", "ok"],
  ["[ OK ]  Loading IF / PARO branches", "ok"],
  ["[ OK ]  Validating restricted sector", "warn"],
  ["[ OK ]  Applying theme: DARK SAND GOLD", "ok"],
  ["[ OK ]  Session key accepted", "ok"],
  ["[DONE]  Startup sequence complete", "ok"]
];

const statusSteps = [
  {p:8,  t:"Initializing core system..."},
  {p:22, t:"Mounting archive storage..."},
  {p:37, t:"Loading subject index..."},
  {p:51, t:"Syncing records..."},
  {p:68, t:"Checking branch data..."},
  {p:84, t:"Verifying access permissions..."},
  {p:100,t:"Boot complete. Terminal ready."}
];

let current = 0;
let logIndex = 0;

function appendLog(text, cls=""){
  const line = document.createElement("div");
  line.className = "log-line " + cls;
  line.textContent = text;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

function runBoot(){
  const timer = setInterval(()=>{
    current += Math.floor(Math.random() * 7) + 3;
    if(current > 100) current = 100;

    progressFill.style.width = current + "%";
    percentText.textContent = current + "%";

    for(const step of statusSteps){
      if(current >= step.p){
        statusText.textContent = step.t;
      }
    }

    if(logIndex < logLines.length && current >= (logIndex + 1) * 12){
      appendLog(logLines[logIndex][0], logLines[logIndex][1]);
      logIndex++;
    }

    if(current >= 100){
      clearInterval(timer);
      while(logIndex < logLines.length){
        appendLog(logLines[logIndex][0], logLines[logIndex][1]);
        logIndex++;
      }
      enterArea.classList.add("show");
    }
  }, 260);
}

function updateClock(){
  const text = new Date().toLocaleTimeString("zh-TW",{
    hour:"2-digit",
    minute:"2-digit"
  });
  document.getElementById("timeText").textContent = text;
}

function enterTerminal(){
  /* 這裡改成你的主頁網址 */
  window.location.href = "dashboard.html";
}

document.addEventListener("keydown",(e)=>{
  if(e.key === "Enter" && enterArea.classList.contains("show")){
    enterTerminal();
  }
});

updateClock();
setInterval(updateClock,10000);
runBoot();
</script>

</body>
</html>
