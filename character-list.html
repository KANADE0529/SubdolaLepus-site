<!DOCTYPE html>

  <main class="page">
    <div class="top">

    <span class="tag">Archive</span>
  </div>

 <section class="grid" id="characterGrid">

    </div>
  </div>

  <div class="card" onclick="location.href='character-profile.html?id=claire'">

      <img class="card-layer hover" src="images/claire-hover.png" style="width:200%;height:200%;object-fit:cover;object-position:70% 30%;">

<div class="card" onclick="location.href='character-profile.html?id=rozelia'">

<img class="card-layer base" src="images/rozelia-normal.png"

<img class="card-layer hover" src="images/rozelia-hover.png"

</div>
