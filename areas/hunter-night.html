<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>獵者之夜</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(12, 11, 14, 0.96);
      --panel-2: rgba(18, 14, 13, 0.92);
      --frame: rgba(220, 120, 48, 0.24);
      --frame-soft: rgba(255, 180, 120, 0.08);
      --text-main: #fff3ea;
      --text-soft: rgba(255, 220, 198, 0.62);
      --text-dim: rgba(255, 210, 185, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(rgba(255,140,60,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.06) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px, 12px 12px, 12px 12px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(200,90,28,.18), transparent 26%),
        radial-gradient(circle at top right, rgba(255,150,80,.10), transparent 20%),
        radial-gradient(circle at bottom, rgba(140,50,10,.14), transparent 30%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .log-panel {
      position: relative;
      width: min(1180px, 100%);
      min-height: 680px;
      max-height: calc(100vh - 56px);
      display: grid;
      grid-template-rows: auto 1fr;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--frame);
      background: linear-gradient(180deg, rgba(14,12,14,.98), rgba(8,9,12,.98));
      box-shadow: 0 0 0 1px var(--frame-soft) inset, 0 0 72px rgba(120,40,10,.32);
    }

    .log-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,140,60,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.08) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: .24;
      pointer-events: none;
    }

    .log-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(220,120,48,.18);
      background: linear-gradient(90deg, rgba(200,90,28,.12), rgba(0,0,0,0));
    }

    .log-kicker {
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(240,176,138,.52);
    }

    .log-area-title {
      margin: 8px 0 4px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
      text-shadow: 0 0 18px rgba(255,120,48,.12);
    }

    .log-area-subtitle {
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,210,185,.52);
    }

    .log-close {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(220,120,48,.22);
      border-radius: 14px;
      background: rgba(18,14,13,.88);
      color: #ffe9dc;
      font-size: 20px;
      box-shadow: 0 0 0 1px rgba(255,170,120,.05) inset;
      cursor: pointer;
    }

    .log-close:hover {
      border-color: rgba(255,170,120,.4);
      box-shadow: 0 0 12px rgba(255,140,60,.2);
    }

    .log-body {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .log-sidebar {
      padding: 18px;
      border-right: 1px solid rgba(220,120,48,.14);
      background: linear-gradient(180deg, rgba(20,14,12,.84), rgba(12,11,13,.74));
      overflow: auto;
    }

    .log-view-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .log-view-btn {
      width: 100%;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      border-radius: 12px;
      border: 1px solid rgba(220,120,48,.18);
      background: rgba(24,16,13,.6);
      color: var(--text-soft);
      cursor: pointer;
      transition: all .18s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
      white-space: nowrap;
    }

    .log-view-btn.active {
      background: rgba(120,48,18,.7);
      color: var(--text-main);
      border-color: rgba(255,170,100,.4);
      box-shadow: 0 0 10px rgba(200,90,28,.2);
      transform: translateY(-1px);
    }

    .locked-view-btn {
      color: rgba(255, 190, 170, 0.82);
      border-color: rgba(255, 110, 90, 0.24);
      background: linear-gradient(180deg, rgba(70,18,18,.55), rgba(28,10,10,.62));
      text-shadow: 0 0 8px rgba(255, 90, 70, 0.18);
    }

    .locked-view-btn:hover {
      border-color: rgba(255, 120, 95, 0.42);
      box-shadow: 0 0 14px rgba(255, 90, 70, 0.14);
    }

    .locked-view-btn.denied {
      color: #ffd8ce;
      border-color: rgba(255, 130, 110, 0.55);
      background: linear-gradient(180deg, rgba(120,30,24,.72), rgba(48,14,12,.78));
      box-shadow: 0 0 18px rgba(255, 90, 70, 0.22);
      letter-spacing: .08em;
    }

    .log-sidebar-title {
      margin: 0 0 14px;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,210,185,.48);
    }

    .log-episode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-episode-btn {
      width: 100%;
      text-align: left;
      padding: 14px 14px 13px;
      border: 1px solid rgba(220,120,48,.12);
      border-radius: 16px;
      background: rgba(24,16,13,.72);
      color: #ffece1;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .log-episode-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,160,90,.34);
      background: rgba(54,28,17,.78);
    }

    .log-episode-btn.active {
      border-color: rgba(255,170,100,.42);
      background: linear-gradient(180deg, rgba(120,48,18,.68), rgba(54,24,15,.82));
      box-shadow: 0 0 18px rgba(200,90,28,.18);
    }

    .log-episode-no {
      display: block;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
    }

    .log-episode-label {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--text-soft);
    }

    .log-content {
      padding: 24px 28px 28px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .log-content-head {
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(220,120,48,.12);
      margin-bottom: 18px;
    }

    .log-entry-kicker {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .log-entry-title {
      margin: 10px 0 0;
      font-size: 24px;
      letter-spacing: .06em;
      color: var(--text-main);
    }

    .log-entry-text {
      white-space: pre-wrap;
      line-height: 2.05;
      color: rgba(255,236,224,.82);
      font-size: 17px;
    }

    .log-content.is-switching .log-content-head,
    .log-content.is-switching .log-entry-text {
      animation: viewSwapFade .32s ease;
    }

    .log-content.is-switching::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(255,140,60,.08) 48%, rgba(255,220,190,.18) 50%, rgba(255,140,60,.08) 52%, transparent 100%);
      mix-blend-mode: screen;
      animation: viewScan .32s ease;
    }

    .log-panel.locked {
      animation: lockedFlash 0.4s ease;
    }

    @keyframes lockedFlash {
      0% { filter: brightness(1); transform: translateX(0); }
      20% { filter: brightness(1.6); transform: translateX(-3px); }
      40% { filter: brightness(0.7); transform: translateX(3px); }
      60% { filter: brightness(1.4); transform: translateX(-2px); }
      100% { filter: brightness(1); transform: translateX(0); }
    }

    @keyframes viewSwapFade {
      0% { opacity: .2; transform: translateY(8px); filter: blur(4px); }
      55% { opacity: .82; transform: translateY(0); filter: blur(1px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes viewScan {
      0% { opacity: 0; transform: translateX(-28%); }
      30% { opacity: .85; }
      100% { opacity: 0; transform: translateX(28%); }
    }

    @media (max-width: 900px) {
      .page { padding: 14px; }
      .log-panel {
        min-height: auto;
        max-height: calc(100vh - 28px);
      }
      .log-body {
        grid-template-columns: 1fr;
      }
      .log-sidebar {
        max-height: 220px;
        border-right: 0;
        border-bottom: 1px solid rgba(220,120,48,.14);
      }
      .log-view-switch {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="log-panel" role="dialog" aria-modal="true" aria-labelledby="logAreaTitle">
      <header class="log-header">
        <div>
          <div class="log-kicker">Operation Log</div>
          <h1 class="log-area-title" id="logAreaTitle">獵者之夜</h1>
          <div class="log-area-subtitle" id="logAreaSubtitle">Hunter Night</div>
        </div>
        <button class="log-close" id="closeBtn" type="button" aria-label="關閉">×</button>
      </header>

      <div class="log-body">
        <aside class="log-sidebar">
          <div class="log-view-switch" id="logViewSwitch"></div>
          <h2 class="log-sidebar-title">檔案索引</h2>
          <div class="log-episode-list" id="logEpisodeList"></div>
        </aside>

        <article class="log-content">
          <div class="log-content-head">
            <div class="log-entry-kicker" id="logEntryKicker">共通紀錄</div>
            <h2 class="log-entry-title" id="logEntryTitle">01｜夜間紀錄</h2>
          </div>
          <div class="log-entry-text" id="logEntryText"></div>
        </article>
      </div>
    </section>
  </main>

  <script>
 const LOG_PREVIEW_DATA = {
  "area": "獵者之夜",
  "subtitle": "hunter night",
  "viewGroups": [
    {
      "id": "yan",
      "label": "姜燕"
    },
    {
      "id": "area-extra",
      "label": "綜合故事"
    }
  ],
  "episodes": [
    {
      "no": "【番外】",
      "label": "康復後的第一堂課",
      "availableViews": [
        "area-extra"
      ],
      "content": {
        "yan": "無。",
        "area-extra": "　　「首先，恭喜妳終於康復了，戴莉同學。」瑪莉亞抬了抬眼鏡……正確來說就是個鏡框，瑪莉亞的眼力相當好(？)，上次檢查仍舊擁有2.0的絕佳視力——雖然只有左眼就是了。\n　　「謝，但是為什麼我要在這裡？」戴莉的臉上還有一個鮮紅的掌印，那是五分鐘前瑪莉亞“親切”的印上去、為了表達自身對她的擔心的證明。\n　　「戴莉終於能跟我們一起出任務了！好開心！」姜燕在位置上開心的揮著手，像是剛上學的小學生。\n　　「妳高興的話為什麼她剛剛打我一巴掌妳不阻止她？啊？說個理由來聽聽啊？」戴莉憤恨的轉頭瞪她，雖然瑪莉亞用盡全力的一掌只是有點痛而已，但掌印還是確實留下了。\n　　「啊……這個……」姜燕心虛的眼神閃爍，手指不安的交織著擺動，吞吞吐吐的開口:「瑪莉亞說如果我阻止的話就連我一起打……」\n　　「她力氣那麼小妳到底在怕什麼鬼？」戴莉不滿的站起來戳著姜燕的腦袋：「她就算一拳打過來受傷都不會，妳怕什麼？她打妳妳就抓住她的手把她甩出去啊？」\n　　「上次不就用了權能把戴莉打成全身骨折了不是嗎……」姜燕越說越小聲:「所以我不敢惹瑪莉亞生氣嘛……」\n　　「……」\n　　戴莉講不出話了，要是瑪莉亞浪費權能給自己一巴掌今天再飛出去一次的會是她，想完、她坐了回去撐著臉：「快點，又要做什麼？」\n　　「非常謝謝兩位的賞臉，那麼我們來開始最重要的課程吧。」\n　　現在地為夜梟小隊使用的教學室，雖然位置不多但是三個人使用已經綽綽有餘了。\n　　「妳們認為這次殉教者山丘任務失敗的最主要原因是什麼？」瑪莉亞凌冽的目光在兩人身上來回移動，最後指著戴莉：「戴莉同學，妳來回答。」\n　　「我怎麼知道？而且這次任務哪裡失敗了？」戴莉沒好氣的說：「實力不夠？妳們不夠努力？亂開狂犬和權能？」\n　　「雖然這些都是原因，但最主要的不是這個。」瑪莉亞搖搖頭，直直看向戴莉的紫眸、非常認真的開口：「原因是妳不夠相信我和姜燕。」\n　　「妳沒有和我們談過、也沒有透露半點消息就自己跑出去找火焰王之女，才會導致後來的情況。」瑪莉亞語氣有些沉重，裡面帶著悲傷以及幾乎微不可察的失望：「要是妳開口的話，很可能後面的事情不會發生、就算還是發生了我們也能夠定制對策，妳懂嗎？」\n　　「……」\n　　戴莉啞口無言，撇著嘴將眼神和目光轉向旁邊，明顯她現在是知錯的、但她不想直接承認。\n　　面對這樣的戴莉，瑪莉亞早就習慣了，她熟悉的戴莉是絕對不會輕易開口道歉的人，所以這樣的態度完全在預測內。\n　　「不過這次的事情也給了我們各自很大的學習空間，所以我希望之後我們可以有什麼煩惱都說出來。」\n　　「我什麼都會跟瑪莉亞說的！」姜燕舉手高聲回答：「我世界上最相信瑪莉亞、戴莉和美英監督了！」\n　　「是是是，我知道的。」瑪莉亞點點頭，有些好笑的嘆氣。\n　　姜燕腦子單純，基本上藏不住什麼秘密，雖然大部分時候這是好處、但有時候更要小心不能讓她知道太多。\n　　「那妳敢保證妳就沒有藏著什麼秘密嗎？」戴莉叉腰，露出狡詐的笑：「像妳這種秘密那麼多的人不可能什麼都沒藏吧？」\n　　瑪莉亞感覺有什麼被卡在喉嚨裡，要說秘密的話她當然有、而且是打死都不會說的秘密，但她在停頓了半秒後理直氣壯的回：「有又怎樣？我說的是煩惱！我是希望大家不要總是想著自己解決，多依賴身邊的人。」\n　　「好、都給妳說就行了。」戴莉聳肩，沒有表示反對，更多的是她知道這次自己理虧。\n　　「那我最大的煩惱應該是戴莉和瑪莉亞會不會討厭我了。」姜燕說，趴在桌上露出苦惱的樣子：「要是有天戴莉和瑪莉亞討厭我了怎麼辦？」\n　　「不用等有天，我就沒喜歡過妳。」戴莉撇嘴，有時候她真的恨透姜燕這白癡，但根本是麻煩製造機，而且生活完全不能自理。\n　　「真的嗎？戴莉一直都很討厭我嗎？」戴莉的背後傳來啜泣聲，姜燕的眼淚化為珍珠一顆一顆掉的桌上：「我做了什麼嗎？我可以改的，拜託戴莉不要討厭我好不好？」\n　　持續的哭聲讓戴莉很頭痛，她轉身過去戳姜燕的腦袋，怒氣快要壓不住：「我就討厭妳這個動不動就很白癡的臉跟腦袋！妳能換掉再跟我說話！」\n　　「好了啦，戴莉妳也不要說那麼過分的話。」瑪莉亞走過去抱住姜燕，摸了摸她的腦袋安撫她：「戴莉本來就這脾氣而且口是心非的，妳不要太在乎她說話啦。她根本不討厭妳，不然怎麼每天晚上都一起睡覺、對不對？」\n　　「真的嗎？」姜燕蓄滿淚水的眼睛看向她，戴莉咬了咬牙最後吐出兩個字：「隨便。」\n　　「她說對。」瑪莉亞翻譯。\n　　「……」戴莉不知道是怒意還是害羞，重重的錘了一下桌子起身，轉頭就從教學室出去。\n　　瑪莉亞在她身後喊：「喂，剛剛說的妳到底有沒有聽進去？」\n　　「聽三小聽？等妳是我媽的時候再來講啦！我媽都沒管過我了！」\n　　「講的像妳有一樣！」瑪莉亞嘴角帶笑，高聲刺激走出去的戴莉：「我們三個誰出生有媽？」\n　　「瑪莉亞·薩圖恩妳她媽——」暴怒的戴莉聲音由遠及近、最後門被甩開，戴莉紅著臉準備開罵，但又戛然而止：「妳今天想打一架我……」\n　　瑪莉亞兩眼看著她、至高的圖紋隱隱浮現在眼角，鼻子流出一行血、用玩味的笑容直直看著她。\n　　姜燕縮在瑪莉亞身後抓著她的衣角看起來已經被嚇死了。\n　　「行，女人妳行。」戴莉收了收因憤怒而漲紅了臉色，雖然沒完全退去，但是表情已經變得冷靜：「現在開始妳是我媽，我什麼都聽妳的，可以吧？」\n　　隨後從腰包中丟了一包衛生紙到她旁的桌上，擺著臉色坐了下來。\n　　「我、我就說不要讓瑪莉亞生氣吧……」姜燕小聲的說，隨後得到了戴莉的怒瞪。\n　　「只要妳通情理就好。」瑪莉亞收起全能拿衛生紙把鼻血擦了擦，像是無事發生一樣:「我希望我們之間可以好好溝通，不要再發生不必要的傷害，畢竟我們是一個團隊的。」\n　　「姜燕也是，有什麼煩惱都要跟我們說喔，不要一個人解決。」她揉了揉姜燕的腦袋，她眼角還掛著淚珠、瘋狂點頭。\n　　「哼。」戴莉撇過臉，用默認當作回應。\n　　「啊，妳們都在這裡啊？」姜美英找了整個城堡終於在教學室找到了三個人，她看著氣氛詭異的三人摸不著頭腦，但看起來也沒打架就不想管了：「今天戴莉要健康檢查回診，既然你們三個都在的話就順便一起去做檢查吧。」\n　　「尤其是瑪莉亞，妳可是差點死了，不可以耍賴！燕、戴莉，妳們兩個把她抓過去，牢牢抓緊知道嗎？」\n　　「哈！這我就非常願意做了。」戴莉彷彿重新掌握主權一樣露出平時狡猾的笑，對姜燕發出指令：「姜燕！抓好瑪莉亞的腳！」\n　　「等等、我很健康根本就不需要什麼檢查……姜燕，鬆開我！」瑪莉亞想跑的時候已經來不及了，姜燕動手很快、直接抓住她的雙腿不給她飛起來的機會，戴莉則趁機扛起瑪莉亞，瑪莉亞奮力掙扎：「戴莉！我、我才不要做什麼健康檢查！我很健康！聽到了沒有，我很健康啊！」\n　　「聽不見、我什麼都聽不見。」礙於瑪莉亞力氣小的可憐，她的掙扎幾乎不見效果，她望著戴莉因嘲笑揚起的眼角，露出楚楚可憐、對姜燕幾乎百分百有效的亮晶晶目光：「……戴媽媽？」\n　　「妳今天叫我爸都沒用。」戴莉紋絲不動，和姜燕扛著瑪莉亞離開。\n　　「至少不要打針、不要抽血檢查，好不好？」\n　　「那又不是我說了算，但按照平時檢查、妳八成得抽血。」\n　　「不要啦！我不要抽血啦！」\n　　「我不要啦——！」"

        "yan": "　　我總是被說很笨。\n　　不過這是事實，我確實頭腦不太好、美英監督說是我小看了人們的惡意、所以腦袋才會轉不過來，總是輕易相信周遭的人，所以才會被騙。\n　　她又說:「明明是貧民窟的孩子，為什麼總是這麼單純的相信人的好意呢？」\n　　這個答案，我也是不知道的。\n　　我幾乎沒有進入波拉里斯學院之前的記憶，可以說是我回神過來就去搶了美英監督的包包、轉眼間就被丟進學校中，展開了全新的生活。我總覺得自己身上還有什麼秘密、這是某種直覺，而我的直覺非常準確，但這份秘密目前還沒有揭露出來、我也還沒想起來，所以我也就持續保持著。\n　　在戴莉和瑪莉亞面前是我最快樂的時候，雖然兩人常常對著我皺眉頭，但實際上永遠是最關心我的人之一、總是在背後推著我一同前行，所以我最喜歡她們了！\n　　戴莉總是敲我的腦袋，或是把我揍一頓，我從不還手、因為她很溫柔，只是無法好好的說出來，而且那只是害羞的一種形式，她打我從來都不痛、只是我會習慣性喊兩聲說好痛。\n　　瑪莉亞總是長長地對我嘆氣，因為會議上的東西我都聽不懂，她皺著眉仔細思索要怎麼和我解釋，但我從來沒有在她臉上看到對我不耐煩的表情，只是苦惱著、煩惱怎麼更好地傳達給我。\n　　我很笨，力氣又很大、除了戰鬥什麼都不會做，所以我其實在她們面前抬不起頭。但是我不想讓她們擔心我！所以我總是露出笑臉、做著那個天真無邪的姜燕，因為我不用擔心我會被她們討厭，而且這就是最真實的我自己。\n　　就算在她們心中我可能是一條寵物狗也沒什麼關係，我最大的願望就是能夠為她們所用，成為她們最鋒利的刀刃、也是最堅實的牆壁，只是這點事情的話無論她們要我做什麼我都會答應然後好好完成的。\n　　畢竟我很笨，只能做到這些事情了。\n　　1.【狂犬】\n　　「姜燕……姜燕！」戴莉的聲音撞進我的意識中，我看著巨劍縫隙後她咬著牙冒汗的臉，認知才逐漸交織回籠、然後有些呆滯的看著她。回過頭，瑪莉亞不知道何時在我的身後，整顆頭都赤紅著雙手抱住我的腰往後扯像是在阻止我一樣，但因為她沒有力氣的關係所以比較像是吊飾一樣掛在我身上。\n　　見我停了下來，戴莉長呼一口氣收起了西洋劍，繞過我的劍來到我身側伸手就往我的腦袋敲下去：「白癡，妳到底在幹什麼！」\n　　「好痛！」我抱著腦袋鬆開了劍，下意識蹲在地上抱怨：「為什麼又突然敲我了？剛剛不是在練習戰嗎？」\n　　「乖、不痛喔……」瑪莉亞少見的彎下腰摸摸我的腦袋安慰，同時又帶著緊張的語氣和我說：「剛剛打到一半突然狂犬小燕就跑出來了，明明平時這種程度而且沒有指令的話是不會出來的，但就突然出現了。戴莉才剛拆石膏，只能一邊躲一邊喊妳，喊了快十分鐘妳才回神過來。」\n　　「要我說絕對是妳這傢伙剛剛發呆一不注意才會讓那條瘋狗跑出來。」戴莉扶著被大劍的震盪而差點再度受損的手腕，皺著眉很是生氣：「監督不是講了好幾次戰鬥中禁止恍神嗎？就算妳再怎麼靠直覺戰鬥，分神是絕對不可以的吧？妳是打算殺了我嗎？」\n　　「我、我不知道……」沮喪地低下頭，我語氣中滿是愧疚和不確定：「剛剛有一瞬間我不知道自己在哪、我甚至不知道自己在幹嘛……對不起，戴莉。」\n　　「我、我又不是真的怪妳！」戴莉臉色很難看、像是異物卡在喉頭一樣，但大概也不知道能說什麼，所以青著臉轉頭就走進城堡中。\n　　「姜燕，可以和我聊聊嗎？」瑪莉亞仍舊輕輕揉著我的腦袋，語氣柔和的安慰：「我跟戴莉都知道妳不是故意的，畢竟妳就是這種人嘛。但考慮到戴莉還沒完全痊癒，為了防止這件事情再次發生，我們來一起找找看問題在哪吧。」\n　　-\n　　「那麼，妳剛剛練習中在想什麼呢？」瑪莉亞直直地看著我的眼睛，我讀不出來她的情緒，但可以感受到她在關心我、同時又有些緊張。\n　　大概是因為不久前戴莉被洗禮的事情，我是這樣猜測的，畢竟戴莉剛回來、也才剛康復，所以她內心還存有不安。\n　　「嗯……剛剛我還是很認真的在戰鬥的，雖然控制力道不要打傷戴莉還是比較困難的，但因為美英監督說這樣可以更好的鍛鍊自己精神面，所以我很認真的的對待。」畢竟戴莉目前身體狀況還是不太能去前線，所以對練除了幫助戴莉提早恢復正常外、還有訓練應用如何補上戴莉的空缺。然後我更努力的想：「然後……打到一半的時候，我也不知道是什麼時候——總之突然我就放空了，想到了狂犬小燕的事情、突然就失去控制了……因為我意識就中斷了，完全不知道發生了什麼。」\n　　「嗯，想必其中有什麼緣由。」瑪莉亞低著頭思考著，提出了可能的原因：「可能是太久沒有放出來了，所以這次使用的時候產生的後遺症，如果不集中精神的話即使稍微亢奮一點都有可能會狂化。」\n　　「真的很對不起……下次我會注意的！」我雙手合十道歉，瑪莉亞這次微笑的擺擺手，表示沒事。\n　　「接好！」戴莉的聲音出現，我和她都轉頭望向聲音來源，兩罐飲料從空中飛出，我反應極快的接住飲料，將其中一瓶遞給瑪莉亞。\n　　「還以為妳回房間生悶氣睡覺了呢。」瑪莉亞揶揄笑道，戴莉不滿撇下嘴打開手中的飲料一口灌下去，然後隨手丟進垃圾桶中。\n　　「剛剛是去了，但睡不著，出來買點喝的剛好走過來而已。」她撇過頭，雖然看起來還是在生氣但我已經注意到她只是有些害羞了。\n　　「戴莉，剛剛真的對不起！」我朝她跑去然後在她面前跪下道歉，她後退了兩步看起來有些不可置信。我雙手趴地繼續道歉：「如果妳真的很生氣的話就直接踹我兩腳吧！」\n　　「幹、幹什麼東西啊？」戴莉的聲音聽起來很震驚，隨後是小聲的碎念：「一個兩個的……今天是水星逆行嗎我……」\n　　在我還沒理解她說的話的時候，又一道聲音響起：「喂，是誰把夜梟城堡旁邊的自動販賣機踢壞啊？現在飲料一直噴出來！趕快給我自首，不然我等等就把三個人都吊起來扁！」\n　　美英監督憤怒的聲音從一旁傳來，戴莉臉色一變、繞過了我直直往城堡內快走過去：「真的想道歉的話幫我擋一下！我溜了！」\n　　「……」我和瑪莉亞相望幾秒，接著我跳起來衝了出去：「抱歉美英監督！剛剛我去買的時候看它沒有掉飲料下來就踹了一下！我什麼都會做的！對不起！」\n　　「欸、姜燕，等等……」\n　　「姜•燕！妳又不是不知道妳力氣多大！妳真的是——」\n　　2.【人、鳥、魚】\n　　「不過還是好奇怪啊……」\n　　夜半時分，我難得失眠了。\n　　平時我只要躺下去就睡著了，但現在過了半個小時我還在看著天花板。\n　　側臉過去看著戴莉還有緊鄰戴莉的瑪莉亞，我內心深處感覺有點怪異，但又不知道怎麼說。\n　　到底為什麼會突然失控呢？是因為太久沒有解放小燕子了嗎？\n　　但是我不想傷害大家、到底該怎麼辦才好……\n　　「有什麼好奇怪的？」\n　　回神過來我看見了對面有個長得和我一模一樣的人，但氛圍感不一樣、有種更加瘋狂的——\n　　「妳是誰？」\n　　我把疑問說出口，但她沒有回答、只是嘲諷的笑了笑，朝著我靠近了兩步。\n　　「我是誰應該不重要，我只是趁那個傢伙不在所以悄悄出現而已。」她思索的說著，隨後不在意的聳聳肩：「總之，我是來和妳談條件的。」\n　　「什麼條件？」我問，但直覺告訴我她可能不懷好意。\n　　「『她絕對不懷好意對吧』……妳是這麼想的吧？」\n　　「……！」\n　　「不是我長得像妳，是我本來就是妳。我是藏在妳心中的本能、野性、更深層的直覺……這樣說妳可以理解嗎？」\n　　「稍微有點理解……應該。」\n　　「唉，也不知道是哪邊的哪位把妳的智慧收走了，所以才會這麼難跟妳溝通。」她抓了抓散亂的頭髮、神情不滿，但之後又話題一轉：「妳現在在煩惱在無意識的時候會狂化對吧？這其實不能完全怪妳無法控制，這只是被釋放出來的野性沒有被完全收回來而已。」\n　　「所以我在這裡向妳提議，把主權暫時交給我、不用一週我就可以把那些東西收回來，畢竟本來就是我的東西，是個不錯的交易對吧？」\n　　雖然聽起來好像不錯、但我看著她卻感覺不到她在這番話中的真心，像是某種精打細算的計謀在黑暗中編織著。\n　　「看看妳這戒備的樣子，我可沒有騙妳喔？」她聳聳肩，露出自信的樣子：「光憑妳是收不回那些“被遺棄的東西”的，不如就由我收回這些“本來就是我的東西”，是划算的交易吧？」\n　　「一週……不，就給我五天好了，妳就可以繼續用妳喜歡的樣子待在那兩人的身邊。而我可以稍微呼吸一下，幫妳把廢棄物回收……妳要想清楚這其中的代價可是輕到不能再輕了。」\n　　「嗯……這樣的話……」\n　　「這話人家可不能當作沒有聽見。」同樣是我、但稚嫩的聲音從背後響起，面容同樣是我但卻嬌小很多，是個看起來大約只有十歲的小女孩。她穿著有些華麗的裙子，腳上卻纏繞著魚影的紋路。\n　　她緩緩走到我身前，抬著下巴不確定是傲慢還是身高太矮，瞪著面前另一個散髮的我：「趁人家不在的時候打算偷她的身體！本來想觀望一下的，但妳想騙她的身體，這我絕對不能當作沒看見。」\n　　「嗚哇——說話文縐縐的傢伙出現了。」她晃著手露出厭惡的神情，擺明了和她合不來。\n　　「妳也是！怎麼可以被她牽著鼻子走？」她轉過身罵我，小小的身子感覺很沒有魄力，有種別樣的可愛感。\n　　「妳又是誰？」我問，感覺今天長得像我的人出現的有點多。\n　　笨蛋的我、野性的我、嬌小的我，嗯……總感覺好麻煩喔！想不透現在是什麼情況。\n　　要是瑪莉亞在就好了……\n　　「人家……算了，妳馬上就會想起來了，我們換個地方說話吧。」嬌小的我打了一個響指，黑暗迅速退去、突然出現的光亮照的我措手不及，閉上了眼。幾秒鐘後適應了光線的我再度睜開眼，諾亞在不遠處看著我們，緩緩向我們過來。\n　　「這裡是……圖書館？」我帶著疑惑再度看向嬌小的我，她不安的目光與我對視片刻後與她相聯的記憶竄入我腦中，像是積滿灰塵的相簿被打開一樣，見我有些呆滯，她——縱慾王之女開口問：「想起來了嗎？我是被妳拋棄的記憶。」\n　　「哇靠，這裡亮到我要瞎了。」野性的我用手遮住光線，隨後接過諾亞遞上的墨鏡戴上：「活了這麼久也沒看過兩次這麼亮的地方，這邊的書拿去賣能不能有很多錢啊？」\n　　「這邊的書和妳一樣都是出不去意識的世界的，因為這裡是存在於精神世界的博物館。」諾亞嘆氣，隨後轉向縱慾王之女：「縱慾王之女，妳帶朋友來玩了呢。」\n　　「全部都是我，好像也算不上朋友。」她有些嫌棄的回應，指著我們兩個說：「這個是拋棄我的那個，這個是負責當看門狗的那個。」\n　　「什麼叫做看門的啊！」戴墨鏡的我發起強烈的抗議：「我是不想出來才沒出來的！」\n　　「隨便啦，我又不在乎妳。」縱慾王之女揮揮手不去理會抗議的她，四處張望發現這裡沒有其他人後轉頭詢問諾亞：「那兩個人呢？」\n　　「本來想趁她們睡著的時候帶過來的，但是剛剛小燕……野性的姜燕趁亂掌控了些許身體操控權打了戴莉兩拳又被妳阻止昏過去了，現在她們正在賞姜燕巴掌想把她叫醒。」\n　　諾亞唯唯諾諾的說，臉上寫滿抱歉。\n　　「那直接把她們叫過來就好了啊。」縱慾王之女稍微窺見了外面的世界，微微皺起眉頭露出錯愕的神色，隨後打個響指—–戴莉和瑪莉亞穿著睡衣掉到了地板上，尤其戴莉還被瑪莉亞壓在地上。\n　　3.【智慧與野性】\n　　「好痛！瑪莉亞妳最近吃太多了吧！」戴莉掙扎著爬起來抱怨，瑪莉亞則是紅著臉挪開自己身體，感覺說什麼都不太對。\n　　「戴莉、瑪莉亞！妳們來的正好！」我快步跑上去抱住她們，再不來我感覺腦袋要處理不過來了！\n　　「煩死了，滾開——嗯？」戴莉如平時般推著我，讓我滾遠點，但越過我的肩頭看見了後面那兩個我：「哇靠，做惡夢了、姜燕有三個！」\n　　「妳冷靜點。」瑪莉亞說，但也順著視線望過去：「有一個是縱慾王之女，之前在回憶裡面看過的不是嗎？」\n　　「另一個——」\n　　「玩嘻哈的？」\n　　「誰跟妳玩嘻哈的？我是代表野性與本能的燕！」她憤怒的摘下墨鏡，隨後被強光刺眼又把墨鏡戴了回去：「按照妳們的說法，我就是妳們所知的『狂犬』，懂嗎？」\n　　「喔，原來只是一條瘋狗。」戴莉毫不在乎的說，隨後看向諾亞：「今天真的有夠衰的，練習被狗咬、買東西卡飲料、睡覺還被打，現在又是搞哪齣，姜燕的多重人格？」\n　　「還是先介紹一下吧，雖然之前見過面了，但還沒有說的很清楚。」縱慾王之女眉頭微皺，但還是擺出端正的姿態微微彎腰招呼：「我是“原”縱慾王之女，是沒有名字的燕，同時我負責她的智慧以及執著。」\n　　隨後她指向狂犬小燕：「她是掌管慾望和野性的燕，是還在流浪時候的她，但因為某些原因也被姜燕封印了。」\n　　「那個某些原因是監督嗎？」戴莉抱著手問，似乎有了眉目。\n　　「嗯，對的。」縱慾王之女點點頭。但一旁的野性不是很高興。\n　　「我有個問題。」瑪莉亞舉手發問：「狂犬小燕的事情我明白了，但是為什麼之前沒有看過妳呢？」\n　　「而且聰明程度也完全不一樣。」戴莉補了一句。\n　　「……」縱慾王之女臉色難看的撇過臉，似乎不是很想回答。但又覺得什麼都不說也不太行，於是伸手拉了拉諾亞的袖子。\n　　「我來進行說明吧。」諾亞點點頭便開始解釋：「當時縱慾王之女與 D 伯爵奠定賭約，最後賭約妳們都知道是縱慾王之女輸了、但之後姜燕表示『想要維持現在的自己』於是將縱慾王之女的事情封印在書中交由我保管，於是縱慾王之女只能出現在圖書館之中、相關記憶在姜燕願意解封前妳們都是無法帶到圖書館和劇場之外的。」\n　　「關於智慧的方面……由於我被封印了，所以我所掌控的智慧也被封印起來，所以姜燕才會是現在這樣、最純真的模樣。」縱慾王之女複雜的看了我一眼，最後頹然地輕聲解釋。\n　　總感覺她有什麼想說的，但最後想了很久又不打算說出口了。\n　　「姜燕……妳好糟糕啊。」瑪莉亞思考了半晌似乎是想通了，少見的用譴責的表情看向我，讓我心跳漏了半拍感覺有點心慌。但她只是嘆氣，走向縱慾王之女後摸了摸她的頭：「抱歉喔，我們家姜燕讓妳受委屈了，我幫你教訓她。」\n　　「瑪莉亞、我……」我想要解釋什麼，但腦袋中卻無法產生為什麼要道歉的理由、還有要怎麼道歉才好。\n　　「姜燕。」瑪莉亞看向我，眼神和語氣都非常平淡，但我卻能在她的眼中看到小小的失望。她大概意識到了什麼，深呼吸後神情恢復往常那樣，只是看起來有點尷尬：「姜燕……以我們的立場來說可能沒辦法對妳的決定說什麼，但是妳看看這孩子、她可是很受傷的喔？她抱持著多大的希望一直在封印中等待……但最後妳卻再度拋下她了。」\n　　「我……」我張著嘴半句話說不出來，內心也越來越緊張、像是想說的話糾結成一團毛球卡在喉嚨裡面一樣。\n　　「她可是最初的妳，現在妳長大了卻又否定人家的存在，這不是應該要道歉嗎？」戴莉重重的拍了一下我的腰，眼神無法形容但看起來有點失落。隨後又恢復平時有些尖銳的樣子：「苦是她受的、選擇也是她選的，         }

        btn.addEventListener('click', () => {
          if (group.id === 'unknown') {
            playLockedAnimation();
            playDeniedText(btn);
            return;
          }

          if (currentViewId === group.id) return;

          currentViewId = group.id;
          renderEpisodeContent(currentEpisodeIndex);
          playViewSwitchAnimation();
        });

        container.appendChild(btn);
      });
    }

    function playViewSwitchAnimation() {
      const contentEl = document.querySelector('.log-content');
      if (!contentEl) return;

      contentEl.classList.remove('is-switching');
      void contentEl.offsetWidth;
      contentEl.classList.add('is-switching');

      clearTimeout(switchAnimationTimer);
      switchAnimationTimer = setTimeout(() => {
        contentEl.classList.remove('is-switching');
      }, 340);
    }

    function renderEpisodeContent(episodeIndex) {
      currentEpisodeIndex = episodeIndex;
      const episode = LOG_PREVIEW_DATA.episodes[episodeIndex];
      if (!episode) return;

      renderViewSwitch();

      const contentMap = getEpisodeViews(episode);
      const content = contentMap[currentViewId] ?? '此視角尚無內容。';

      const groupLabel = LOG_PREVIEW_DATA.viewGroups.find(v => v.id === currentViewId)?.label || '';
      document.getElementById('logEntryKicker').textContent = groupLabel;
      document.getElementById('logEntryTitle').textContent = `${episode.no}｜${episode.label}｜${groupLabel}`;
      document.getElementById('logEntryText').textContent = content;

      [...document.querySelectorAll('.log-episode-btn')].forEach((button) => {
        const isActive = button.dataset.episodeIndex === String(episodeIndex);
        button.classList.toggle('active', isActive);
      });
    }

    function renderEpisodeList() {
      const listEl = document.getElementById('logEpisodeList');
      listEl.innerHTML = '';

      LOG_PREVIEW_DATA.episodes.forEach((episode, episodeIndex) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.episodeIndex = String(episodeIndex);
        button.className = `log-episode-btn${episodeIndex === 0 ? ' active' : ''}`;
        button.innerHTML = `
          <span class="log-episode-no">${episode.no}</span>
          <span class="log-episode-label">${episode.label}</span>
        `;

        button.addEventListener('click', () => {
          const isSameEpisode = currentEpisodeIndex === episodeIndex;
          renderEpisodeContent(episodeIndex);

          if (!isSameEpisode) {
            playViewSwitchAnimation();
            document.querySelector('.log-content')?.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });

        listEl.appendChild(button);
      });
    }

    function init() {
      document.getElementById('logAreaTitle').textContent = LOG_PREVIEW_DATA.area;
      document.getElementById('logAreaSubtitle').textContent = LOG_PREVIEW_DATA.subtitle;
      renderEpisodeList();
      renderEpisodeContent(0);
    }

    document.getElementById('closeBtn')?.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '../area-extra-records.html';
      }
    });

    init();
  </script>
</body>
</html>
