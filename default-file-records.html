<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>普通檔案紀錄</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(12, 11, 14, 0.96);
      --panel-2: rgba(18, 14, 13, 0.92);
      --frame: rgba(220, 120, 48, 0.24);
      --frame-soft: rgba(255, 180, 120, 0.08);
      --text-main: #fff3ea;
      --text-soft: rgba(255, 220, 198, 0.62);
      --text-dim: rgba(255, 210, 185, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(rgba(255,140,60,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.06) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px, 12px 12px, 12px 12px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(200,90,28,.18), transparent 26%),
        radial-gradient(circle at top right, rgba(255,150,80,.10), transparent 20%),
        radial-gradient(circle at bottom, rgba(140,50,10,.14), transparent 30%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .log-panel {
      position: relative;
      width: min(1180px, 100%);
      min-height: 680px;
      max-height: calc(100vh - 56px);
      display: grid;
      grid-template-rows: auto 1fr;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--frame);
      background: linear-gradient(180deg, rgba(14,12,14,.98), rgba(8,9,12,.98));
      box-shadow: 0 0 0 1px var(--frame-soft) inset, 0 0 72px rgba(120,40,10,.32);
    }

    .log-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,140,60,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.08) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: .24;
      pointer-events: none;
    }

    .log-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(220,120,48,.18);
      background: linear-gradient(90deg, rgba(200,90,28,.12), rgba(0,0,0,0));
    }

    .log-kicker {
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(240,176,138,.52);
    }

    .log-area-title {
      margin: 8px 0 4px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
      text-shadow: 0 0 18px rgba(255,120,48,.12);
    }

    .log-area-subtitle {
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,210,185,.52);
    }

    .log-close {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(220,120,48,.22);
      border-radius: 14px;
      background: rgba(18,14,13,.88);
      color: #ffe9dc;
      font-size: 20px;
      box-shadow: 0 0 0 1px rgba(255,170,120,.05) inset;
    }

.log-close:hover {
  border-color: rgba(255,170,120,.4);
  box-shadow: 0 0 12px rgba(255,140,60,.2);
}

    .log-body {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .log-sidebar {
      padding: 18px;
      border-right: 1px solid rgba(220,120,48,.14);
      background: linear-gradient(180deg, rgba(20,14,12,.84), rgba(12,11,13,.74));
      overflow: auto;
    }

   .log-view-switch {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

    .log-view-btn {
  width: 100%;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .14em;
      border-radius: 12px;
      border: 1px solid rgba(220,120,48,.18);
      background: rgba(24,16,13,.6);
      color: var(--text-soft);
      cursor: pointer;
      transition: all .18s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .log-view-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,220,190,.18) 45%, transparent 70%);
      transform: translateX(-140%);
      opacity: 0;
    }

    .log-view-btn:hover::after {
      opacity: 1;
      transform: translateX(140%);
      transition: transform .45s ease, opacity .2s ease;
    }

    .log-view-btn.active {
      background: rgba(120,48,18,.7);
      color: var(--text-main);
      border-color: rgba(255,170,100,.4);
      box-shadow: 0 0 10px rgba(200,90,28,.2);
      transform: translateY(-1px);
    }

    .log-sidebar-title {
      margin: 0 0 14px;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,210,185,.48);
    }

    .log-episode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-episode-btn {
      width: 100%;
      text-align: left;
      padding: 14px 14px 13px;
      border: 1px solid rgba(220,120,48,.12);
      border-radius: 16px;
      background: rgba(24,16,13,.72);
      color: #ffece1;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .log-episode-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,160,90,.34);
      background: rgba(54,28,17,.78);
    }

    .log-episode-btn.active {
      border-color: rgba(255,170,100,.42);
      background: linear-gradient(180deg, rgba(120,48,18,.68), rgba(54,24,15,.82));
      box-shadow: 0 0 18px rgba(200,90,28,.18);
    }

    .log-episode-no {
      display: block;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
    }

    .log-episode-label {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--text-soft);
    }

    .log-content {
      padding: 24px 28px 28px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .log-entry-text,
    .log-entry-title,
    .log-entry-kicker,
    .log-content-head {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .log-content.is-switching .log-content-head,
    .log-content.is-switching .log-entry-text {
      animation: viewSwapFade .32s ease;
    }

    .log-content.is-switching::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(255,140,60,.08) 48%, rgba(255,220,190,.18) 50%, rgba(255,140,60,.08) 52%, transparent 100%);
      mix-blend-mode: screen;
      animation: viewScan .32s ease;
    }

    .log-content-head {
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(220,120,48,.12);
      margin-bottom: 18px;
    }

    .log-entry-kicker {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .log-entry-title {
      margin: 10px 0 0;
      font-size: 24px;
      letter-spacing: .06em;
      color: var(--text-main);
    }

    .log-entry-text {
      white-space: pre-wrap;
      line-height: 2.05;
      color: rgba(255,236,224,.82);
      font-size: 17px;
    }

    /* Scrollbar 美化 */
    .log-content::-webkit-scrollbar,
    .log-sidebar::-webkit-scrollbar {
      width: 10px;
    }

    .log-content::-webkit-scrollbar-track,
    .log-sidebar::-webkit-scrollbar-track {
      background: rgba(20,14,12,.6);
      border-radius: 10px;
    }

    .log-content::-webkit-scrollbar-thumb,
    .log-sidebar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255,140,60,.6), rgba(200,80,30,.6));
      border-radius: 10px;
      border: 1px solid rgba(255,180,120,.2);
    }

    .log-content::-webkit-scrollbar-thumb:hover,
    .log-sidebar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255,160,90,.8), rgba(220,100,40,.8));
    }

/* 🔒 封鎖效果 */
.log-panel.locked {
  animation: lockedFlash 0.4s ease;
}

@keyframes lockedFlash {
  0% {
    filter: brightness(1);
    transform: translateX(0);
  }
  20% {
    filter: brightness(1.6);
    transform: translateX(-3px);
  }
  40% {
    filter: brightness(0.7);
    transform: translateX(3px);
  }
  60% {
    filter: brightness(1.4);
    transform: translateX(-2px);
  }
  100% {
    filter: brightness(1);
    transform: translateX(0);
  }
}

    @keyframes viewSwapFade {
      0% {
        opacity: .2;
        transform: translateY(8px);
        filter: blur(4px);
      }
      55% {
        opacity: .82;
        transform: translateY(0);
        filter: blur(1px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes viewScan {
      0% {
        opacity: 0;
        transform: translateX(-28%);
      }
      30% {
        opacity: .85;
      }
      100% {
        opacity: 0;
        transform: translateX(28%);
      }
    }

    @media (max-width: 900px) {
      .page { padding: 14px; }
      .log-panel {
        min-height: auto;
        max-height: calc(100vh - 28px);
      }
      .log-body {
        grid-template-columns: 1fr;
      }
      .log-sidebar {
        max-height: 220px;
        border-right: 0;
        border-bottom: 1px solid rgba(220,120,48,.14);
      }
    }

/* 未開放按鈕專屬 */
.locked-view-btn {
  color: rgba(255, 190, 170, 0.82);
  border-color: rgba(255, 110, 90, 0.24);
  background: linear-gradient(180deg, rgba(70,18,18,.55), rgba(28,10,10,.62));
  text-shadow: 0 0 8px rgba(255, 90, 70, 0.18);
}

/* hover 時更有異常感 */
.locked-view-btn:hover {
  border-color: rgba(255, 120, 95, 0.42);
  box-shadow: 0 0 14px rgba(255, 90, 70, 0.14);
  animation: lockedHoverGlitch .32s steps(2, end) 2;
}

/* 點擊後 ACCESS DENIED 狀態 */
.locked-view-btn.denied {
  color: #ffd8ce;
  border-color: rgba(255, 130, 110, 0.55);
  background: linear-gradient(180deg, rgba(120,30,24,.72), rgba(48,14,12,.78));
  box-shadow: 0 0 18px rgba(255, 90, 70, 0.22);
  letter-spacing: .08em;
}

/* hover glitch */
@keyframes lockedHoverGlitch {
  0%   { transform: translate(0, 0); filter: brightness(1); }
  25%  { transform: translate(-1px, 1px); filter: brightness(1.08); }
  50%  { transform: translate(1px, -1px); filter: brightness(0.9); }
  75%  { transform: translate(-1px, 0); filter: brightness(1.12); }
  100% { transform: translate(0, 0); filter: brightness(1); }
}
  </style>
</head>
<body>
  <main class="page">
    <section class="log-panel" role="dialog" aria-modal="true" aria-labelledby="logAreaTitle">
      <header class="log-header">
        <div>
          <div class="log-kicker">Operation Log</div>
<h1 class="log-area-title" id="logAreaTitle">普通檔案紀錄</h1>
<div class="log-area-subtitle" id="logAreaSubtitle">Default File Record</div>
        </div>
        <button class="log-close" id="closeBtn" type="button" aria-label="關閉">×</button>
      </header>

      <div class="log-body">
        <aside class="log-sidebar">
          <div class="log-view-switch" id="logViewSwitch"></div>
          <h2 class="log-sidebar-title">檔案索引</h2>
          <div class="log-episode-list" id="logEpisodeList"></div>
        </aside>

        <article class="log-content">
          <div class="log-content-head">
            <div class="log-entry-kicker" id="logEntryKicker">共通紀錄</div>
            <h2 class="log-entry-title" id="logEntryTitle">01｜共通紀錄</h2>
          </div>
          <div class="log-entry-text" id="logEntryText"></div>
        </article>
      </div>
    </section>
  </main>

  <script>
const LOG_PREVIEW_DATA = {
  "area": "普通檔案紀錄",
  "subtitle": "Default File Record",
  "viewGroups": [
    {
      "id": "yan",
      "label": "姜燕"
    },
    {
      "id": "maria",
      "label": "瑪莉亞"
    },
    {
      "id": "daili",
      "label": "戴莉"
    },
    {
      "id": "roselia",
      "label": "洛潔莉雅"
    },
    {
      "id": "claire",
      "label": "克萊兒"
    },
    {
      "id": "unknown",
      "label": "【未開放】"
    }
  ],
  "episodes": [
    {
      "no": "【獵者之夜】",
      "label": "直至某天繫上束縛",
      "content": {
        "yan": "　　我總是被說很笨。\n　　不過這是事實，我確實頭腦不太好、美英監督說是我小看了人們的惡意、所以腦袋才會轉不過來，總是輕易相信周遭的人，所以才會被騙。\n　　她又說:「明明是貧民窟的孩子，為什麼總是這麼單純的相信人的好意呢？」\n　　這個答案，我也是不知道的。\n　　我幾乎沒有進入波拉里斯學院之前的記憶，可以說是我回神過來就去搶了美英監督的包包、轉眼間就被丟進學校中，展開了全新的生活。我總覺得自己身上還有什麼秘密、這是某種直覺，而我的直覺非常準確，但這份秘密目前還沒有揭露出來、我也還沒想起來，所以我也就持續保持著。\n　　在戴莉和瑪莉亞面前是我最快樂的時候，雖然兩人常常對著我皺眉頭，但實際上永遠是最關心我的人之一、總是在背後推著我一同前行，所以我最喜歡她們了！\n　　戴莉總是敲我的腦袋，或是把我揍一頓，我從不還手、因為她很溫柔，只是無法好好的說出來，而且那只是害羞的一種形式，她打我從來都不痛、只是我會習慣性喊兩聲說好痛。\n　　瑪莉亞總是長長地對我嘆氣，因為會議上的東西我都聽不懂，她皺著眉仔細思索要怎麼和我解釋，但我從來沒有在她臉上看到對我不耐煩的表情，只是苦惱著、煩惱怎麼更好地傳達給我。\n　　我很笨，力氣又很大、除了戰鬥什麼都不會做，所以我其實在她們面前抬不起頭。但是我不想讓她們擔心我！所以我總是露出笑臉、做著那個天真無邪的姜燕，因為我不用擔心我會被她們討厭，而且這就是最真實的我自己。\n　　就算在她們心中我可能是一條寵物狗也沒什麼關係，我最大的願望就是能夠為她們所用，成為她們最鋒利的刀刃、也是最堅實的牆壁，只是這點事情的話無論她們要我做什麼我都會答應然後好好完成的。\n　　畢竟我很笨，只能做到這些事情了。\n　　1.【狂犬】\n　　「姜燕……姜燕！」戴莉的聲音撞進我的意識中，我看著巨劍縫隙後她咬著牙冒汗的臉，認知才逐漸交織回籠、然後有些呆滯的看著她。回過頭，瑪莉亞不知道何時在我的身後，整顆頭都赤紅著雙手抱住我的腰往後扯像是在阻止我一樣，但因為她沒有力氣的關係所以比較像是吊飾一樣掛在我身上。\n　　見我停了下來，戴莉長呼一口氣收起了西洋劍，繞過我的劍來到我身側伸手就往我的腦袋敲下去：「白癡，妳到底在幹什麼！」\n　　「好痛！」我抱著腦袋鬆開了劍，下意識蹲在地上抱怨：「為什麼又突然敲我了？剛剛不是在練習戰嗎？」\n　　「乖、不痛喔……」瑪莉亞少見的彎下腰摸摸我的腦袋安慰，同時又帶著緊張的語氣和我說：「剛剛打到一半突然狂犬小燕就跑出來了，明明平時這種程度而且沒有指令的話是不會出來的，但就突然出現了。戴莉才剛拆石膏，只能一邊躲一邊喊妳，喊了快十分鐘妳才回神過來。」\n　　「要我說絕對是妳這傢伙剛剛發呆一不注意才會讓那條瘋狗跑出來。」戴莉扶著被大劍的震盪而差點再度受損的手腕，皺著眉很是生氣：「監督不是講了好幾次戰鬥中禁止恍神嗎？就算妳再怎麼靠直覺戰鬥，分神是絕對不可以的吧？妳是打算殺了我嗎？」\n　　「我、我不知道……」沮喪地低下頭，我語氣中滿是愧疚和不確定：「剛剛有一瞬間我不知道自己在哪、我甚至不知道自己在幹嘛……對不起，戴莉。」\n　　「我、我又不是真的怪妳！」戴莉臉色很難看、像是異物卡在喉頭一樣，但大概也不知道能說什麼，所以青著臉轉頭就走進城堡中。\n　　「姜燕，可以和我聊聊嗎？」瑪莉亞仍舊輕輕揉著我的腦袋，語氣柔和的安慰：「我跟戴莉都知道妳不是故意的，畢竟妳就是這種人嘛。但考慮到戴莉還沒完全痊癒，為了防止這件事情再次發生，我們來一起找找看問題在哪吧。」\n　　-\n　　「那麼，妳剛剛練習中在想什麼呢？」瑪莉亞直直地看著我的眼睛，我讀不出來她的情緒，但可以感受到她在關心我、同時又有些緊張。\n　　大概是因為不久前戴莉被洗禮的事情，我是這樣猜測的，畢竟戴莉剛回來、也才剛康復，所以她內心還存有不安。\n　　「嗯……剛剛我還是很認真的在戰鬥的，雖然控制力道不要打傷戴莉還是比較困難的，但因為美英監督說這樣可以更好的鍛鍊自己精神面，所以我很認真的的對待。」畢竟戴莉目前身體狀況還是不太能去前線，所以對練除了幫助戴莉提早恢復正常外、還有訓練應用如何補上戴莉的空缺。然後我更努力的想：「然後……打到一半的時候，我也不知道是什麼時候——總之突然我就放空了，想到了狂犬小燕的事情、突然就失去控制了……因為我意識就中斷了，完全不知道發生了什麼。」\n　　「嗯，想必其中有什麼緣由。」瑪莉亞低著頭思考著，提出了可能的原因：「可能是太久沒有放出來了，所以這次使用的時候產生的後遺症，如果不集中精神的話即使稍微亢奮一點都有可能會狂化。」\n　　「真的很對不起……下次我會注意的！」我雙手合十道歉，瑪莉亞這次微笑的擺擺手，表示沒事。\n　　「接好！」戴莉的聲音出現，我和她都轉頭望向聲音來源，兩罐飲料從空中飛出，我反應極快的接住飲料，將其中一瓶遞給瑪莉亞。\n　　「還以為妳回房間生悶氣睡覺了呢。」瑪莉亞揶揄笑道，戴莉不滿撇下嘴打開手中的飲料一口灌下去，然後隨手丟進垃圾桶中。\n　　「剛剛是去了，但睡不著，出來買點喝的剛好走過來而已。」她撇過頭，雖然看起來還是在生氣但我已經注意到她只是有些害羞了。\n　　「戴莉，剛剛真的對不起！」我朝她跑去然後在她面前跪下道歉，她後退了兩步看起來有些不可置信。我雙手趴地繼續道歉：「如果妳真的很生氣的話就直接踹我兩腳吧！」\n　　「幹、幹什麼東西啊？」戴莉的聲音聽起來很震驚，隨後是小聲的碎念：「一個兩個的……今天是水星逆行嗎我……」\n　　在我還沒理解她說的話的時候，又一道聲音響起：「喂，是誰把夜梟城堡旁邊的自動販賣機踢壞啊？現在飲料一直噴出來！趕快給我自首，不然我等等就把三個人都吊起來扁！」\n　　美英監督憤怒的聲音從一旁傳來，戴莉臉色一變、繞過了我直直往城堡內快走過去：「真的想道歉的話幫我擋一下！我溜了！」\n　　「……」我和瑪莉亞相望幾秒，接著我跳起來衝了出去：「抱歉美英監督！剛剛我去買的時候看它沒有掉飲料下來就踹了一下！我什麼都會做的！對不起！」\n　　「欸、姜燕，等等……」\n　　「姜•燕！妳又不是不知道妳力氣多大！妳真的是——」\n　　2.【人、鳥、魚】\n　　「不過還是好奇怪啊……」\n　　夜半時分，我難得失眠了。\n　　平時我只要躺下去就睡著了，但現在過了半個小時我還在看著天花板。\n　　側臉過去看著戴莉還有緊鄰戴莉的瑪莉亞，我內心深處感覺有點怪異，但又不知道怎麼說。\n　　到底為什麼會突然失控呢？是因為太久沒有解放小燕子了嗎？\n　　但是我不想傷害大家、到底該怎麼辦才好……\n　　「有什麼好奇怪的？」\n　　回神過來我看見了對面有個長得和我一模一樣的人，但氛圍感不一樣、有種更加瘋狂的——\n　　「妳是誰？」\n　　我把疑問說出口，但她沒有回答、只是嘲諷的笑了笑，朝著我靠近了兩步。\n　　「我是誰應該不重要，我只是趁那個傢伙不在所以悄悄出現而已。」她思索的說著，隨後不在意的聳聳肩：「總之，我是來和妳談條件的。」\n　　「什麼條件？」我問，但直覺告訴我她可能不懷好意。\n　　「『她絕對不懷好意對吧』……妳是這麼想的吧？」\n　　「……！」\n　　「不是我長得像妳，是我本來就是妳。我是藏在妳心中的本能、野性、更深層的直覺……這樣說妳可以理解嗎？」\n　　「稍微有點理解……應該。」\n　　「唉，也不知道是哪邊的哪位把妳的智慧收走了，所以才會這麼難跟妳溝通。」她抓了抓散亂的頭髮、神情不滿，但之後又話題一轉：「妳現在在煩惱在無意識的時候會狂化對吧？這其實不能完全怪妳無法控制，這只是被釋放出來的野性沒有被完全收回來而已。」\n　　「所以我在這裡向妳提議，把主權暫時交給我、不用一週我就可以把那些東西收回來，畢竟本來就是我的東西，是個不錯的交易對吧？」\n　　雖然聽起來好像不錯、但我看著她卻感覺不到她在這番話中的真心，像是某種精打細算的計謀在黑暗中編織著。\n　　「看看妳這戒備的樣子，我可沒有騙妳喔？」她聳聳肩，露出自信的樣子：「光憑妳是收不回那些“被遺棄的東西”的，不如就由我收回這些“本來就是我的東西”，是划算的交易吧？」\n　　「一週……不，就給我五天好了，妳就可以繼續用妳喜歡的樣子待在那兩人的身邊。而我可以稍微呼吸一下，幫妳把廢棄物回收……妳要想清楚這其中的代價可是輕到不能再輕了。」\n　　「嗯……這樣的話……」\n　　「這話人家可不能當作沒有聽見。」同樣是我、但稚嫩的聲音從背後響起，面容同樣是我但卻嬌小很多，是個看起來大約只有十歲的小女孩。她穿著有些華麗的裙子，腳上卻纏繞著魚影的紋路。\n　　她緩緩走到我身前，抬著下巴不確定是傲慢還是身高太矮，瞪著面前另一個散髮的我：「趁人家不在的時候打算偷她的身體！本來想觀望一下的，但妳想騙她的身體，這我絕對不能當作沒看見。」\n　　「嗚哇——說話文縐縐的傢伙出現了。」她晃著手露出厭惡的神情，擺明了和她合不來。\n　　「妳也是！怎麼可以被她牽著鼻子走？」她轉過身罵我，小小的身子感覺很沒有魄力，有種別樣的可愛感。\n　　「妳又是誰？」我問，感覺今天長得像我的人出現的有點多。\n　　笨蛋的我、野性的我、嬌小的我，嗯……總感覺好麻煩喔！想不透現在是什麼情況。\n　　要是瑪莉亞在就好了……\n　　「人家……算了，妳馬上就會想起來了，我們換個地方說話吧。」嬌小的我打了一個響指，黑暗迅速退去、突然出現的光亮照的我措手不及，閉上了眼。幾秒鐘後適應了光線的我再度睜開眼，諾亞在不遠處看著我們，緩緩向我們過來。\n　　「這裡是……圖書館？」我帶著疑惑再度看向嬌小的我，她不安的目光與我對視片刻後與她相聯的記憶竄入我腦中，像是積滿灰塵的相簿被打開一樣，見我有些呆滯，她——縱慾王之女開口問：「想起來了嗎？我是被妳拋棄的記憶。」\n　　「哇靠，這裡亮到我要瞎了。」野性的我用手遮住光線，隨後接過諾亞遞上的墨鏡戴上：「活了這麼久也沒看過兩次這麼亮的地方，這邊的書拿去賣能不能有很多錢啊？」\n　　「這邊的書和妳一樣都是出不去意識的世界的，因為這裡是存在於精神世界的博物館。」諾亞嘆氣，隨後轉向縱慾王之女：「縱慾王之女，妳帶朋友來玩了呢。」\n　　「全部都是我，好像也算不上朋友。」她有些嫌棄的回應，指著我們兩個說：「這個是拋棄我的那個，這個是負責當看門狗的那個。」\n　　「什麼叫做看門的啊！」戴墨鏡的我發起強烈的抗議：「我是不想出來才沒出來的！」\n　　「隨便啦，我又不在乎妳。」縱慾王之女揮揮手不去理會抗議的她，四處張望發現這裡沒有其他人後轉頭詢問諾亞：「那兩個人呢？」\n　　「本來想趁她們睡著的時候帶過來的，但是剛剛小燕……野性的姜燕趁亂掌控了些許身體操控權打了戴莉兩拳又被妳阻止昏過去了，現在她們正在賞姜燕巴掌想把她叫醒。」\n　　諾亞唯唯諾諾的說，臉上寫滿抱歉。\n　　「那直接把她們叫過來就好了啊。」縱慾王之女稍微窺見了外面的世界，微微皺起眉頭露出錯愕的神色，隨後打個響指—–戴莉和瑪莉亞穿著睡衣掉到了地板上，尤其戴莉還被瑪莉亞壓在地上。\n　　3.【智慧與野性】\n　　「好痛！瑪莉亞妳最近吃太多了吧！」戴莉掙扎著爬起來抱怨，瑪莉亞則是紅著臉挪開自己身體，感覺說什麼都不太對。\n　　「戴莉、瑪莉亞！妳們來的正好！」我快步跑上去抱住她們，再不來我感覺腦袋要處理不過來了！\n　　「煩死了，滾開——嗯？」戴莉如平時般推著我，讓我滾遠點，但越過我的肩頭看見了後面那兩個我：「哇靠，做惡夢了、姜燕有三個！」\n　　「妳冷靜點。」瑪莉亞說，但也順著視線望過去：「有一個是縱慾王之女，之前在回憶裡面看過的不是嗎？」\n　　「另一個——」\n　　「玩嘻哈的？」\n　　「誰跟妳玩嘻哈的？我是代表野性與本能的燕！」她憤怒的摘下墨鏡，隨後被強光刺眼又把墨鏡戴了回去：「按照妳們的說法，我就是妳們所知的『狂犬』，懂嗎？」\n　　「喔，原來只是一條瘋狗。」戴莉毫不在乎的說，隨後看向諾亞：「今天真的有夠衰的，練習被狗咬、買東西卡飲料、睡覺還被打，現在又是搞哪齣，姜燕的多重人格？」\n　　「還是先介紹一下吧，雖然之前見過面了，但還沒有說的很清楚。」縱慾王之女眉頭微皺，但還是擺出端正的姿態微微彎腰招呼：「我是“原”縱慾王之女，是沒有名字的燕，同時我負責她的智慧以及執著。」\n　　隨後她指向狂犬小燕：「她是掌管慾望和野性的燕，是還在流浪時候的她，但因為某些原因也被姜燕封印了。」\n　　「那個某些原因是監督嗎？」戴莉抱著手問，似乎有了眉目。\n　　「嗯，對的。」縱慾王之女點點頭。但一旁的野性不是很高興。\n　　「我有個問題。」瑪莉亞舉手發問：「狂犬小燕的事情我明白了，但是為什麼之前沒有看過妳呢？」\n　　「而且聰明程度也完全不一樣。」戴莉補了一句。\n　　「……」縱慾王之女臉色難看的撇過臉，似乎不是很想回答。但又覺得什麼都不說也不太行，於是伸手拉了拉諾亞的袖子。\n　　「我來進行說明吧。」諾亞點點頭便開始解釋：「當時縱慾王之女與 D 伯爵奠定賭約，最後賭約妳們都知道是縱慾王之女輸了、但之後姜燕表示『想要維持現在的自己』於是將縱慾王之女的事情封印在書中交由我保管，於是縱慾王之女只能出現在圖書館之中、相關記憶在姜燕願意解封前妳們都是無法帶到圖書館和劇場之外的。」\n　　「關於智慧的方面……由於我被封印了，所以我所掌控的智慧也被封印起來，所以姜燕才會是現在這樣、最純真的模樣。」縱慾王之女複雜的看了我一眼，最後頹然地輕聲解釋。\n　　總感覺她有什麼想說的，但最後想了很久又不打算說出口了。\n　　「姜燕……妳好糟糕啊。」瑪莉亞思考了半晌似乎是想通了，少見的用譴責的表情看向我，讓我心跳漏了半拍感覺有點心慌。但她只是嘆氣，走向縱慾王之女後摸了摸她的頭：「抱歉喔，我們家姜燕讓妳受委屈了，我幫你教訓她。」\n　　「瑪莉亞、我……」我想要解釋什麼，但腦袋中卻無法產生為什麼要道歉的理由、還有要怎麼道歉才好。\n　　「姜燕。」瑪莉亞看向我，眼神和語氣都非常平淡，但我卻能在她的眼中看到小小的失望。她大概意識到了什麼，深呼吸後神情恢復往常那樣，只是看起來有點尷尬：「姜燕……以我們的立場來說可能沒辦法對妳的決定說什麼，但是妳看看這孩子、她可是很受傷的喔？她抱持著多大的希望一直在封印中等待……但最後妳卻再度拋下她了。」\n　　「我……」我張著嘴半句話說不出來，內心也越來越緊張、像是想說的話糾結成一團毛球卡在喉嚨裡面一樣。\n　　「她可是最初的妳，現在妳長大了卻又否定人家的存在，這不是應該要道歉嗎？」戴莉重重的拍了一下我的腰，眼神無法形容但看起來有點失落。隨後又恢復平時有些尖銳的樣子：「苦是她受的、選擇也是她選的，但結果卻是妳在享受的，不管怎麼說都說不過去吧？還不快道歉！」\n　　「……對不起……」我垂頭喪氣地道歉，被戴莉這麼一說我也確實感覺到了自己對不起她的地方，乖乖的道歉：「戴莉和瑪莉亞說的沒錯，是我的任性讓妳難過了，還被關在圖書館裡面……對不起。」\n　　「嗯……謝謝妳和我道歉。」她有些害羞的撇過頭，完全看不出來這是在回憶中見到的狂妄自大的縱慾王之女，是因為和諾亞呆在一起久了嗎？但她馬上回神過來想到了什麼，連忙說：「雖然能夠被道歉很高興、但我今天不是為了這件事把妳們叫過來的！」\n　　「我的事情先放一邊、這次因為上次久違的解放了野性、所以現在野性的姜燕沒辦法被完全關住了，這次必須解決才行！」\n　　說完她四處尋找突然消失蹤影的野性，諾亞則有些無言冒汗的指著某排書架，裡面發出窸窸窣窣的聲音、接下來是書本掉落的啪嗒聲——一本、兩本、五本……最後跟洩洪一樣書本瘋狂掉落的聲音傳來，我們衝向那排書架，只見一座書本的小山中伸著一隻腳和一隻手，我還在考慮要不要上去把人拉出來，在那之前她就先有了動作、掙扎著從書山中爬了出來。\n　　「啊、啊……！珍貴的記憶——！」諾亞臉色鐵青、蒼白的臉此時看起來更像白紙一枚，感覺隨時都會暈過去。\n　　「笨狗！妳在幹嘛！」戴莉罵著走了上去、用著毫不留情、絕對不是平時對待我的力氣把人從書山中跩了出來，一個拳頭砸在她腦上。戴莉感覺不滿到了極限、大概是想起剛剛睡到一半被打的那一拳，又一個抓著領口把野性給提起來：「我是不是好臉色擺多了妳以為我不會修理妳啊？剛剛跟早上的帳我還沒算，之前是看在那白癡夠笨才不計較的，現在被我抓到本尊了看我還不把妳打到變自閉？」\n　　「戴莉好了、冷靜點不要太過火……」瑪莉亞上前拉了拉戴莉，輕聲勸阻：「小燕也是姜燕的人格之一，不要太……」\n　　「哼！」野性將懷中的書拿出來，一本是淡紫色鑲金邊同時被火紋上的厚重書籍；一本是以普通厚度來說相當薄、有著藍色星空色的為底又用閃光金箔點綴、邊角卻微微泛紅的書籍。她有些得意的炫耀著：「我已經找到了紀錄妳們記憶的書籍，我要掌握妳們的弱點讓妳們管不了我！」\n　　「……！」\n　　瑪莉亞頓時緊張了起來，而戴莉則顯得不是那麼在乎：「我又不怕被看？前陣子我已經被看光了，還怕妳查？」\n　　「總、總之還是先把她放下來吧！」縱慾王之女連忙打圓場，戴莉只能不情不願的鬆手、讓野性跌坐在地上。\n　　４．【會議】\n　　諾亞拿出一張圓桌，我們坐下的同時她也為我們每個人遞上茶水，在縱慾王之女的面前擺上了牛奶。\n　　瑪莉亞緊抱著比較薄的那本書，雖然我很好奇為什麼那本書相對薄、但現在眼下重要的事情是怎麼重新封印野性，所以我不久後便拋之腦後。\n　　諾亞給我倒了一杯很甜的蘋果汁，這是我最喜歡的飲料所以我開心地喝了起來，混然忘記現在正在討論我的話題。\n　　「總、總之，我來說明下情況吧。」縱慾王之女有些緊張的握著牛奶杯，深深的呼吸後開口：「如剛剛介紹的，野性的燕是姜燕流浪時的人格，後來因為姜美英嚴厲的管教而封印，如果沒有特定的指令是無法從姜燕方打開野性的人格的。」\n　　「但這次因為……呃、戴莉姊姊的事情，所以久違的解放了野性，導致現在封印的地方留了一個小縫隙，要是姜燕不繃緊精神保持自己意識的話，野性就會透過縫隙出來操控她的身體、縫隙也會越來越大，最後會導致現在的姜燕和野性搶奪人格。以目前來看、野性取代姜燕的可能性比較高。」\n　　「不能再把她打回去嗎？」戴莉吸著可樂、隨興地問，但眼神時不時瞪向野性的方向。\n　　「雖然不是不行、但這樣長久下去不是方法。」縱慾王之女低著頭，聲音有些羞愧。\n　　「她的意思是即使現在封印回去了也只是治標不治本。」瑪莉亞喝著花茶為戴莉和我詳細解釋：「我們兩個能不能打贏並壓制姜燕不說，即使是現在監督可以把她重新封印回去，那下次呢？監督也會變老、也會逐漸使不出超能力，而於此同時姜燕的實力也會增長。現在可以解決的話、我們就絕不能錯過可以直接解決問題的機會。」\n　　戴莉思考了半晌點點頭，表示可以接受。\n　　「那我們要怎麼辦？」我舉手發問，眾人又思索了起來。我不擅長想這些東西，只能低頭吸著果汁等待結論。\n　　「我可不要被關起來！」野性拍桌而起，腳踩在桌上很生氣的罵：「這本來就是我的身體！為什麼是我要被關起來啊？是妳們兩個要滾出我的身體吧？我要打人！我要見一個砍一個！我要毀滅這該死的世界！這一切都是因為我被世界拋棄了！」\n　　「……」我們面面相覷，我不用去特別閱讀她們臉色就能感受到我們都是一樣的想法。\n　　——她好中二啊。\n　　「首先妳不要踩在桌子上，很沒禮貌。」瑪莉亞說。\n　　「聲音也不要那麼大，吵死了。」戴莉說。\n　　「用詞不要那麼粗暴……不好聽。」縱慾王之女眼神看向旁邊，小聲的說。\n　　「等一下記得要幫我擦桌子……。」諾亞微微皺眉。\n　　「戴莉和瑪莉亞說的對，妳這樣不好。」我說。\n　　「——！」可能感覺自己的發怒並沒有激怒其他人，讓她感覺自己被忽視了，她更加的生氣推翻了桌子擺出咬人的姿勢：「我要把妳們通通咬死！這樣就沒有人會管我了！」\n　　「喔？沒有夾著尾巴逃跑，居然還想跟我打一架嗎？」戴莉起了興趣，握拳召喚出她的裝備居高臨下的擺出嘲諷的樣子：「過來啊？小‧瘋‧狗。」\n　　「啊啊啊啊啊啊啊！」暴怒的野性張著爪子就衝了過來，我和瑪莉亞、縱慾王之女都擺出了戰鬥姿勢加入了戰鬥。\n　　「妳們之後要幫我打掃圖書館喔……」\n　　５．【豢養的方法】\n　　煙霧散去，雖然野性確實難纏但猶豫人數太多、縱慾王之女的參戰使她就像是掙扎的困獸一樣，只是在魚群的牢籠中垂死掙扎、為了不會實現的願望而鬥爭。\n　　在這個過程中我感受到了即使我不認為她是我，但她也確實是被遺忘掉的我。\n　　一樣的執著、一樣的渴望、一樣的拼命。\n　　雖然是比較不成熟的我，但內心深處想要的東西其實是一樣的。\n　　「呼……呼……」她喘著氣倒在地上，墨鏡早就不知道飛到哪去了，淡薄的眼神中有著不甘、卻沒有力氣再起來。圖書館天花板的燈光太亮，她索性閉起眼睛撇過頭，有些鼻音伴隨乾啞的嗓音開口：「隨便了，想怎麼樣就怎麼樣吧。」\n　　「就算這麼說……」瑪莉亞有些籌措的樣子：「我們目前也還沒討論出方法……」　\n　　「其實。」縱慾王之女開口了，她猶豫著拿出紅色的項圈，遞到我手上：「我有個從Ｄ伯爵那邊得到的束縛器，只要戴上去的話野性就只能被控制了。我本來不想用這個的，但要是她一直對妳們造成麻煩的話還不如……！」\n　　「哇，好一個直觀的方法。」戴莉吐槽，聳了聳肩沒有表達反對。\n　　「姜燕，妳怎麼想的？」瑪莉亞沒有直接表明意見，她看向我並詢問意見。\n　　我腦袋旋轉著，不知道該如何表達、一片空白中總覺得有點不對，但沒有頭緒無法表達。\n　　看著躺在地上已經準備好接受審判的野性，她的身體比我稍小一些、也更髒兮兮一些，下撇的嘴角示意著不甘，但卻有種釋然感。\n　　「呼……」我長長的深呼吸一口氣，將項圈朝著瑪莉亞與戴莉的方向遞上，像是下定決心一樣露出我自以為下定決心的微笑：「項圈，為我戴上去吧。」\n　　「拜託了。」\n　　為了我未來不會傷害任何人。\n　　為了最喜歡的她們。\n　　她們沒有接過，而是帶著詫異的微微睜大眼有些發楞的看著我。\n　　瑪莉亞最先反應過來，她伸手接過看著項圈幾秒後又與戴莉相識，兩人好像在眼神中達成了某種共識，她將項圈遞給戴莉、戴莉則雙手用力的一捏——將項圈摧毀。\n　　縱慾王之女瞪大眼睛不敢置信項圈被毀掉了，我也是。\n　　「咦、為什麼——」\n　　「我跟戴莉沒有想過要操控她。」瑪莉亞看著我平淡的說，隨後坐在野性的旁邊順了順她凌亂的瀏海把不知道在哪找到的墨鏡帶回去：「這也是妳啊？」\n　　「雖然想揍她是真的，但我還沒有卑劣到要用圈養的方式作為報復。」戴莉抱著手撇過臉，有些不情不願的樣子：「而且我和瑪莉亞持相同意見，這也是妳、我不能操控妳。」\n　　「戴莉是說我們是夥伴、不能夠操控對方，就像火焰王之女那樣。」瑪莉亞聲音中帶著笑意解釋，而戴莉則是氣急敗壞的否認：「我沒有這樣說！」\n　　「反正照顧一個也是照顧、照顧兩個也是照顧，都是姜燕嘛。」瑪莉亞摸了摸野性的頭，有些好笑：「好了，鬧脾氣的小狗該起來了吧？」\n　　「誰鬧脾氣？我沒有！」野性氣急敗壞的跳起來，指著瑪莉亞發脾氣：「我告訴妳，今天只是人多，下次單挑我一定把妳另一隻眼睛也打瞎掉！」\n　　「好好，我知道了。」瑪莉亞起身將野性拉進懷中擁抱，輕聲的安慰：「妳也受了很多委屈了吧？」\n　　「我、我才沒有……！我沒有！」野性拼命否認，但聲音越來越弱、鼻音也越來越重，最後靠在瑪莉亞頭上啜泣，時不時否認兩聲我沒有。\n　　「我知道的，因為姜燕是個愛撒嬌的孩子。」瑪莉亞拍著背，悄悄的朝縱慾王之女使眼色，隨後縱慾王之女也湊了上去抱住瑪莉亞。\n　　「哎呀，撒嬌的姜燕變多了。」她呵呵笑著，也摸了摸縱慾王之女的腦袋，最後看向我和帶莉眨了眨眼睛。\n　　「……！」我感覺到了什麼，拉起不情不願的戴莉的手腕，兩個人也抱了上去。\n　　「我發誓我也要封印這段記憶……」戴莉無奈的抱怨，但手的力道沒有放鬆，將我和瑪莉亞抱在懷中。\n　　６．【今日的我】\n　　陽光打在我臉上，有些刺眼的光芒讓我不適，揉著眼睛翻了個身，柔軟的觸感讓我有些意外——今天居然沒有在地板上醒來。\n　　睜開眼，戴莉直直地盯著我讓我嚇到，不自覺抖了一下往後退隨後就是標準的摔下床。\n　　「好痛喔——！」\n　　我喊出來，兩隻腳在床邊掛著，戴莉撐起身子好笑的看著我：「笑死。」\n　　今天和平時沒有什麼不同，戴莉一如既往在我臉上潑水然後塗一些我不懂的保養品；瑪莉亞站在浴室凳子上給我刷牙、叮嚀我不要把漱口水當飲料吞下去；戴莉拿著梳子和吹風機整理我難搞的捲髮；瑪莉亞將我衣服上的配件和扣子一一調整好，最後我們三個人坐在餐桌前一起吃早餐。\n　　和平時不同的地方開始出現了，戴莉和瑪莉亞不約而同地盯著我吃早餐，我則投以困惑的目光向著她們。\n　　在練習場的時候我雖然努力壓抑本能，但最後還是逐漸隨著本能進行戰鬥，但神智清楚、沒有被快感吞噬，而是和兩人有來有回。\n　　晚上的時候仍舊和平時一樣，三個人一起洗澡，瑪莉亞負責搓洗我、戴莉洗完瑪莉亞的腦袋後洗了我的腦袋；結束後戴莉替我擦頭髮、瑪莉亞則擦拭我的全身；大家一起吹了頭髮，躺在床上。\n　　「……不知道是不是錯覺，總感覺姜燕和之前比確實不一樣了。」黑暗中瑪莉亞的聲音輕輕地飄出來：「吃飯的時候更有禮儀了一點……」\n　　「戰鬥的時候也不怎麼會變成瘋狗了。」戴莉悶悶的聲音傳來，因為她在敷面膜。\n　　「咦，那這樣就不是我了嗎？」我嚇的彈坐起來，望向兩人的方向，緊張感像是螞蟻一樣爬滿全身。\n　　「說什麼蠢話，妳就是妳。」戴莉發音不全的抱怨傳來：「笨狗永遠都是笨狗。」\n　　「雖然戴莉的說法不太好聽，但確實是這樣。」瑪莉亞說：「畢竟是大家的選擇，但只能習慣了。」\n　　「但是我不想讓妳們多操心……」我心情有些鬱悶。\n　　「姜燕，我們沒有操心。」細小的布料摩擦聲音傳來，透過床墊傳來的晃動我可以感覺瑪莉亞坐了起來，她越過戴莉將手放在我的手背上，些微的涼意讓我感覺到只屬於她的溫度：「雖然妳確實因此改變了，但我們都很高興能夠更加認識妳。所以妳就這樣保持下去就好了。」\n　　「我沒這麼說。」戴莉反駁，但我已經當成她同意了。\n　　「謝謝妳們……」之前害怕的事情、那篇陰霾像是被掃除一樣，我的心情變得輕鬆起來。咦這麼想我就無法抑制我因開心而隨意動起來的身體。我跳起來翻過身將她們壓在床上，自己甚至能感覺到我現在大概笑得非常燦爛：「我最喜歡妳們了！」\n　　「大半夜喊什麼啊！」\n　　美英監督的聲音從門外傳來，她重重的敲了兩下門後把房門打開看著我們三個。因為我壓著她們兩個樣子可能有點詭異，所以她盯著我們三秒。三秒後她眉頭緊皺開口：「要開睡衣派對至少得開燈！還有早點睡！不要偷吃零食！」\n　　她把燈打開後又把門關上，我困惑的看著她們，她們又疑惑的望向對方，隨後戴莉炸起：「靠！我不是女同！」\n　　「也沒有說妳是……」瑪莉亞有些無言：「監督甚至沒讀到這層意思。」\n　「啊啊啊啊我不管！」戴莉不滿的喊著，隨後把我踹下床：「都妳害的，白癡！今晚滾地上睡！」\n　「啊？等、等一下啦戴莉……」\n　？．【圖書館後話】\n　「真是太好了呢。」縱慾王之女喝著喜歡的牛奶，兩隻腳輕輕晃動。\n　「……」野性——小燕有些不知道該說什麼，低著頭看著手中的熱巧克力。\n　「妳們又出現了啊。」諾亞對兩個小傢伙常常在圖書館冒頭已經習慣，長期的孤獨逐漸消退。\n　「我們來玩了。」縱慾王之女揮揮手，手肘輕輕推著小燕。\n　「……妳好。」\n　「嗯。」諾亞簡短的回應、向她露出了淺淺的笑容。\n　這邊的故事也還在繼續。",

        "maria": "\n　　——我是知道的。\n　　一直以來都知道的。\n　　只要使用權能，那就是燃燒我的生命力去換強大的超能力，是一場必輸的賭博。\n　　而我，進入波拉里斯之前就注定活不到二十歲了。\n　　\"為什麼要不惜代價去使用這股無法負荷的超能力呢？\"\n　　夢中的路西法這麼問我。\n　　\"妳那麼在乎妳的夥伴們，更應該要在乎自己的性命……\"\n　　「她們是最棒的夥伴，對吧？」\n　　我沒有直接回答他的問題，畢竟夢中的路西法也只是類似幻象一樣的存在，但不可否認的是我能在這次殉教者山丘活下來也是多虧了他。\n　　\"……妳們一直是最棒的搭檔。\"\n　　「嗯，所以就算只是一個微小的可能，我都要從他們手上搶人。」我說，看著手腕上星星的紋身輕微的閃爍著，它在緩慢的吸收空氣中的超能力為我所用。\n　　「雖然這次之後別說二十歲了，我可能連十八歲成年都活不到，但這就是我想選擇的結果，因為她們是我的夥伴、我的朋友、我的……家人。」\n　　「為了我最重要的人事物，就算賠上我的性命也不是什麼大不了的事情，反正也活不了幾年了。」\n　　我微笑著回應他，然後看向他的眼睛:「雖然和你說可能只是我的白費力氣，但你還是願意答應我一個小小的要求嗎？」\n　　\"如果可以的話……我答應妳。\"\n　　「謝謝。」我點頭向他致謝，然後緩緩開口:「我希望哪天我要是真的因為使用權能而死了，你可以幫我和她們說，她們是我最珍貴的寶藏、是我世界上第一個也是唯二的好朋友、是我永遠放不下的存在。如果可以的話……請帶著我的份幸福吧。」\n　　\"瑪莉亞·薩圖恩……\"\n　　「她們應該會哭的很慘。你不要看戴莉總是擺著一張臭臉，實際上她比誰都還在乎我們，姜燕雖然傻、卻總是最敏感的那個。」我的腦袋構築出畫面，感覺有點好笑、好笑的都流出淚來了：「感覺她們的哭臉一定很醜……」\n　　\"瑪莉亞·薩圖恩，我……\"\n　　「嗯，沒關係。真的沒關係。」我阻止路西法想要說的話，無奈的搖搖頭:「你是我身體裡的存在，所以我的想法你也是知道的。我確實不想止步於此，但是現實往往更加具有悲劇色彩——」\n　　「即使是在這夢中我還是知道的，我的身體正在以緩慢且難以發掘的速度衰弱、死去，大概得等到我連漂浮都很難的時候才會被發現，到時候就來不及了，我不想要她們為我奔波、尋找渺茫的讓我活下去的希望，那太痛苦了。努力找尋後卻發現是一場空，無比悲涼……」\n　　「是啊……我想活下去……我現在才十五歲呢……其中卻有十年都在實驗室中。」\n　　\"……\"\n　　「嗯，我很好。」我再度扯出一張我感覺誰看了都覺得很難看的苦笑:「我還沒放棄，說不定旅途中有讓我延命的機會呢？總之，現在這樣就好了。」\n　　「謝謝你，路西法。」\n　　\"為何向我道謝？我好像沒有做過什麼足以讓妳向我道謝的事情。\"\n　　路西法看起來很是困惑，但我搖了搖頭：「這次殉教者山丘的事情，多虧你把我從死亡邊緣拉回來，我才能把戴莉救回來，所以謝謝你。」\n　　\"但那最終還是消耗了妳的生命力。\"\n　　「我說過了，那是我自願的。」我說:「請你別自責，這是我期望的結果。」\n　　\"好吧……我知道了。\"\n　　遠處傳來鬧鐘的鈴聲，我意識到我好像該走了，於是向路西法微微鞠躬、揮手後走向出口。\n　　「無論最後怎麼樣，這段時間都會是我人生最喜歡的一段日子，沒有比現在的生活更棒的禮物了。」\n　　「所以說，請你在稍稍守護我們一陣子吧，路西法大人。」\n　　-\n　　「……瑪莉亞！瑪莉亞！」\n　　姜燕的聲音將我從睡夢中來回，她拿著衛生紙滿臉擔心的在我臉上擦拭，但我意識還沒完全回籠，只能緩緩地開口問:「……我睡過頭了嗎？」\n　　「不對！不是這樣的！」姜燕有些語無倫次，戴莉則是滿臉嫌棄的推開姜燕礙事的腦袋：「滾邊去，這邊讓我來。」\n　　戴莉同樣拿著衛生紙在我臉上擦拭，用不知道怎麼形容的聲音和我說：「醒來就看見妳流鼻血、還留了整個枕頭都血跡斑斑的，嚇死人了。連忙去找羅倫娜來看，她說可能是之前超能力失衡還沒完全康復之類的……總之，今天妳只能養病了，不准出任務。」\n　　「……什麼？」我聽見不准出任務的句子，精神迅速恢復從床上坐起來:「不行！我可是隊長，我一定要——」\n　　一陣暈眩像是風暴般傳來，這是貧血的現象，我話都還沒說完便往後倒了下去，戴莉即時摟住我的背我沒有讓我直接摔回床上。\n　　「不行，妳失血太多了，這兩天只能輸血加養病。」戴莉碎念著，小心翼翼的將我放回床上，順便仔細的調整了枕頭和棉被的位置:「反正今天也沒什麼大事情，我跟姜燕那白癡去去就回來，妳就好好待著。」\n　　「嗯，瑪莉亞，我跟戴莉會一劍把那些次元獸給打飛，然後回來陪妳一整天的，等我們喔！」\n　　「一整天也太多了，我可不幹。」戴莉面露嫌棄的回應，手上卻捏著棉被的一角，有些不自然。\n　　「總之，妳就給我待著，整個Union都找不到像妳這麼體弱的隊長了，真是的。」\n　　「抱歉……」\n　　「道歉什麼？真的抱歉的話就好好躺著，我們快去快回。」\n　　「嗯，謝謝。」\n　　「那瑪莉亞我們就走了喔！好好休息，我回來給妳帶好吃的！」\n　　「嗯，注意安全。」\n　　啪搭啪搭，兩人走掉的聲音。\n　　「我也是一個幸福的人了呢……」躺在床上、空氣中只有時鐘滴答滴答在跑的聲音，我逐漸被睏意再度包裹。\n　　「就算哪天死了也不會後悔的程度……」",

        "daili": "\n　　「戴莉，這個是什麼？」\n　　我有一個煩惱。\n　　「戴莉，為什麼它會這樣？」\n　　非常大的煩惱。\n　　「戴莉，這個好好看喔！」\n　　由一個煩惱分裂成無數小煩惱的超級大煩惱。\n　　「戴莉，能不能買這個啊？」\n　　算了，不能算煩惱，只能算天降的大麻煩。\n　　「戴莉——」\n　　我毫不猶豫的揮出我的拳頭，沒有收力氣、沒有任何懸念、沒有任何猶豫和質疑，只有滿腔的憤怒和暴躁：「叫叫叫！叫叫叫！妳是雞啊？咕咕咕的叫個不停！」\n　　一拳揮在那粉色的腦袋上，姜燕一邊喊著「好痛戴莉為什麼打我？」一邊露出楚楚可憐的樣子，但我不會被她的外表所蒙蔽。\n　　不如說姜燕就是一個外表詐騙犯，表面上不說話看起來給人相當聰明且狠毒的存在，但可惜只要一開口就會覺得她是個腦袋萎縮、智商有缺陷、且非常我行我素的小朋友。\n　　不對，說是人太抬舉她了，她是一隻豬頭、是個猴子、是條狗。\n　　詐騙集團的信念講求耐心、毅力且技巧性的引導，在此前提下我練就了完美的耐心——但這一切在姜燕這頭豬的面前沒有任何用處，我只要被她纏上耐心就會迅速見底然後揮出我的拳頭。\n　　雖然我平時比較常和瑪莉亞吵架……最近倒是沒有，大概是因為我們兩人關係緩和了許多、所以不怎麼會吵架了。但姜燕給人的那種煩躁的感覺始終揮散不去，而且總感覺只有我受不了她。\n　　「戴莉……」她又用可憐兮兮的表情看著我，但我不會被她迷惑、因為她一直都是這樣，給人添麻煩、然後裝可憐、最後大家都會原諒她。\n　　天底下哪有這麼好的事情？\n　　如果有的話我搞詐騙的時候怎麼沒遇過？\n　　總而言之，我絕對不會對她心軟。\n　　「煩死了，妳到底要幹嘛？」推開那張蠢得可以的臉蛋，我看了眼這白癡剛才開始就一直吵鬧要我看的東西。\n　　她指的是櫥窗裡面一個價格貴到我會直接砸破我的腦袋選擇現場從８樓跳下樓的音樂盒，裡面的音樂沒什麼大不了、就只是很常見的古典樂，但姜燕就像是腳黏在地上的死小鬼一樣目不轉睛地看著櫥窗內精美的音樂盒，眼裡滿是興趣。\n　　老實說會期待她對什麼稀有的東西有反應是我的錯，總是對她小小的腦袋瓜能有什麼稀奇的發現抱有渺茫的期望，是我人生中最後悔幾秒鐘，這樣幾秒鐘的期待一久就會變成幾分鐘、幾小時，我想等到自己死掉的時候我會特別為了這幾個鐘頭而懊悔。\n　　「沒什麼大不了的，就只是很普通但因為在百貨公司賣所以貴到靠北的音樂盒而已。」我說，腦袋正在懊悔為什麼今天要跟姜燕出來。\n　　事情發生在一個小時半前，剛拿到零用錢的我非常的想立即出門花錢，長久的戰鬥任務還有悶在營地的時間太久，就算不花錢我也想出門好好享受一下逛街的愉悅感，但瑪莉亞那傢伙說什麼都不肯離開圖書室，說前幾天買的小說還沒看完、現在演到劇情高潮處之類的，又被監督拜託了帶姜燕買點衣服、就變成了現在這樣。\n　　但她是個好奇寶寶，不管什麼都會想要上去看一下。以前看過但是新出的產品她要看、如果是沒看過得更要看，看見想要吃的東西的話也會一溜煙的人不見就去買了。\n　　一間並沒有多大的百貨商場，她逛出了商業巨城的感覺，而且完全不記得自己此行的目的是什麼了。\n　　「走了。」我往前走離開那個櫥窗，但姜燕還是站在那邊、一動不動的看著那個音樂盒。\n　　「戴莉，這個真的好漂亮喔！」姜燕站在原地用著有些高音的音量叫我，但在我心中無異於警鈴大響，當她說「這個真的好ＯＯ喔！」的時候就代表她很想要這個東西，但她自己不知道、所以一直稱讚那個東西來當作替代的句子。\n　　「太貴了，妳不想要。」我平淡的回應，沒有重新走回去，要是買了這個沒路用的東西，零用錢幾乎全部都沒有了，怎麼開心地逛街？總之我是不會花錢買這個東西的，只有好看的外表、實際上卻沒有什麼路用，跟姜燕這個人一樣，外表好看、腦袋空空。\n　　「可是、真的很漂亮。」\n　　她再度露出很想要的表情，我內心的煩躁感再度升起、耐心也正比例下降，但我還是咬著牙說：「太貴了，妳忘記妳媽是叫妳來買衣服的了嗎？」\n　　姜燕不說話了，只是很依依不捨的看著櫥窗內的音樂盒，我也很少見看到她這麼執著一個沒有用的東西，但我不會被她給欺騙、騙人的人不會被被騙的騙，所以我不會做出讓步的。\n　　「妳到底喜歡這個東西什麼？」我已經想趕快離開了，所以出於無奈又走回去那個櫥窗，看著那個很貴的音樂盒：「不就一個雕刻好看了點的木盒子裝了些會發聲的零件，到底有什麼好的？」\n　　「雖然說不太出來，但就是覺得很漂亮。」姜燕目不轉睛的看著音樂盒回答：「感覺上面和小兔子跳舞的女孩子很漂亮、水晶球裡面飄落的樹葉像瑪莉亞一樣溫柔、旁邊唱歌的小鳥尾巴像是戴莉的呆毛一樣可愛。」\n　　「可以不要把人的頭髮形容成鳥的尾巴毛嗎。」頭感覺有點痛，大概是我要暴怒跳起痛扁姜燕的前兆，我揉了揉眉心決定犧牲自己的錢包來換取腦袋的片刻安寧還有安撫面前小孩，但我絕對沒有被她亮晶晶充滿想要好想要的表情給屈服：「這麼貴的我們確實買不了，要是真的買了就連買新衣服的錢都沒有了。但我知道哪裡有便宜一點的，我帶妳去買便宜一點但跟這個差不多好看的，可以了吧？」\n　　「咦，可以嗎？」聽到我說會買，她眼睛馬上就朝我看來露出了像是買到心愛玩具的小孩一樣。雖然知道她只是高興、但那張臉總是讓我覺得像是在說＂得逞了＂那樣，越是這樣覺得就越想打爆面前這傢伙的腦袋。\n　　「對，帶妳去買。」我再度點頭，為了我即將失去的少得這可憐的零用錢而感到悲傷。今天我想買的東西只能再苛扣一些了，下次我一定要討回來，從她的錢包裡、摸出來。\n　　在我二次同意後她終於願意離開那個櫥窗，勾著我的手（而且我掙脫不開）笑嘻嘻的前往下一個地方。\n　　不得不說監督是很聰明的，大概是過於了解自己的孩子、所以撇除購買衣服的額度還多塞了一點錢讓姜燕再看到其他想買的東西有額外的費用可以花，總之在我費心費力的挑選下、我終於完成了任務、也買到了自己的想要的東西。\n　　「所以戴莉為什麼要買布料哪麼少的睡衣啊？」姜燕歪著頭問，但我完全不想理她。衣服買來當然是為了自己開心，那能還有什麼原因？剛才店員也一直問我是要穿給誰看、對方有沒有什麼特別的愛好之類的，誰說蕾絲睡衣還是情趣睡衣什麼的，非得穿給誰看不可？\n　　「我爽。」於是我這樣回她，我現在心情很好不是很想跟愚蠢的腦袋計較太多，而且不管怎麼解釋，她下次肯定還是會再問一次的，誰叫她遇到稍微複雜一點的事情就左耳進右耳出，有時候都會懷疑她耳朵根本沒連大腦。\n　　「那、那下次戴莉也給我挑好不好？我也想穿跟戴莉一樣的睡衣！」姜燕停不下來，她就像是一顆陀螺一樣、有人抽她就會到處轉，很吵。\n　　我不想給她買、也不想幫她挑，幫室友挑蕾絲睡衣這件事情本身就很奇怪，再者姜燕每天睡覺就只穿運動內衣加內褲，布料說不定比自己還少，到底有什麼意義？\n　　我沒有回應，但她還是繼續講她的：「啊，要不要也挑一件送給瑪莉亞？不知道瑪莉亞適合穿什麼造型的，不過我覺得她很適合白色跟很淡的那種綠色！」\n　　「瑪莉亞才不想穿。」我說。而且這是實話，她睡覺都會穿那種oversize的襯衫，而且常常用異樣的眼光看我。總感覺她不是這類型的受眾，雖然我也不是很在乎，但說到這睡衣就不得不提到剛畢業的時候三個人擠一張小床都故事：「妳忘了嗎？一年前我穿睡衣的時候瑪莉亞後退了好幾步，用看到鬼一樣的表情問我『妳睡覺穿的這麼不知廉恥的嗎？』，雖然現在已經接受了，但是怎麼想她都不會穿這種衣服的。」\n　　「是這樣喔……」姜燕露出很失望的表情。\n　　「可以不要擅自對本來就不會這樣穿的人失望嗎。」\n　　而且說起來穿的最不知廉恥的人應該是她吧？她的作戰服怎麼看都不正經啊！\n　　雖然她說那是為了吸收超能力，但她的肚子上不是也有紋身嗎？\n　　『要是再減少露出的布料我就不能見人了。』她害羞地捂起臉說。\n　　『喔，是喔。』我很平淡的回應。\n　　不過真的要說起來的話，如果是休假期間的話她確實穿的比較多呢……\n　　「戴莉戴莉，賣音樂盒的店在哪裡？」姜燕在前面晃來晃去，到處東看西看。\n　　「我還以為妳忘記了，都打算直接回去了。」\n　　雖然是騙她的，我一直都走在要去賣音樂盒的商店的路上。\n　　「什麼！戴莉妳居然騙我！」她立即又露出淚眼汪汪的大眼睛，看起來充滿悲憤和不敢置信，語氣中的絕望和震驚交雜，指控我的詐欺行為。\n　　「妳也不想想我是誰，我可是14歲就能在歐洲橫行的詐騙集團首腦耶。」我高傲的揚起下巴，露出狡猾的笑容：「騙騙妳這種腦袋不靈光的小白癡只不過是動動兩根手指頭而已，要怪就怪這麼容易就相信我、然後被我騙的妳！」\n　　我剛說完，姜燕的眼淚就跟不要錢一樣噴湧而出，然後開始講一些有的沒的；「我、我這麼相信戴莉妳，戴莉妳居然欺騙我……！」\n　　「我們這麼多年的感情，也是騙我的嗎？」\n　　我們也才認識兩年耶。\n　　「當時我為了和戴莉在一起，可是負債了啊！」\n　　畢業聯合作戰那時候的債是我們三個一起背的吧？\n　　「明明每天都睡在一起，就連一點真心都沒有嗎？」\n　　瑪莉亞也在同一張床上吧！\n　　而且說到底是因為錢都拿去還債了才沒有錢買新的床吧！\n　　「小姑娘，妳這樣就不對了。」\n　　不知道從哪裡出來的大嬸對著我指指點點：「大嬸沒有看過兩個女孩子談戀愛，但我也知道不能這麼糟糕的對待為妳掏心掏肺的人喔。」\n　　「蛤？」\n　　談戀愛？我跟這白癡？\n　　「這麼好的女孩子也很少見了，妳要好好真心然後獨立起來、和她一起還債啊。」\n　　「不是、她說的根本就不是大嬸妳認為的那樣——」\n　　「唉，我懂我懂。年輕的時候我也被這樣的渣男給——唉，都是二十幾年前的事情了，小姑娘妳千萬不能跟那男人一樣啊！」說完她就搖頭嘆氣、走掉了。\n　　大嬸！妳能不能聽我把話說完！\n　　我們只是同事啊！是同僚！是隊友！\n　　不是什麼亂七八糟的女同性戀！\n　　「嗚、嗚嗚嗚……！」\n　　姜燕還在哭，我忍耐已久、幾乎可以刷新我對姜燕忍耐紀錄的怒氣終於爆發，一個拳頭下去、姜燕停止了哭聲、轉為啜泣，我在此刻相信了拳頭才是硬道理、愛的教育是狗屁不通的東西。\n　　有些狗，就是該給予鐵的制裁。\n　　「妳再哭，我等等就去挖妳的墳，把妳活埋進去三天後再挖出來。」我抵著她的額頭，壓低聲音威脅。\n　　「嗚……但是……」她小聲哭著，嘴裡嘟囔著她那個音樂盒。\n　　「我剛剛只是跟妳開玩笑，妳聽不出來就算了，還當場哭出來害我丟臉，妳這腦袋裡面什麼都沒裝的蠢狗。」我低聲罵，她又更委屈了。但我已經失去了耐心，抓著她衣服上的領帶往前方街道直直的走。\n　　「戴莉……」\n　　「好了別吵，再吵我就把妳丟海裡面給鯊魚還是什麼大王章魚、尼斯湖水怪當飼料。」\n　　我再生氣下去感覺會把她壓在地上暴打一頓，所以我選擇拽著她往目的地前進。\n　　走了快三分鐘，一個有些老舊的招牌出現在眼前，我把姜燕丟出去：「到了，白癡。」\n　　「嗯……？」感覺鼻涕快要掉出來的姜燕往店面的方向一看，是一家販售小型禮品的商店，雖然位置有些偏，但裝潢給人溫馨的感覺，最重要的是——姜燕今天一直喊著想要好想要的音樂盒就擺在櫥窗中，雖然沒有百貨公司裡的那個豪華，但仍舊是小巧可愛的精緻類型。\n　　「哇！是音樂盒！」姜燕忘記了悲傷的情緒……應該說她本來情緒就跟翻書一樣，來得快去的也快，但我自己被害次數就多到已經不想算了。\n　　她飛快的貼了上去，櫥窗上不只一個音樂盒，陳列著好幾個，我像是帶著孩子出門結果孩子貼在玩具展覽櫃前哭著說不買到就不回家的剛剛母親一樣站在一旁。\n　　「裡面還有一整個櫃子的，進去挑吧。」我說完後直接走進去，姜燕也急匆匆的跟進來，音樂盒的展覽櫃就在結帳櫃台旁邊所以相當顯眼。她興匆匆的走過去，抬頭問老闆能不能轉動拉條看看，得到了許可後就小心翼翼的轉動、音樂盒傳來清脆且安寧的音樂。\n　　這間店我直接路過的時候調查過，價格不算太高、但也沒有很低，為此我剛才購物的時候保留了一部分的零用錢下來。\n　　「只能買一個，知道嗎？」我叮嚀著，她飛速的點頭、眼睛看著櫃子上一個個音樂盒的造型挑選著心儀到，我只是站在一旁等待著她。\n　　「戴莉我選好了，我要這個！」她很開心的拿著一個圓形的音樂盒，我湊近去看、長的像一塊蛋糕，打開來後裡面有幾個人在跳舞、音樂播放時他們會旋轉、像是在舉辦什麼慶祝會一樣。\n　　「選好了，就拿去結帳。」我對她選了什麼音樂盒實在沒意見，我有意見的是只有付的是我的錢。\n　　更悲傷的是，結帳的時候發現還超出了我的預留金額一些，我只能更加悲傷的從腰包伸出摸出幾張私房錢來付款。\n　　「謝謝戴莉！這個真的好棒喔！」她像是捧著什麼寶貝一樣，小心的拿在手上、但又想和我分享。\n　　「嗯，很好看。」如果花的不是我的錢的話會更好看。我撇了撇嘴，走在回去的路上，想了想今天各種無妄之災，頓時感到委屈萬千。\n　　姜燕很好騙，但是她過於把我們的話當作真的——明明對於其他不是很熟的人就會懷疑一下的，但是對我們這些週邊親近的人就……唉，根本沒救。\n　　就像今天這樣，明明只是想開個玩笑的，結果我差點社會性死亡，我現在又想打開她的腦袋看看裡面都裝了什麼東西。\n　　「啊，妳們回來了。」剛上波拉里斯輪，瑪莉亞正好從圖書室出來，姜燕立馬湊上去暫時她剛剛獲得的音樂盒。瑪莉亞看了一下之後摸了摸她的頭稱讚：「很好看呢，姜燕很會選音樂盒。」\n　　「嘿嘿，我就知道瑪莉亞也會喜歡的。」姜燕真摯的笑著，看起來像是被稱讚的小狗一樣，我白眼翻上了外部次元，選擇開啟靜音模式休息。\n　　「所以妳就給她買了那個音樂盒嗎？」\n　　姜燕拿著她的音樂盒去找其他人炫耀了，我順勢和瑪莉亞聊了兩句今天的事情，只見她皺著眉說：「妳也太寵她了吧。」\n　　「寵？我？不要笑死人了好嗎。」我完全無法認同這種論述，因為這根本不是我。我說過了，她那張委委屈屈、楚楚可憐的臉，我看一眼都心煩，被矇騙是半點可能沒有。\n　　我嗤之以鼻：「那是她黏在玻璃窗上怎麼勸說都不肯離開我才勉強答應她的。」\n　　「可是妳還是服軟了。」\n　　「所以我說了那是因為她太煩了。」\n　　「她在外面哭的時候妳還是帶她去挑了。」\n　　「那是因為再不堵住她的嘴我就要變成了世紀大渣女了。」\n　　「寵……」\n　　「我沒有。」\n　　沒有的事情就是沒有，寵姜燕的事情一丁點都不會有，反而我哪天把她頭摘下來才是真的。\n　　「戴莉，我想吃這個翻糖巧克力鬆餅！」\n　　「我不要做，去找妳媽做。」\n　　「可是戴莉煮飯很好吃嘛！」\n　　「我不要。」\n　　「戴莉！我想吃嘛！」\n　　「戴莉——」\n　　「做！做！做！看老娘不把妳的胃撐到爆炸！煩死了，妳就沒有別的人能喊嗎？」\n　　「戴莉妳就是太寵……」\n　　「我沒有！」\n　　頭真的好痛，我上輩子到底是做了什麼才會被姜燕纏上？",

        "daili": "　　「啊、戴莉戴莉，我想看那個！」剛從外面回來的戴莉一頭撞上擋在她面前的姜燕，因為對方出現的太過突然所以嚇得後退一步，差點踩到傳送之光又被傳送下去。\n　　「什麼鬼東西？」站穩腳步，雖然已經習慣姜燕總是突然冒出之類的，但每每遇到還是覺得對自己的心臟不是很好。\n　　「剛剛新聞在播最近有人利用次元災害詐騙的事情，聊著聊著就講到妳之前的事情了。」瑪莉亞在她身後解釋，嘆氣搖搖頭：「她突然說什麼『等戴莉回來我要讓她給我看戴莉的幻術！』然後就蹲在門口等妳回來了。」\n　　「看家的狗是不是。」她把手上的紙袋塞進姜燕的手中，她看著紙袋中的麵包很開心感覺身後有尾巴在搖，戴莉瞇起眼睛感覺面前的人真的是隻狗。\n　　「不得不說是真的很像。」瑪莉亞附和，在這點上她確實認同。\n　　「所以說讓我看嘛！」姜燕嘴裡已經塞著麵包，一邊咀嚼一邊請求戴莉給她表演早就不知道幾百年沒有用過的技術：「我想看戴莉變成別人的樣子！」\n　　「好啊可以啊。」戴莉隨手抽出剛剛順手買的蒸氣眼罩，圖案是繃帶樣式的。她放在自己眼前：「這樣就是別人了吧？」\n　　「別這樣……」瑪莉亞已經很白的臉色變得更白、不適的抓著她的手：「對心臟不好。」\n　　「這個不是戴莉啦。」姜燕的臉也扁了下去，不久前的回憶湧出讓她整個人都萎靡了。\n　　「是妳們說要看我變成別人的啊。」雖然闖禍的是自己、但想到離家出走半個月結果回來全身骨折躺了整個月她就覺得有些心理不平衡，想小小報復一下而已。戴莉覺得捉弄夠了就把眼罩收起來，然後抱手看著兩個好奇寶寶：「不玩妳們了。我先跟妳們說，幻術只是我的超能力而已，它的作用只是利用超能力迷惑我在他人眼中的樣貌而已、並不是變成別人。即使這樣也要看嗎？」\n　　「嗯嗯，我要！」恢復精神的姜燕用力點頭，無光的雙眼看起來有星星在閃爍，瑪莉亞則是無所謂但又帶著探究的目光悄悄望著她。\n　　「嗯……那就先這個吧。」戴莉背過兩人，使用起有些生疏的技術捏起想像中的樣貌，半晌後照著鏡子確定自己技術還在的她轉向兩人：「這樣怎麼樣？」\n　　兩人嘖嘖稱奇，姜燕更是繞著戴莉三百六十度無死角的看：「好厲害！只看臉的話戴莉就像是別人一樣！」\n　　「這張臉是……」瑪莉亞側頭思考了一下，在記憶中尋找這張似曾相識的面孔，隨後在很久以前看過的一角報導中找到：「在法國被抓獲的詐騙集團首腦『蘇菲』……！」\n　　「喔？妳知道我啊？」戴莉笑了起來，時間已經過去兩年多了沒想到還能被記起來：「沒錯，『幻千面孔』的蘇菲就是我。」\n　　「要不是因為跟黑道發生摩擦還有火焰王之女那混帳的話，現在我應該還是搞詐騙的。」現在想想還是有點懷念，但更多的是悲傷。正因為發生了非常多的事情、所以對這個身份有非常多未結的留念。但看著面前的兩人，她現在反而覺得這樣的結果是最好的、當然這要命的仇總有一天是要跟那Bi×ch討回來的。\n　　「啊……但是這樣戴莉就不會認識我們、或是會站在我和瑪莉亞的對立面了吧。」姜燕扁嘴，因為她很喜歡戴莉所以想到如果現在沒有認識戴莉的話會無比難過。\n　　「要是我沒有炸毀跟放火燒掉德國實驗室的話現在就只是米歇爾那死老頭的傀儡了喔？」瑪莉亞拍拍姜燕肩膀讓她打起精神：「打起精神來，現在大家不都是因為選擇了自己期望的方向所以才在這裡嗎？」\n　　「那我還要變嗎？」將面容換回原來樣貌的戴莉抱著手看著兩人在那邊互相安慰有些無言，把自己當馬戲團是不是。\n　　「要、要！」姜燕抓著她的手臂，輕輕的搖晃拜託她：「戴莉讓我看！」\n　　接下來的時間就是戴莉一直用她的幻術完成兩人各種許願的樣貌，直到一個小時後她終於罷工不幹了：「……好了這是最後一個了。」\n　　她將面容換回本來的樣貌，兩人終於露出滿足的樣子收起了新鮮感：「我可不是妳們的玩具，小心之後讓我不高興我就換個臉躲起來讓妳們找不到我。」\n　　「才不會有這種事情呢！」姜燕露出得意的樣子：「我也有自信戴莉不管臉變成什麼樣子我都能認出來喔！」\n　　「我才不信。」戴莉撇撇嘴，她才不相信光憑姜燕那讓人不可恭維的愚蠢可以在人群中找出變裝後的她。\n　　「我也……雖然沒有姜燕這麼有自信，但是我想應該能認出來。」瑪莉亞半舉手表達自己的想法：「雖然不知道怎麼形容，但可以是說是某種自信吧。」\n　　「妳們還真的很敢說耶。」她聳肩，不打算在此事糾結。\n　　「而且戴莉很好認嘛。」姜燕說。\n　　「嗯，確實。」瑪莉亞點頭。\n　　「什麼意思？」這下換戴莉不懂了。\n　　「戴莉胸部那麼大，在人群中也沒幾個人了，對吧瑪莉亞？」\n　　「啊、咦、嗯……對、對吧……」瑪莉亞瞄了一眼戴莉的胸又看了一眼自己的，最後有些氣餒的認同。\n　　「去妳們的！」戴莉一拳頭敲在姜燕腦袋上。\n　　「好痛！」姜燕發出熟悉的聲音。\n　　戴莉覺得她真的受夠姜燕這白癡了。\n　　但又不知道為什麼嘴角又無法控制的微微勾起，打從心底深處感到了淡淡的安心。\n　　「戴莉妳到底是在生氣還是在開心啊？為什麼打了我又笑？」姜燕淚眼汪汪，但其他兩人早已習慣了她這樣的表現，不過戴莉還是下意識的想要敲下去。\n　　呃、姑且這傢伙救過自己，不然這邊就收手吧？\n　　但是，這一拳不敲下去的話感覺渾身不自在……\n　　「……要妳管！」\n　　算了！想想還是敲吧，反正她腦袋又不缺這拳，而且也不可能比現在更笨了吧？\n　　「打妳是因為妳的腦袋在呼喚我的拳頭啦！」\n　　理由也隨便找找就行。",

        "maria": "　　一切都結束了。\n　　隨著火焰王的失敗，終於換到了短暫的和平。\n　　在場的特工為了世界的一線生機，累得癱倒在地上、但每個人都非常慶幸守護住了自己的事物。\n　　「終於……告了一段落了。」瑪莉亞的超能力幾乎透支，甚至使用了不少次權能、但好在沒有和過往一樣濫用，所以能夠感覺到自己身上只是疲憊而以。她現在只想洗澡、躺在柔軟的床上好好睡一覺，什麼作戰報告、身體檢查，都等休息夠了再說。\n　　「但是這次，好好的保護大家了！」姜燕大字型癱在地上，她也沒有力氣了，而且本來她個性就很隨意，所以這樣沒有形象的躺著也不是很意外。\n　　「我回去一定要給她睡個三天三夜……」戴莉坐在地上，軍團長的強度超過了她的想像、現在她全身痠痛完全不想動。\n　　「啊，瑪莉亞等等回去後我們一起——」姜燕看向瑪莉亞，卻在目光對到後錯愕：「瑪莉亞、妳在流鼻血！」\n　　「啊、大概是權能有點用過頭……噗呃！」瑪莉亞已經有點習慣使用權能後會流鼻血了，畢竟是外部次元的超能力，以她的身體狀況來說也是很自然的事情。正想告訴姜燕沒事，但下秒一股噁心使她嘔吐、一口血吐了出來，滿嘴的鐵鏽味和暈眩感包覆全身，甚至來不及讓她思考原因：「咦……突然頭有點暈……」\n　　「瑪莉亞！」\n　　「喂！」\n　　「小瑪莉亞前輩！」\n　　眼界中最後的樣子就是姜燕、戴莉和克萊兒焦急朝她跑過來的樣子，隨後眼前一黑、倒了下去。\n　　-\n　　「不行，她絕對不能待在這裡了。」瑪莉亞在意識朦朧中聽到說話的聲音，因為身體不適、所以她無法透過聲音分辨是誰在說話，但這個強硬的語氣，應該是戴莉吧？努力壓著怒意說話的樣子。\n　　「一定有方法可以讓瑪莉亞康復的吧？」這個充滿不確定性、又帶著一點希望的聲音是姜燕……不知道她們在說什麼事情，但好像在談論她。\n　　「我不想把話說得太難聽，但是她要是繼續待在前線的話把命送走只是時間問題，就當作是為了拖延時間，也不該讓她繼續戰鬥。」戴莉的聲音很低，幾乎是咬著牙在說話：「不能讓她呆在狡兔了。」\n　　「但、但是，瑪莉亞是狡兔重要的成員啊！」姜燕慌了，本來就不善言辭的她聽到戴莉想讓瑪莉亞退出狡兔小隊感到驚慌，對她來說有戴莉和瑪莉亞的狡兔才能叫做狡兔小隊，這個小隊是由她們三人一起開始的，誰都不能放棄。\n　　但她也知道瑪莉亞現在的身體差到不行，絕對不能持續出戰：「至少等瑪莉亞醒來之後先問一下她的意見……或是讓瑪莉亞少出一點任務的話……」\n　　「妳到底要天真到什麼時候？妳的腦袋真的是什麼都不裝嗎！」戴莉非常憤怒的吼了她，她雖然常常生氣、但只是因為煩躁的緣故，這次是她少數真正的因為姜燕的笨而大發雷霆：「剛剛的檢查結果妳有聽進去半個字嗎？他們說了，瑪莉亞的身體早在入學前就開始慢性衰竭了！妳知道什麼是慢性衰竭嗎？那是即使活著也會逐漸動彈不得、然後死掉的意思！」\n　　「如果不使用權能的話最少可以活到20歲的，但是這次作戰她一直在超支使用權能、即使馬上就收回來了還是一直在使用權能，導致她剛才會吐血暈倒，權能在透支瑪莉亞的生命！」\n　　「現在的瑪莉亞要是繼續作戰的話，她不用三個月就能把自己操死，那還不如讓她辭職特工的工作，至少能活半年或是更久一點，如果妳真的為了她好的話，就應該讓她離開狡兔小隊去當普通人！」\n　　「我……」姜燕說不出來半句話，即使她再笨也知道戴莉那番話的意思，張了張口想說些什麼，最後只是用嗚咽的哭聲小聲的說：「我不知道……」\n　　她的不知道並非是不明白，而是不知道怎麼做才好。\n　　戴莉長久和她相處下來也知道姜燕想說什麼，最後她也閉上嘴、擺著臭臉什麼都不說，空氣又歸於寂滅。\n　　「我不會辭職的喔……」瑪莉亞沙啞的聲音，小又明確的發出來，在病房中響起巨大的回音。\n　　「比起作為普通人死掉，還不如身為特工的時候、為了保護重要的人事物，在使用超能力過度後死掉的好。」瑪莉亞費力的轉頭看向兩人露出笑容，但可能因為太過虛弱了、這個笑非常勉強，反而讓兩人的表情更加悲傷。\n　　「普通市民瑪莉亞•薩圖恩死掉了，跟狡兔小隊的特工瑪莉亞•薩圖恩為了保護世界而死掉了——不管怎麼看都是後者比較好，對吧？」\n　　「但是、但是我不要瑪莉亞死掉啊！」姜燕激動的喊，聲音很大，像是要穿透病房一樣。\n　　戴莉不爽的踹了她一腳，看著病床上實際意義上看起來真的快死掉的瑪莉亞。現在的瑪莉亞看起來風一吹就會被吹走，有種隨時都會斷氣的感覺。\n　　「妳打從一開始就知道了，但妳還是執意要當特工、還要參加前線的作戰，對嗎？」\n　　瑪莉亞沉默，然後笑了：「……我不知道妳說什麼呢？」\n　　「女人，反正妳都得死了，只是時間早晚問題。妳要是敢跟我說謊，我不介意提早妳半年忌日變成今天就讓妳走。」戴莉咬著牙，一如既往的仰著頭高傲的看著瑪莉亞，但實際上她眼眶已經快要掉淚水出來，不這樣她根本沒辦法忍住淚意。\n　　「好吧，我還想當半年特工。」不知道瑪莉亞說的這句是不是開玩笑，但她還是說了下去：「是，我從被救回來開始就知道我頂多活到成年、也就是20歲，但我還是非常堅持要做前線的特工。使用權能的時候我也清楚的曉得，如果我長期甚至過度使用的話我連20歲都活不到，但不管是上次妳的事情、還是這次火焰王的事情，我都沒有後悔使用權能過。」\n　　「……就當我多嘴吧，希望妳們不要怪美英監督。她知道我身體很差、也勸過我就算要當特工好了，最好選後勤的工作，但我還是很堅持要成為前線的特工。只能活到20歲這件事情我沒有跟她說過，本來打算把這個秘密帶到墳墓裡面去的，監督她沒有錯。」\n　　「妳……妳他媽——！」\n　　「妳總是這樣，總是說要更信任夥伴、更依靠大家，不要想著自己解決，結果妳連自己活不了多久的事情都瞞著我們！到底誰才是不夠信任周圍的傢伙？」\n　　戴莉感覺自己內心的炸藥桶被點燃了，她們認識這麼久、關係親近到形同家人，但她還是始終看不懂瑪莉亞的心裡到底在想什麼？這麼重要事情、應該要好好珍惜的性命，她卻如此淡薄的看待，到底把她們這些關心她的人都當做什麼了？越想她越氣，朝著瑪莉亞舉起了手，姜燕立即衝上去抱住她：「不可以！瑪莉亞現在很虛弱，戴莉妳冷靜點！」\n　　「我冷靜妳媽！她根本就不在乎自己的命，妳幫她珍惜幹嘛？我今天就把她送走——」\n　　「沒關係！瑪莉亞不珍惜的話我們替她好好珍惜就好了！」姜燕死死抱著戴莉，不讓她動彈：「瑪莉亞是重要的『家人』啊！我們好好談談吧！」\n　　「……」戴莉僵了一下，過了半晌緩緩垂下手讓姜燕鬆開自己的手，在床邊的椅子坐下低著頭沉默不語。\n　　「戴莉……」瑪莉亞不知道該說什麼好，她也在這個時候有些許後悔自己沒有早點把話說出來，看來總是自封成熟的自己偶爾也會犯下大錯。雖然戴莉低著頭，但瑪莉亞躺在病床上，可以稍稍看到戴莉低垂的臉，某個透明、閃著光芒的東西掉在她暗紅色的裙擺上，瑪莉亞意識到了，不自覺開口：「戴莉，妳在哭嗎？」\n　　戴莉幾乎不哭，不如說只在殉教者山丘那次看過她的眼淚，這次幾乎是下雨般的掉淚，但她只是用力的擦眼睛，然後用著生氣的臉看向她說：「我沒有。」\n　　「戴莉……」姜燕見到戴莉眼角的淚水，她也馬上蓄滿了眼眶，開始抽泣：「我不要瑪莉亞死掉啦……！」\n　　「我哪有那麼容易死掉。」瑪莉亞扯著笑，看起來相當輕鬆、彷彿現在虛弱的只能躺在病床上的人不是她一樣：「我就是為了活下去才會就算殺人放火也要逃出研究所的，怎麼可能就這樣停下來？」\n　　「但是、但是瑪莉亞再繼續使用超能力跟權能的話，真的會死啊……！」姜燕搖著頭，眼淚一直掉。\n　　「我不想管妳了。」戴莉站起身，臉色很差，看起來也很生氣：「想去死就去死，要入土的時候不要叫我！」\n　　戴莉站起身走了，但緊緊咬著唇，停滯了幾秒後轉身、踩著重重的腳步聲離開了病房。\n　　「戴莉！」姜燕慌忙起身，看向戴莉離去的背影，又看向病床上的瑪莉亞。她不知道該去追誰，想和戴莉好好說話、但是又怕離開後就再也看不到瑪莉亞。\n　　「去追吧，我也有點累了。」瑪莉亞微笑，她是真的有點疲憊了。姜燕又回頭看了幾次，才慢慢走出病房。\n　　「瑪莉亞•薩圖恩——」\n　　黑暗中，星光一點一點的升起，伴隨著男人的聲音。\n　　「路西法……」\n　　隔天，姜燕想去探病時、見到的是——\n　　一張空的病床。",

        "daili": "*此篇故事為戴莉就讀波拉里斯時的故事*\n　　三月二十七日，天氣微陰，下午第三節——[實戰課程]。\n　　老實說我不喜歡這個課程，今天烏雲遮住了太陽、使得空氣添加一絲冷意，即使是在戰鬥練習場地內穿著單薄的我都不禁打顫、咬著牙齒聽著隊列最前面的老師廢話連篇。\n　　「那麼，接下來就請你們尋找自己的室友進行戰鬥練習吧。沒有室友的都來找我分配練習對象！」老師拍手示意解散，場地中的少年少女們各自散開進入練習室中，而我、還佇立在原地。\n　　「戴莉！我們進去吧？」令我頭痛不已的聲音在身後以相當近的距離響起，我轉過身去望向比我稍矮的那名少女【姜燕】。\n　　她便是我不喜歡這個課程的原因之一，銳利得像是毒蛇般的雙瞳、令人不安的微笑還有張口就來的自來熟、毫無距離感的身體接觸，以及她手上那把約兩人高的雙刃劍，每次和我搭話時都會用豪邁且熱情的樣貌貼近我，但說的話總是聽不懂其中含意，只要一和她說話就會感覺背後陣陣涼意、宛如一條蛇爬上我的腿。\n　　而且，她是現時間點波拉里斯學院最強的人，就連老師們都只能勉強打贏她，聽說在戰鬥上有著天才一樣的資質，只會隨著戰鬥熟練程度變得更強，就像是被神明注視了一樣。\n　　「戴莉？」她在我的面前揮揮手，歪著頭用細長的目光看著我，就像是盯著獵物一樣。她的眼瞳中清澈且童真，卻還是讓我寒毛直立，緊抓著腰間的西洋劍。「戴莉，妳看起來臉色好差、是不是身體不舒服啊？要不要我陪妳去醫療中心？」\n　　「……！」意識到自己盯著她太久，我連忙撇過頭轉身走向練習室：「沒事，走吧。」\n　　「真的不舒服的話還是去醫療中心吧！我可以找別人練習！」她輕跑追到我的身後，慢步跟在我的身後輕聲勸說，但我並不想理她、不如說我在警戒她。\n　　姜燕是一名留級的學生，雖然具體留級原因不明，但聽說她曾經把其他隊友打到退學、無法畢業成為特工，而我因為自己的原因絕對要離開這個鬼學校去尋仇，所以不能逃避、也不能和她有所衝突，但我也確信可以從她身上學習變得更強大、因此實戰課程只能硬著頭皮上了。\n　　「我很喜歡實戰課程呢，可以活動身體的事情我都很喜歡!」她伸展身體、隨時都為了戰鬥而準備，張嘴不斷講話:「雖然世界感覺還是要和平點比較好，但是戰鬥的時候可以解放身心、腦袋幾乎是放空的狀態，只要隨著下意識的反應和武器撞擊的聲音，真的很開心呢。」\n　　我冷眼看著她熱身，感覺腦袋有點疼痛不知是冷風吹得我不適、還是一想到等等的戰鬥就讓我感到壓力和緊張。\n　　「妳好了嗎?」將腰間的西洋劍抽出，同時把腰包的扣子打開，抽出一張牌。\n　　「好了喔，隨時都可以。」姜燕單手舉起看起來有二十公斤的巨劍，露出笑容看著我。\n　　「那我先上了。」於我的實力和武器來說、先攻並不是很好的選擇。但如果她揮著劍朝我衝過來的話我也會相當難接近她，因此我最初選擇先攻的原因就並不是為了近身。\n　　咻!的一聲我將劍向前突刺，她揮出巨劍將我的劍擋下，這是我早就預料到的事情。當我的細劍插入她巨劍上的縫隙中後我便直接鬆手，劍後的她對於輕易放棄主要武器的行為露出訝異神色，而我正是等待這個瞬間。\n　　「吃我一招!」我迅速繞到她身後、不禁意喊了出來，塔羅牌射向她露出破綻的腳邊，那張牌一接觸地面就併發出煙霧，只見巨劍發出超能力的光芒後朝空中一揮驅散霧氣，還順勢將我的劍拋至空中，我跳起將細劍拿回，趁她還看不見我的時候也驅動超能力朝她砍去。\n　　「——！」循著我的聲音她轉頭望向我方向，揮著巨劍企圖喝止我的進攻。\n　　但不好意思、這劍我要了。\n　　以她的劍當作跳板，我踩在她的劍面上再度起跳，同時再度抽出一張塔羅牌朝她射去：「愚者！」\n　　眼見勝利即將得手，她錯愕的臉龐卻露出亢奮的笑容，猛地撇過頭躲避這枚直朝腦門的攻擊，塔羅牌射中地面後隨即產生爆炸，她卻以極快的速度將巨劍插在地上跳起躲過攻擊，將武器當作鋼管一樣踩在上面，根本不是一般人能夠達到的身體機能。\n　　「戴莉好厲害喔！」她笑容滿盈的稱讚，我卻高興不起來。這可是我想了一個禮拜的戰術，卻仍舊無法敵過她敏銳狡猾的身體，雖然本來就沒打算能打贏但還是令我頗為失望的結果。\n　　「我是第一次看到這樣的戰術，感覺我也要學習一下了。」姜燕笑容令我毛骨悚然，無光的眼神中滿是狂歡的情緒，令人背脊發涼的話語給我不妙的情感。\n　　不會的，說什麼都不可能就這樣複製我的戰術吧？\n　　她拿起巨劍向我走來，我謹慎的後退兩步尋找下一個突破口，而就在分神的一瞬我感覺到巨大的壓迫感朝我襲來，空氣中帶來呼呼的破風聲，我連忙朝一旁滾去隨即聽見了武器插在地面上的聲音，聲音大的有些耳鳴、同時揚起灰塵但我還是拼命尋找姜燕的身影。\n　　「在上面喔。」霧氣散去，我還未找到人影脖子就先被勒住。視線往頭上看去，只見她反抓著巨劍的把手，只以力氣撐在空中並用雙腳鉗住我的頸部，並逐漸加重力道。\n　　「呃啊……！」我拍著她的大腿，這女人哪這麼大的力氣！姜燕似乎沒意識她力氣出的太多、也有可能是她的力氣太大現在對她來說幾乎沒出什麼力氣，所以她沒有鬆開雙腿，反而加重了力道。\n　　「雖然沒辦法做到戴莉這樣輕巧……但我臨時想到的改版應該很不錯吧？」她的微笑像是一條蟒蛇即將獲得獵物般的邪笑，我臉色因為窒息變得通紅，持續用力拍打著她的腿。\n　　「雖然這個有點消耗體力，但確實是個不錯的實戰技巧，謝謝妳告訴我喔。」\n　　已經開始意識模糊了……該死，這傢伙是有用不完的力氣嗎？\n　　「姜燕，人快要被妳勒沒了，放開她。」練習室的音響響起老師的聲音，她愣了一下才連忙鬆開腿然後從劍上下來。我一邊咳一邊大口呼吸新鮮空氣，暈眩感被無限放大我眼前一片模糊。\n　　「天啊！戴莉妳怎麼都不跟我說妳要沒氣了！」她瘋狂搖晃著我的肩膀，無視我還在暈眩狀態、我開始懷疑她是真的想謀殺我。過於天旋地轉的腦袋讓我很難使出力氣讓她別搖了，最後還是等到有人來救我才結束這場地獄。\n　　「鬆手吧姜燕，她快被妳搖到腦震盪了。」遠處一個藍色的身影對她說，身後跑出來幾個人把我抬上擔架，我揮著手讓他們等等，然後把姜燕叫過來。\n　　「戴莉……」只見姜燕雙目淚眼汪汪，毒蛇般的外表露出無辜且悔恨的神情，我覺得這是我眼花了、因為她絕對是時時刻刻想除掉我的人，我使出全身的力氣往她呼出響亮的一巴掌：「操！我剛剛就一直拍妳腿讓妳放開我了，妳這白癡！」\n　　接著在她錯愕的神情中昏過去。\n　　－\n　　躺了大概兩三個小時我才醒來，我的床邊放著鏡子、雖然我不覺得大腿可能把夾出勒痕但為了身體著想我還是拿起鏡子端詳起來，鏡中的我沒有受傷，就是脖子紅了一大圈。考慮到躺了很久應該消紅了不少，我猜那個當下肯定差點要死在那。\n　　我真的會恨死這白癡。\n　　經過醫療人員的檢查後我被放回了宿舍，一想到等等還要看姜燕我就全身緊繃，連邁開簿子的腳都顯得沉重。那傢伙看起來就是有仇必報的樣子，剛剛一時氣憤甩的巴掌大概會讓她想盡辦法報復我吧，應該要找天去申請換房間保住我的小命了。\n　　「我回來了。」伸手打開房間裡面的燈，裡面沒有任何人。看了下時鐘、七點半正式吃飯的時間，大概那傢伙出去吃飯了。\n　　我沒有任何食慾，所幸抓了換洗衣物進了浴室，同時將送回房間裡面的西洋劍拿進浴室中用來防身。\n　　水的聲音讓我稍微放鬆，熱氣也使身體暖活，正當我覺得可以稍微休息一下的時候浴室門喀的一聲打開了，拿著水果的姜燕和我目光對上，為之錯愕。\n　　「咦戴莉，妳回來啦？」她語氣因為開心而上揚，就像我沒有甩她巴掌一樣。她手上拿著一籃水果，另一隻手拿著剝好的香蕉準備入口，她提起水果籃問：「老師們說妳可能今天不會來，我還想說要去照顧妳呢。對了，妳要吃什麼水果？我現在順便洗給妳吃。」\n　　「——洗妳的大頭鬼啊！」\n　　我嚇得下意識抄起蓮蓬頭、拉開玻璃推門就朝她噴灑，她被我淋的一身熱水，發出哇哇大叫：「怎、怎麼又罵我了？妳還在生氣嗎？對不起、我道歉！對不起啦戴莉！」\n　　「這是生氣的問題嗎！」扔下蓮蓬頭，我抽起玻璃門旁的劍朝她砍過去，她迅速閃掉但是香蕉被我砍下來一塊、我更火大了，包起毛巾決定今天就在這裡跟她決一死戰。\n　　「戴莉妳是想切水果嗎？但是武器不能切水果，會髒掉的！」她仍舊是那雲裡霧裡的可憐模樣，我再也認不住：「我切妳媽啦！」\n　　隨後再度揮劍，她閃出了浴室持續喊叫著：「我沒媽啊！」\n　　我現在徹底確信了，姜燕的腦袋是一頭豬。絕對是一頭豬！\n　　我人生第一次看到外表長得像毒蛇結果跟狗一樣的人，這不應該。但比起這個，我現在只想殺了她。\n　　「我就有嗎！」沒有多想我追出去、她跑到走廊上，我也跟著追到走廊上，最後使用超能力在劈在她後面的路上。這傢伙不僅是頭豬，還是猴子。不知道為什麼每次攻擊她都會千鈞一髮的閃過去，讓我愈發惱火。\n　　「停下。」稚嫩且冷靜的聲音響起，我們莫名其妙地停下……不，是動不了。身後走來藍髮的少女、好像在哪裡看過她。她有隻眼閉起，臉上冒著汗看起來不太舒服但還是開口對我們說：「我不知道妳們在幹嘛，但在放任妳們下去宿舍就要被炸了。請先這樣子等到宿舍長來吧。」\n　　沒有多久，宿舍長真的來了，我們兩個被臭罵一頓，後來還發現浴室的門鎖被姜燕扭壞了，結果她居然要我們兩個一起賠償。\n　　操，我恨姜燕。",

        "daili": "　　「特工，妳來了。」諾亞微微屈身致意，雖後向妳說明邀請妳到圖書館的原因。\n　　「這次雖然經過了一些波折，但我還是徵求到了特工的記憶。而這位特工正是——狡兔小隊的戴莉特工。」她有些難為情使用長袖遮住自己的臉：「雖然稍微被捉弄了一下……總之，我還是出色的完成了工作。」\n　　雖然妳有些好奇到底是怎麼被捉弄了才能如此害羞，但沒有給妳詢問的時間，諾亞利即便的嚴肅起來，說明這次取得的記憶：「不知道您對戴莉特工的事情知道多少呢？」\n　　妳搖了搖頭，戴莉幾乎完全不說自己的事情，無論是隊友、管理特工、或是任何人。她看似我行我素的行動中包裹著一層疏離感、可以從她毫無教養的行為中感受到拘謹以及更多的是自我保護，所以就算熟識了、雙方也不一定能稱之為朋友。\n　　「我想各位特工大概都與戴莉不熟悉。」諾亞點點頭表示理解，隨後說：「這次經過火焰王之女的洗禮事件後，戴莉特工貌似有了不同的想法、在我再次詢問時同意交出記憶製作成可供其他特工觀賞的書籍。但我檢查之後發現來龍去脈幾乎是戴莉特工的整個人生，無法單獨截去任何一段作為觀賞，所以這次我以人偶劇為藍本、向Ｄ伯爵請教後製作出『火花人偶的劇本』。」\n　　妳歪著頭，詢問和往常的記憶書籍有何不同？\n　　諾亞垂下她圓潤的眼眸，白皙的臉頰染上紅暈、有些羞澀的回答：「也就是……這次不是閱讀記憶、而是閱讀我所改編的劇目……」\n　　原來是新手編劇諾亞的出道作。\n　　妳很高興的表示非常榮幸可以看到諾亞改編的記憶，但諾亞只見略顯蒼白的臉蛋逐漸因羞澀而愈發嬌紅、就像是將自己的日記本給其他人看一樣害燥。\n　　「總、總之……！我已經將劇本給具現化出來了，就請妳去觀賞一下吧！」諾亞將整張臉埋住，悶悶的聲音從大袖子中傳出：「那孩子非常顯眼，一定馬上就能找到的……！」\n　　諾亞的臉紅到像是快成熟的番茄，妳真好自己去尋找能夠觸發「劇目」的記憶中的人物。\n　　尋找目標並沒有花費多少時間，畢竟亮橘髮色的人並不多見，妳在一處書架的角落發現蜷縮著的小女孩，她全身髒污、繃帶環繞、仔細一看皮膚上滿是傷痕，妳輕輕呼喚她一聲『戴莉』、卻只在她深紫色的眼瞳中看到恐懼。\n　　▷\n　　【劇目 1：第一次的奪取】\n　　『我是……坎特蕾拉……史考特。』\n　　-\n　　10 年前、法國某處的貧民窟。\n　　「又是妳！」石頭扔到小女孩的頭上，細小的血流從她的腦袋流下，可她沒有放下手中的麵包、而且三步並作兩步用迅速的速度逃離了店主的視線。店主只能氣到在後面喊：「小雜種！妳最好不要讓我抓到妳！我絕對把妳打死！」\n　　聲音傳進了她的耳中，但她並沒有在意，只是拼命撕咬剛剛偷來的麵包，許久沒有喝水而乾裂的嘴唇因激烈的動作撕裂、傷口湧出的鮮血成為她配乾麵包的水源，鐵鏽的味道好麵包的芬芳混合在一起——就像是泥土的味道一樣。\n　　「打死就打死，看我是先餓死還是先被你打死。」○○○不屑一顧，她什麼時候有下一餐都不知道、難道會怕亂棍打死？\n　　「接下來是……」她看向懷中的三法郎，這些什麼錢都沒辦法做，但可惜家裡還有一個王八蛋老爸。\n　　「——抓住那個小偷！」身後的胖男人氣喘吁吁的追著，而○○○迅速的奔跑著，嬌小的她穿越人群，以迅雷不及掩耳的速度鑽進暗巷中，暗巷的縫隙非常小、胖男人連手臂塞進來都困難無比，只能眼睜睜看著自己的錢包被偷走，在後面怒吼：「混帳！混帳！混帳——！」\n　　「二十五、二十六、三十……這傢伙怎麼這麼窮？」○○○有些懊惱，看他又胖又穿著西裝還以為是有錢人才上去偷的，結果錢包根本沒有多少錢，勉為其難也只夠買一瓶酒。\n　　管他的，反正只要那王八蛋離自己遠點就行。她穿過小路、走進小路中，在一個攤販拿了一瓶便宜的酒將剩下到十法郎塞進口袋中小心包好避免發出聲音，拿著酒就往自己家破破爛爛的小屋走。\n　　越往自己家走就感覺像是入了魔窟一樣，無論是心情還是身體都本能的緊張且不適，心跳加速、劇烈的跳動，但還是麻木的推開生鏽的木門——吱呀……然後是哐、碰！一個啤酒瓶砸在自己腦袋上，血流滿面。而自己只能失聲的笑：「我回來了，把酒買回來了。」\n　　這個家好似地獄，外面再怎麼風吹雨打、都沒有這個家門後的事物可怕。\n　　所以，她為什麼要怕家門外的事物呢?\n　　大不了一死，說不定死了才好。\n　　但，她不會死，她要活下去、活得比誰都好。\n　　「廢物！雜種！混帳！妳這沒用的東西！一瓶酒怎麼會夠喝?妳到底在搞什麼鬼?」又一個東西東西從臉龐飛過，撞在牆上哐噹的一聲碎裂、這次是另一個小的酒瓶。　\n　　「您別這麼說，我只是一個七歲的小孩而已、哪有錢買酒呢……」\n　　話還沒說完，一個東西打到臉上，現在連鼻腔都開始流血了。低頭一看，這次是煙灰缸。\n　　「少跟我說些別的！我怎麼知道妳要怎麼把酒拿回來？總之給我去拿酒回來！」\n　　「好喔。」\n　　「媽的！妳這什麼態度！」\n　　接下來便丟出來了遙控器、衛生紙盒、各種可以扔的東西，她隨意的一邊被東西丟中、細皮嫩肉的皮膚被砸出各種瘀青，流出來更多的血，默默地走出家門。\n　　「……」今天實在是不想跟這個王八蛋待在一起，隨便找個地方睡吧。她抱起門外木箱中被她隨意整理的寢具，朝不遠處的倉庫靠近。\n　　倉庫並不是她們家的，但房主知道她家情況、出於同情姑且對她有時候睡在裡面的行為無視，但不代表他就會插手這個家庭的事情。就只是無視她睡在裡面而已。\n　　她將木箱放在倉庫外告知房主她今晚會留宿，雖然太陽已經在西邊了、但離下山還有三個小時多。○○○決定去再去外面看看、說不定晚餐能有東西可以吃。\n　　經過一條小溪、她往裡面看了一眼——本來是想看有沒有魚的，結果只從水面反射看到滿臉血的自己還有被血浸透的單薄衣服。\n　　即使是黑色的單薄連身裙、長時間流血後也隱隱透出鏽紅色，裙邊因為和那個王八蛋爭執而撕毀的裙角也遲遲沒有縫補——不如說她也沒辦法縫補，她全身上下就只有這一套從回收箱翻出來的內襯而已。\n　　總之這樣不管誰看了，這幅面孔都很可怕，所以她左右看了下確定沒有人之後用自己小小的手捧起溪水將自己的臉洗了一遍，直到倒影中她的臉變得乾淨位置。\n　　——今天就回去吧。反正早上也吃過了。\n　　那天晚上她整個人都是暈的，有種不斷往下沉的感覺，意識也變得好遠好遠——但當陽光照射下來的時候、她還是醒來了。\n　　新的一天開始了。\n　　她感覺到腦袋很濕、只見枕頭被血跡浸染，明顯是傷口沒有癒合、就這樣在枕頭上染開了。\n　　收拾東西時，她看見了木箱裡面放了一捲繃帶，什麼都沒有說明，靜靜地躺在那裡。○○○只是沉默的包紮、然後收起剩下的繃帶。\n　　這種暴力只是她生活中的其中一行文字而已。無限重複的偷竊、暴力、流血、頭暈已經變成習以為常的事情，如果多躲個幾天只會被打的更慘，幾個月前不過消失三天就被毆打到只能爬出去家門口，最後昏倒了整個晚上才醒來。\n　　總之，她最多只能消失一天一夜。\n　　將木箱放回家門口，她再度鑽進暗巷中決定開始今天的行程。\n　　-\n　　暗巷中，一雙粗曠有力的手摀住她的嘴巴，年僅七歲、時常挨餓的○○○完全無法反抗，腦袋上被重重擊打、她失去意識，就這樣被裝進麻布袋。\n　　……醒來之後她手腳被綁住、嘴巴上也綁了布條、防止她呼叫，在顛簸的卡車中她隱約看見還有其他幾個孩童。有的沒有表情、有的無聲掉淚隱隱啜泣，她反應過來自己是被綁架了，但心裡又覺得有些放鬆。\n　　——終於離開了那個王八蛋，但看起來接下來的目的地也不會讓自己太好過，只能走一步算一步了。\n　　腦袋還是有點痛，大概是傷口被重複擊打導致的，總之她現在什麼都不想管了，決定閉上眼睛睡覺、是死是活等到目的地就知道了，現在也不用過於早的打算未來的事情，而且要說逃跑？那肯定是跑不了的，還是聽天由命吧。\n　　昏昏沉沉的過了不知道幾個小時後才感覺到車子停了下來，出口被打開時並沒有預料中的亮光沉下來、看來已經是夜晚。幾個標榜大漢出現在門口要孩子們按照指令下車，腰間掛著隱隱閃爍光芒的槍械令人提心吊膽。\n　　長時間同姿勢讓她雙腳有些麻痺、走路些許顫抖，也不知道是突然起身導致的貧血、還是飢餓導致的，在走下卡車時○○○直接摔到地上，但可惜不會有人可憐她。其中一個男人抓著她的頭髮讓她起，接著另一個人也把她拉過去讓她跟上前面幾個孩童的隊伍，她只能踉蹌地跟上。\n　　「今天開始你們都得為我工作，才有一口飯可以吃，知道嗎？」兩層房內，粗壯的男人在前方坐著，翹著二郎腿目光不在他們身上，只是平板的說著活下去的規則：「這裡離你們原本住的城鎮很遠很遠、現在也快入冬了，所以你們也不用想著要逃回去。」　\n　　隱約可以聽見一些啜泣聲，但○○○完全沒有放在心上、想來男人也是。他繼續說：「對外，你們要說這裡是孤兒院、你們是因為人手不夠所以才幫忙工作的。」\n　　「要是有人和外面的人亂說話，尤其是警察，我絕對要你們好看。就像這樣！」\n　　一個大的玻璃酒瓶飛過他們頭頂撞在不遠處的牆上，碎片四處潑飛劃傷一些孩童的臉蛋和四肢，哭聲頓時爆發出來、玻璃碎片引爆了所有人的不安與害怕，哭聲充滿了房子——除了○○○。\n　　「閉嘴！」男人大聲一喊，聲音便停了下來。\n　　「那邊那個、妳好像沒哭是吧，叫什麼名字？」男人看向她，○○○有些不適的後退兩步，在男人耐心快要結束前報出一個名字：「我是……坎特蕾拉·史考特。」\n　　這是謊言，但反正她也不想說自己的名字，而且從出生起就沒有人叫過她名字，這名字有跟沒有一樣。\n　　然後這名字是、在那片又小又窄的墓地下沉睡的○○的名字。\n　　反正自己也不姓史考特就是了。\n　　「很好，史考特。妳之後就負責帶他們行動。」男人說，目光凌厲的盯著她：「但妳別想帶他們逃跑，要是逃跑的話、我不會處理妳。但是我會從其他人裡面挑出來一個在妳面前打斷他的腿，知道嗎？」\n　　坎特蕾拉點點頭，此時此刻她也只能點頭答應：「……好。」\n　　-\n　　新的人生日子總是過得很漫長。\n　　被誘拐的孩子們要做的事情總是一成不變，偷、拐、搶、騙、掃、打、罵、餓——在“孤兒院”中，只是變成了比較少挨餓而已。每天要是做事情稍微有點讓那些人不順心，那麼迎接的就是一頓毒打然後餓一整天，運氣不好就是兩天。\n　　坎特蕾拉早已習慣飢餓與毒打，對她來說現在的生活雖然沒有變得更好、但和過往相比也算是過得舒服很多。但身為這群孤兒的領頭人、年紀也最小的那群之一，她必須立即堅強起來、然後迅速成立有序的秩序確保生活安好、減少最大限度的毆打以及此所導致的埋怨。\n　　七歲的她幾乎沒有方法和比自己年紀還大、力氣也不知道多上幾倍的男孩鬥爭，可能挨兩拳她就得倒在地上流血了，她實在是不想花費太多力氣在這上面，所以最好的方法就是一開始就做好對的事情。\n　　意外的是，坎特蕾拉貌似有領導能力。在她的帶領下雖然孤兒們都從事偷拐搶騙這類型違法活動，但受到的挨打卻也是逐漸減少。後來逐漸失去理由打孩子們的大叔開始轉變為看不順眼就抓著小錯打人，在孩子們心中埋下不滿的種子。\n　　這天、坎特蕾拉再一次因為一個無關緊要的小錯誤遭到了凌遲，那又是一個慘無人道的夜晚。首先是腦袋泡在水裡三次、之後又是吊起來只讓她踮著腳遭受到毒打，她沒有哭、也習慣不掉淚，只是默默地等待虐待結束，大叔們對她失去了興趣後就這樣放著還吊著的她離去，黑暗中只剩下鮮血滴落在木地板上的聲音。\n　　啪嗒、啪嗒、啪嗒……\n　　她必須待到明天早上才會被解放，在那之前要是有誰想偷偷給她鬆綁、放她下來就會遭受到一樣的刑罰，這次比起說是看不順眼，更像是殺雞儆猴，訴說著誰要敢反抗、下場就是這樣。\n　　而最適合這件事情的無非就是身為領頭人的坎特蕾拉。\n　　坎特蕾菈今年十歲了。來到這個孤兒院也差不多兩年有餘，她的願望從未改變，想要堅強地活下去、想要逃脫出這個牢籠、想站在高處將這些該死的人渣踩在地上。\n　　但今天、稍稍有點失落了。\n　　總感覺這樣下去就永遠都到不了自己在夢中想了千百遍的頂點，靜默中只能感覺到傷口發疼、流出來的鮮血滴在地上的啪嗒聲，還有自己咬著牙絕對不掉淚的咽嗚聲。\n　　不能哭、總共從出生起就是這樣走過來的，所以說什麼都不能哭，要是哭出來了、外面的人渣就會笑出來了。\n　　——可是，偏偏現在這個時候，好想要變成別人離開這裡啊。\n　　變成別人的模樣，逃到誰也不知道的世界的角落裡活下去。\n　　剎那間、她的身體發出光芒、像是衝破黑暗的曙光一樣，從坎特蕾拉的身體中迸發出光芒然後捲起旋風、劈裡啪啦的聲音破壞掉了所有禁錮她的枷鎖。\n　　這是、超能力覺醒——？\n　　月光從因為超能力覺醒而被破壞的牆壁中照耀而下、而那些大叔因聽見騷動聲而步步逼近。\n　　「喂、發生了什麼？妳到底在搞什麼鬼？」推開鎖住的房門、他們只見整個房間剩下斷垣殘壁、還有有些呆愣站在房間中間的坎特蕾拉。\n　　「妳、妳這臭小鬼做了什麼！」他們拿出平時教訓小鬼頭的鐵棍、步步逼近嬌小的坎特蕾拉。\n　　「現在是你們該跑了！」坎特蕾拉大喊著，但她其實不太確定剛覺醒的超能力能不能讓她打贏兩個比她還大上兩個塊頭的男人，但既然拿到了力量、就絕對不能退縮。\n　　「只是個臭小鬼而已！還以為自己能從我們手掌心逃走是不是！」他們揮舞鐵棍、朝著少女揮下。\n　　【戰鬥】\n　　【戰鬥結束】\n　　「大叔，不是嘴巴很硬說要打死我嗎？」坎特蕾拉坐在趴著的男人身上，拿著木棍敲擊著他的臉：「怎麼現在看起來是你要被打死了啊？」\n　　「呃……啊……」男人痛苦的吐著血無法說話，坎特蕾拉也隨著失去興趣。\n　　「小的，不想死的跟我走！」使出渾身力氣打暈那些男人後，她隨手丟掉木棍，呼喚將所有孤兒聚集在一起。\n　　「我、我們能去哪？」一個七歲的小孩怯弱的問，他害怕之後只會餓的更慘。\n　　坎特蕾拉對他有印象、不如說她記得所有的孤兒的事情，面前這個小孩叫做布拉、曾經有個還不錯的家庭，但某天和家人出門時貪玩被拐到這裡，之後就失去了本來還算光鮮的外表、然後成為現在蓬頭垢面的模樣。\n　　「艾拉、去撬開最裡面那個衣櫃下面的木板，把裡面的箱子拿出來。」坎特蕾拉實在是很懶得解釋、大概是因為解釋跟不解釋對她來說差異不大，所以她選擇將答案擺在對自己有質疑的人面前。\n　　過了幾分鐘、艾拉氣喘吁吁的將箱子搬來,她將箱子打開然後把裡面的的東西全倒出來、最後一個不起一眼的玩具盒從裡面掉出來。坎特蕾拉撿起那個盒子後將其他的東西踢掉、打開了那個小小的箱子將裡面的東西拿出來——一大疊舊舊的鈔票，而且面額看起來就不小。\n　　孩子間出現了躁動，坎特蕾拉揮揮手讓他們安靜、清點過後在眾人面前揮舞著：「這邊有我偷偷存下來的兩千三百法郎，雖然也沒多少、但找一個房子住還行。我有辦法賺錢、但絕對不是什麼好辦法。你們想回家的我給你們錢、你們自己想辦法回去，如果沒打算回去的、跟我走。」\n　　布拉猶豫了幾秒，半晌後緩緩走出來看向她：「我……我要回家……。」\n　　「喔。」坎特蕾拉沒有多問、也懶得問，抽出幾張鈔票就塞進他手上，雖然他不知道他的家在哪，但隨便塞點錢當路費就差不多了。\n　　見坎特蕾拉真的會給錢後，其他孩子們也騷動起來、最後只剩家不到十個人留在原地，而她手上最後也只剩下一千多法郎。\n　　看了看他們，都是那些無父無母的，其中有一個高大的男孩、他叫做馬貝里斯，坎特蕾拉對他記憶最為深切、因為兩人來自同一個小鎮、雖然被誘拐前沒有說過話，但是兩人姑且算認識。\n　　「——妳不回去嗎？」他開口，眼神中帶著探求、還有些許的沉澱。\n　　坎特蕾拉歪頭：「回去哪裡？」\n　　「回去妳家。」他說：「我確實是孤兒、父母都因為次元獸死了、叔父叔母都不待見我，所以我不回去。但妳……妳不是有家嗎？你家就在穿過麵包店後巷、那條河溪的後面！我叔父跟我說過，妳爸爸是個很好的人——」\n　　坎特蕾拉走過去甩了他一巴掌，粗糙的手掌因為年幼所以發紅而疼痛、但她的眼神冷冽且沒有半點溫度：「我沒有爸媽。出生到現在都沒有。」\n　　「你說的那個人我根本不認識。」\n　　馬貝里斯愣住了，坎特蕾拉從來沒有露出過這個表情，但年長了兩歲的他也明白、這件事情不能說下去了。\n　　「你要滾、還是跟我走，趕快決定。」\n　　馬貝里斯捂著留下鮮紅巴掌印的臉沉默了半晌，隨後開口：「——我要跟妳走。」\n　　▷\n　　【劇目 2：欺騙、交易與鮮血】\n　　『我是蘇菲·尤米爾！我將要推翻這個腐爛的世界！』\n　　-\n　　「蘇菲，這個要放哪？」\n　　「嗯……隨便找個地方放就好了，現在先別吵我。」蘇菲——其實就是過去的坎特蕾拉，更名成『蘇菲·尤米爾』後帶著剩餘的孩子組織小型的詐騙集團、在她帶領下、這個組織在一年後略有成長，從普通的街邊詐騙升級成為了電話詐騙。\n　　在這個次元獸吃人、人也吃人的時代，黑道沒有銷聲匿跡反而變得更加地下化，因此擄人勒索的事情也不是沒有。但雞蛋不能放在一個籃子中、所以現在還有蘇菲正在做的新型態詐騙——戀愛詐騙。\n　　而且每次能獲得的金錢不少，但大概原因是因為她的模仿得當、還有自己的超能力——這是她後來發現的，可以將自己的臉部變幻成為他人的能力，她為此將頭髮染成粉色，雖然不知道是誰說的，聽說粉色頭髮更受歡迎，來進行通訊軟體詐騙。\n　　只是這個方法只是放長線釣大魚而已，耗時、還有脫身的可能。但還好現在對於網路的發展還不是很好，自己的位置很難暴露。\n　　「嘖、這個老頭要求怎麼這麼多。」手機螢幕上是一個特別有錢、年過七十的老頭子，雖然從他身上拿錢簡單、但這傢伙同時要求也很多，會一直請求要看照片。\n　　「貝薇尼亞，去準備衣服還有捲髮器。」她揮揮手讓身後的少女去準備：「要輕飄飄、很可愛的那種。」\n　　「啊、好的。」貝妮薇亞點點頭，立即轉身去準備。\n　　現在電信詐騙還有路邊詐騙的事情幾乎都交給其他人了、自己就主要負責戀愛詐騙了。\n　　「蘇菲、有個看起來是宗教團體的女人說要來見妳欸！」\n　　一個叫瑪蘿的女孩探頭進房間呼喚她，但蘇菲提不起興趣，連眼神都沒從手機一開只是揮揮手說：「我對宗教活動沒興趣，讓他們滾。」\n　　「連一面都不肯見讓我好傷心喔。」柔和的少女音從房門口出現，蘇菲警戒的盯著她、因為她剛才完全沒有聽見腳步聲，更沒有發現她的氣息。\n　　這個女人、很危險。\n　　淡金髮藍瞳的少女說她是火焰王之女，這次是有業務上的合作想要談談才過來的。\n　　「瑪蘿，去跟貝薇尼亞講讓她等我一下。」蘇菲坐起身，不合她年紀、稍微有些暴露的睡衣嶄露出來，她伸手拿起大衣隨意套上後坐在沙發上：「來，請開始妳的表演，笑得假惺惺小姐。」\n　　「大逆不道！妳怎麼可以這樣對公主說話——」\n　　「親愛的江臨道士。」火焰王之女抬手示意，臉上的笑容沒有退去:「我是來交朋友的、希望你不要太拘泥與我們的互動模式。」\n　　「我沒打算跟妳做朋友耶。」蘇菲翹著腿撐臉看著面前感覺和自己差不多大的少女，沒有人會莫名其妙奇妙跑來找詐騙集團交朋友，面前的傢伙到底打算做什麼？\n　　「先不要這麼說嘛、作為我們見面的禮物——」她伸手向那名叫做江臨的道士索取一個精緻的禮盒，蘇菲只看了一眼就明白——那是名牌珠寶首飾的盒子。少女看到她的眼神已經明白對方理解了這份禮物的貴重，將首飾盒推向她:「這個首飾、是我花了很久的時間，特別特別為了妳而挑的喔。一定非常……非常的適合妳。」\n　　「……」蘇菲沒有回應她，只是將首飾盒打開——亮眼的紅寶石只在瞬間就奪人眼目，那是個戒指、整體沒有特別亮眼的設計，但是幾個紅寶石卻襯托出不俗的氛圍。\n　　「——我不喜歡拐彎抹角，有什麼事情妳就直接說吧。」她將盒子闔上、微微往回推表示願意聽少女說兩句：「我不喜歡交朋友、所以妳也不要想從我身上討到什麼好處。」\n　　「我是真的很想和蘇菲小姐當朋友的呢——」淡金髮色的少女露出落寞的神色，但隨後又立即露出淺淺的笑容:「但這也沒關係，我們只要一步一步變得親近就可以了。」\n　　「我沒有別的要求、只希望若蘇菲小姐你們遇到難以處理的棘手問題可以像我們尋求幫助、建立合作關係。」\n　　「這樣對我跟妳有什麼好處？」蘇菲問，她可不相信天上掉餡餅、免費的午餐。這個世界是弱肉強食、忽視弱者的，但凡有人想給一點甜頭、那後面要付出的代價絕對難以估算。\n　　「我可以獲得一個接近同齡的玩伴……妳也可以獲得一個強力的靠山……這樣不是很好嗎？」少女的表情非常柔和，看不出來半點能夠懷疑的地方，但即使如此蘇菲還是覺得她的笑容虛假、做作感多到令人頭皮發麻。\n　　「——算了，我接受。」\n　　-\n　　之後的兩年間、蘇菲與少女——也就是火焰王之女組成了微妙的合作關係、雖然火焰王之女總喜歡送給蘇菲一些首飾當禮物，但蘇菲對她的想法沒有改變、始終覺得她是人傻錢多有虛假的很可疑的女人。\n　　但火焰王之女貌似單方面覺得兩人正在往朋友的方向前進。\n　　「親愛的，妳又來找我了！」火焰王之女非常高興的從裡面的房間中出來迎接她，手上甚至還抱著她自己說那叫做＂蘇菲與火焰王之女相親相愛友情玩偶＂的雙人連體娃娃，蘇菲看著她、雖然早已習慣了，但還是覺得有點令人發寒。\n　　「我不是來找妳聊天的。」她巧妙的躲過對方的擁抱，靠在門框上：「最近遇到麻煩了。」\n　　「嗯，我知道喔。畢竟我一——直關注著妳的事情，所以在妳來之前我就開始準備了。」雖然沒有擁抱到有點難過，但是火焰王之女並未此消沉而是玩弄著玩偶的手，帶著微笑淡淡地說:「這不是什麼太大的問題，只要妳讓我去做，我就會做喔。」\n　　她當然知道如果讓火焰王之女擺平的話事情簡單又暴力，但這樣就代表自己欠下巨大的人情債、代價恐怕也難以負擔，不宜保身。\n　　而且這女的疑點還是太多了，莫名其妙的找上來、莫名其妙的示好、莫名其妙的倒貼，說不定背後有什麼陰謀，還是和她少交易最好。\n　　「幫我找新的據點。」蘇菲直接忽略了她聽起來有些危險的要求，只說了自己他要她去做的事情。對方沒有生氣，只是揮揮手讓身後的道士去辦事情，然後語氣輕柔的開口問：「為什麼呢？直接消滅掉他們不就好了？反正只是陰溝裡亂竄的臭老鼠，這也算是一種——『為民除害』吧。」\n　　「如果妳是要挖苦我的話，我要走了。」\n　　蘇菲起身準備走，火焰王之女伸手拉住她的手腕，露出歉意的苦笑：「親愛的，妳在我心中絕對不是什麼臭老鼠。妳是我最重要的朋友，妳相信我的、對吧？」\n　　「那得看價錢了。」蘇菲收回手環抱著瞇眼看她，自己實在是不想久待這裡、還要跟面前這個笑得燦爛耀眼又令人發寒的傢伙講太多話。\n　　「我知道親愛的最喜歡一手交錢一手交貨了，所以我都是用最優惠的方式給妳的喔。」她一邊說著一邊繞到書桌旁摸出一個外表精美的信封交給蘇菲：「據點我可以在一個星期內整理好給妳，我有很多不錯的選擇。而作為支付的代價、就麻煩妳幫我搞定這個人吧。」\n　　蘇菲將信封打開抽出裡面的那張紙，位置不遠但問題是目標地點在隔壁的德國、而且位置還相當刁鑽不是可以輕易進去的地方。\n　　「這我要怎麼進去？」她看著紙上的金髮女醫生，下面寫著某古堡地下實驗室。這種地方通常戒備森嚴，就算成功進去了、如果被發現大概不是成為實驗體就是得死在裡面。\n　　「沒問題的，我已經安排好了妳的身分，同時裡面也會有教徒接應妳的。」火焰王之女相當輕鬆的笑了笑，彷彿像是讓她進去一家咖啡廳一樣：「我希望親愛的可以幫我調查一下她現在做的實驗內容，如果能連同實驗體的資料都拿到手更好。當然，最後拿到資料的多寡都絕對不影響我支付給妳的報酬。」\n　　「哼——」蘇菲抓抓頭沒有耐心的回應，想了半晌後將信封塞進口袋裡面：「什麼時候？」\n　　「後天。」\n　　「行吧，我跟那些傢伙說一下。」擺擺手，蘇菲就這樣走了。\n　　「當然是世界是最好的據點喔，例如、我的身邊……」\n　　「江臨道士。」\n　　「是的，教主。」\n　　「該清除掉她身邊的老鼠了。」\n　　「是的，一切如您所願。」\n　　－\n　　「瑪莉亞！妳到底在搞什麼鬼！」大叔的怒吼貫穿了整個實驗長廊，但沒有任何人因此駐足，就像是習慣了這樣的怒吼一樣。\n　　「是、非常抱歉……這次的數值沒有把控好，才導致實驗體出現超能力失衡……」小小的女生傳出來，蘇菲……現在化名為黛蘿雅的基層科研人員趁四下無人沒有人願意在這附近聽這頓罵的時候貼在一牆之後偷聽。\n　　前幾天剛來的時候她偷偷往裡面看了一眼，只看見裡面有個一邊尖叫哭喊、頭髮上白下紅部分又呈現藍色的少女滿臉血抓的實驗室的觀察玻璃牆，留下狂亂的血跡、令人看一眼都反胃，她就再也不敢往裡面看了。\n　　不過來了幾天她也大概搞懂實驗內容了，雖然因為那個實驗體總是被關在裡面所以導致無法接觸她、也無法得知身分，但她知道這個實驗室在做著足以顛覆世界的瘋狂舉動，而明顯總負責人——那個叫米歇爾的就沒有打算讓實驗體擁有自我意識、而是打算讓她成為一個可以被操控的人偶。\n　　真的是太瘋狂了。\n　　果然這個世界上的大人都齷齪又骯髒，沒有一個可以相信的。\n　　資料已經收集差不多了，過兩天就走吧，也差不多待了一個星期多，按照火焰王之女辦事的速度跟過往遷居的紀錄其他人應該已經抵達新的據點了。\n　　但是，事情的發展超過了想像。\n　　＂轟隆！＂的一聲，火光從身後不遠的實驗室爆發而出，紅色的火煙捲著熱氣與紅焰燒著黛蘿雅的背，她被爆炸的熱氣噴飛往前滾的好幾圈，接著灼熱感從後背襲來、但她沒有時間去思考發生了什麼——她只知道，現在要跑！\n　　（進入戰鬥）\n　　【BOSS】\n　　「好痛、我不要、我不要了——！」繞了幾個地方、她飛快地往地面上的出口衝去，但在路上遇見了不速之客—–那個實驗體。剛才爆炸發生的方向就是她所在的實驗室，也就是她即是引發爆炸的人。\n　　現在面前的實驗體長得非常可怕，宛如枯枝的肢體、全身幾乎看不到一塊白色血淋淋的皮膚、染成暗紅色的實驗服也在滴血，她的髮色非常不穩定的在淡金色和黑紅色間以波浪形搖擺著，原因不明、但很可怕。\n　　長長的瀏海只露出一隻不斷湧出鮮血、虹瞳破裂的眼睛，簡直是鬼片裡面爬出來的、不，比那個還可怕。\n　　而且重點是，她失去了理智，所以現在黛蘿雅與她難免一戰。\n　　「好痛、好痛、好痛！」\n　　「啊啊……為什麼、為什麼是我……！」\n　　「喂、妳冷靜點……」\n　　「妳也是要來抓我的嗎？妳要利用我嗎？妳也要欺負我嗎？」\n　　「等一下……！」\n　　「我要摧毀這一切、爆炸、燒毀、把一切抹去……！」\n　　（戰鬥結束）\n　　－\n　　「哎呀、親愛的妳回來了。」看著服裝變的破破爛爛的蘇菲，火焰王之女露出心疼的表情，遞上一塊毛巾︰「看來妳那邊狀況也不好。」\n　　「差點命就要賠在那了，我感覺這次的報酬不對等。」用毛巾將身體擦一遍後，隨手將那塊髒毛巾丟進垃圾桶裡，調整急促的呼吸後抬頭問：「我那些傢伙們呢？」\n　　「……」火焰王之女露出苦笑。\n　　－\n　　＂啪！＂蘇菲紅著眼、死咬著唇，憤怒的瞪著火焰王之女。她的手火辣的發疼，而原因就出現在對方臉頰上的紅印。\n　　「妳到底是怎麼辦事情的！」她怒吼，火焰王之女沒有反駁，甚至阻擋了憤怒的江臨發飆。只是露出了歉意的苦笑，委屈、悲傷、無奈都寫在她的臉上。\n　　「我也沒想到她們會趁親……蘇菲小姐不在的時候直接突圍。」火焰王之女平淡的回答，聲音帶著哀傷：「早知道我就應該要在蘇菲小姐不在的時候好好保護他們……畢竟他們都是蘇菲小姐的伙伴，我應該更加注意……」\n　　「少說那些冠冕堂皇的東西。」蘇菲揪著她的衣領，語氣狠戾：「現在是妳欠我了，×子。」\n　　「是的……我明白的……」垂下眼簾、火焰王之女到眼角濕潤起來，隨後抬起眼眸、目光深處閃過一抹瘋狂：「這都是我的錯，責無旁貸。眼下蘇菲小姐沒有其它地方可以去的話，能否考慮一下、來到我的身邊，即使不是教徒也無所謂……把教團當作妳的避風港呢？」\n　　「哈，這就是妳的真面目嗎？」蘇菲啞笑，表情猙獰而嘲諷：「妳根本沒有把那些傢伙放在眼裡，所以才沒有出手幫忙的吧？雖然是一群連公民身份都沒有、死了也不足惜的王八蛋們。」\n　　「不是的，這只是我要單純的失誤、是我太過關注蘇菲小姐妳了，從而沒有派人關注到那邊—–」\n　　「我不想聽妳辯解。」鬆了手，蘇菲將火焰王之女推倒在沙發上，後退了兩步與她拉開無形的界線：「那些傢伙在哪？我要讓他們知道碰了我的人是什麼下場。」\n　　「等等、蘇菲小姐，妳的復仇就讓我來幫你實現最為贖罪—–」\n　　「這是我的復仇。」她再度瞪了淡金髮的少女一眼：「不是我去做就沒有意義了。」\n　　「蘇菲小姐—–」愣了半晌，火焰王之女勾出淡淡的笑容：「妳真的是很有趣的人呢。」\n　　「那麼、我會期待妳的活躍的。」\n　　那麼就拿去吧、『火焰王的契約』。\n　　-\n　　【幕間：未完的劇本】\n　　隨著年少火焰王之女的笑容淡去，你感覺自己退出了那個壓抑的教團，然後回過神來、發現自己已經站在圖書館裡的一隅。\n　　這樣就是全部了嗎？但總感覺還有什麼沒有說出來就像是謎底沒有解開一樣—–帶著這樣的鬱悶感準備尋找諾亞，卻發現諾亞慌張的撞到妳，臉色像蘋果一樣通紅，用書本將自己的臉遮掩起來。\n　　「特、特工，對不起！」她大聲的道歉，雖然以她平時的音量來說並沒有到特別大聲，但她還是非常不好意思。\n　　你詢問她：「這就是全部了嗎？」\n　　她搖搖頭，將書本放到你的         "yan": "　　【任務：晉見縱慾王之女】\n　　咕嚕咕溜……留聲機中傳來水中氣泡的翻滾聲，將特工的意識帶到稍微有些遠的過去。\n　　「你……是新來的家族嗎？」海藍色宮殿台階上走下一名粉髮少女，細長的蛇目玩味似的打量著特工的方向，目光卻沒有交接上而是看著旁邊的人影。\n　　「這位小姐，妳的『母親』……她在在這裡嗎？」特工轉向聲音來源——那是滿面愁容的D伯爵。他的語氣中帶著不滿和悲傷，更多的是憤怒。\n　　「正想說我不喜歡你這種打扮比我還顯眼的傢伙、在想要不要直接處決掉算了。看來你是不速之客呢？」少女宛如小大人般高傲的抬起頭顱、目光毫無畏懼的直視男人：「這裡是我的宮殿，母親大人不在這裡，無論你是哪方的高貴之人都請回吧。」\n　　「這還真是困擾了……」D伯爵皺起眉，握著拐杖的手收緊:「如果可以我還是想好好說話的，畢竟破壞美麗的佈景不是我喜歡做的事情。」\n　　「嗯……可是我不喜歡你耶？」冰冷的紫瞳稍稍瞇起，亮紫的瞳孔稍稍變得黯淡，嘴角向下外滿是不悅，抬起手揮舞：「我不是說了嗎？母親大人不在這裡。哪裡來的就哪裡去吧。」\n　　「我不能就這樣回去。妳的『母親』觸碰了我絕不能原諒的界線——而我就是來這裡警告她，並阻止未來可能發生的悲劇。」D伯爵聲音低沉，透漏出自身無法輕易放過的意圖，但對面的少女僅僅是打了一個哈欠露出無聊的目光，沒有提起任何興趣，就像是對方說了一個無聊的笑話一樣。\n　　「那就請你自己去找母親大人的宮殿吧，這次就不處罰你無禮的行為了。」少女歪著頭，已經對面前的男人失去耐心，抬步準備回到宮殿之內。\n　　「縱慾王之女啊！我是來帶妳走的。」D伯爵抬起權杖敲擊地板，海藍色宮殿的地板瞬間爬滿裂痕、從裂痕中冒出泡泡、飄至空中後隨著破裂，像是從夢中甦醒般裂痕住進爬滿宮殿建築，像是侵蝕的藤蔓般、沒有用多少時間就讓整個宮殿破敗不堪。\n　　「我的、我的宮殿！」縱慾王之女氣急敗壞，亮麗的面容露出憤怒及些許扭曲，轉頭瞪著D伯爵大叫：「你到底是誰！居然敢隨意破壞我的宮殿，你要怎麼賠償我？」\n　　「縱慾王之女，妳只是被所謂的『母親』矇騙了，妳的『母親』——阿斯莫德只是看上妳能夠成為『容器』的特質而已。」D伯爵宏聲提醒，聲音在環繞破敗的宮殿中，低沉而響亮：「她洗腦妳、是為了將妳作為降臨在這個次元的容器罷了！請妳清醒一點，不要再繼續接受洗禮了！」\n　　「你這傢伙到底懂我什麼東西啊！」縱慾王之女憤怒的大叫，本來海洋藍的宮殿逐漸變成劇毒般的洋紅色、同時可以見到她的大腿上顯現的魚群紋路逐漸增加，明顯正在使用“洗禮”的力量。\n　　「明明就不知道我的事情、張著一張嘴巴就在那邊嘰嘰喳喳的決定，把自己說的很偉大一樣！」地面引起轟鳴，海水開始灌入宮殿中，就像少女將憤怒化為浪潮襲來般：「我只是想要家人而已、就算最後要被次元獸吃掉，我也曾被愛過，我到底哪裡有錯？」\n　　「但妳就算不這麼做，未來也能遇到和家人一樣的人們，以最純粹的心接納妳，而不是未來悲慘的成為次元獸軍團長降臨的器皿。」D伯爵的語氣中帶著深深的悲哀，再來轉變為憤慨、和堅毅：「雖然我不喜歡修改劇本……但阿斯莫德做了不該做的事情，我無法原諒。想見面只是想警告她而已，直接把人帶走也是一樣的。」\n　　「就算結果很淒慘，那也是我的選擇！」縱慾王之女的身後捲起巨大浪潮、足足有三層樓高，像是映照主人的情緒般洋紅色的海水翻滾著宛如巨獸。\n　　「給我滾！去死吧！」\n　　(進入戰鬥)\n　　(結束戰鬥)\n　　【任務：母親】\n　　「放棄吧，縱慾王之女。雖然我現在在這裡的只是幻影一軀、但妳的力量仍舊不及我十分之一。」D伯爵毫髮無傷地的站在原地，反而因憤怒發起攻擊的縱慾王之女遍體麟傷，魚群狀的紋路也隨之從腿上蔓延至脖子。\n　　「我……我還可以……」她強硬的撐著身子，卻顯得搖搖欲墜，抬起手想再次發動攻擊。\n　　「——住手吧，我的女兒。」充滿威嚴的聲音從宮殿上方響起，縱慾王阿斯莫德出現在空中，降臨於縱慾王之女的宮殿中。\n　　「……母親大人！」縱慾王之女剎那間變得有些畏縮，端正身子對她行禮、宮殿的顏色也因憤怒轉變為畏懼而從洋紅色退為當初的海藍、憤怒的洪水也回歸於平靜留下殘破的牆體與內宮。\n　　「縱慾王，我就知道不這樣妳是不會出現的。」D伯爵露出意味不明的微笑，隨後便厲聲質問：「妳為何要對人類出手？」\n　　「我只是覺得有些吵鬧才過來看看的，結果沒想到偉大的夢幻君主居然像是小孩子胡鬧般破壞我女兒所居住的別宮。」阿斯莫德皺起眉頭，語氣中透著一絲不滿：「我不記得有邀請你來，請回吧。」\n　　「我不是來和妳商量的。」D伯爵不滿地說，同時轉頭向一旁的縱慾王之女：「妳企圖透過洗禮並飼養一名超能力者、待時機成熟後透過降臨的形式到達人類的次元……這已經逾越了我能接受的底線。雖然之前還在觀察所以沒有出手管理……但我已經觀測到了在不遠的將來名為『縱慾王之女』的存在將會在人類的世界造成威脅、並且組織降臨儀式讓縱慾王現身。」\n　　越講觀測到的未來說出D伯爵的音調就越發低沉沙啞，停留了半晌後才發出聲音：「今天……就是最後的期限，我要講縱慾王之女帶走，並封印她的記憶。」\n　　阿斯莫德沒有說話，只是謹慎的盯著D伯爵試圖判斷這些話的真假。但遺憾帶著面具的D伯爵沒有在神色上透露出任何情報，讓她些許陷入懷疑。\n　　「我不會讓妳帶走她的，如你所說我透過洗禮的方式豢養她就是為了降臨在人間。」阿斯莫德選擇攤牌，因為她知道任何想隱瞞的一切在夢幻君主面前幾乎無所遁形——而且如果剛剛說的話是真的未來的話、她就更加不能錯過這個機會了。\n　　「我不是來和妳交涉的，這是警告、是通知書。」D伯爵聲音低沉而莊重，像是宣布著判刑般：「今天再不帶走縱慾王之女，位於人類次元的肉身就會就此死亡——屆時身為降臨容器的她只能作為次元獸、藉由『門』重生在人類次元，而我不能讓這種事情發生。」\n　　「我本來不想管的，但我同時也觀測到了——她的另一個人生，那是作為一名值得作為我的客人邀請到劇場的偉大存在。我不能在這裡失去未來的客人。」D伯爵再度再度敲響他的權杖:「不管如何，我今天都要帶走縱慾王之女。」\n　　「你還是一如既往的傲慢，偉大的夢幻君主。」阿斯莫德發動能力，水珠一個一個出現在空中、最後隨著她的命令朝D伯爵射去。\n　　(進行戰鬥)\n　　(戰鬥結束)\n　　【任務：縱慾的真相】\n　　「看來你的幻影力量並不強呢？」阿斯莫德居高臨下的看著D伯爵的幻影，逐漸像是殘影般散去、但男人並沒有露出負面或是不滿的神色。\n　　「因為我的目的已經達到了。」D伯爵笑著說，阿斯莫德連忙尋找周遭才發現縱慾王之女已經消失了。\n　　「你……！」\n　　「我說過了，我今天就是來帶她走的。」D伯爵說著，一字一句卻揭開了阿斯莫德內心想隱藏的秘密：「我剛剛說的話有一半是真的，如果繼續下去她只會成為妳降臨的祭品、但時間並沒有那麼快……我想知道的是，縱慾王、妳為何動了真心？」\n　　「把她送回人類次元的時間應該要更早、才不會危急她沉睡本體的安危，而妳卻給她公主的權限一直溺愛到現在……這不是次元獸會有的行為。」\n　　「……」阿斯莫德沉默不語，似乎不想回答這個問題。\n　　「……算了，我想妳也不想告訴我。」D伯爵俐落的決定不再詢問、踏上了回到劇場的道路，離去前又向阿斯莫德說了一句：「當時因為妳動了心、所以未來的軌跡就改變了。」\n　　(劇場中)\n　　「放開我！放開我！妳們讓我回去母親大人的身邊！」縱慾王之女掙扎著，卻不料被瑪格娜以及杜格娜架住、不讓離開。\n　　她大吵大鬧著，漲紅著臉揮舞四肢、使勁力氣卻沒能夠掙脫，像是被吊在架子上的小魚一樣。\n　　「雙胞胎，情況還好嗎？」D伯爵的聲音從留聲機中傳來，聲音平穩如常。\n　　『伯爵大人，你回來了！』雙胞胎異口同聲的看向劇場舞台上的留聲機，那是她們與主人溝通的方式。杜格娜率先發難，抱怨縱慾王之女的無理：「伯爵大人請聽我說，縱慾王之女蠻橫無理、我和姊姊試圖和她溝通讓她冷靜下來，結果她竟然嘲笑我們造型老土像是九零年代流行的破爛玩偶……」\n　　「杜格娜。」瑪格娜發出警告對妹妹搖搖頭示意讓她不要再說下去，接著對D伯爵報告：「雖然妹妹說的事情確實發生過，也讓我感到氣憤、但目前最重要的事情是她完全聽不進去我們說話，所以伯爵交代我們要好好和縱慾王之女的事情沒能夠完成，對不起伯爵大人。」\n　　「沒關係的，妳們已經盡力了，放開她吧讓我來和她談談。」D伯爵說，雙胞胎便默契的鬆手任憑縱慾王之女摔倒在地上，連連喊疼。\n　　「這到底是什麼鬼地方？快放我回家，你們這些無禮的傢伙！」縱慾王之女摸摸疼痛的屁股後站起身拍掉裙襬上的灰塵：「母親大人一定很快就會來迎接我的，到時候不管你們是什麼傢伙都——」\n　　「妳的『母親』不會來迎接妳的。」留聲機中傳出D伯爵斬釘截鐵的聲音，像是陳述一場電影的觀後感:「剛剛我已經嚴正的警告她，所以她不會敢輕舉妄動。」\n　　「什……！」聽見縱慾王放棄自己的消息，縱慾王之女的氣焰消散，但傲慢的態度卻沒有完全消失，只是咬著唇生悶氣。\n　　「縱慾王之女，雖然我能夠理解妳想要家人的心情，但使用洗腦的方式得到的家人是算不上家人的。」D伯爵輕聲說道：「那只是一種掌控、是一種對妳意志的剝奪，在我來看是非常不尊重妳個人的做法，也是我不能認同的戲劇。」\n　　「剛剛踏入我的宮殿的時候你也是這樣說的，但是你又有什麼權利對我說教？」縱慾王之女爬上舞台中央，對著留聲機大叫，接著抬手敲打：「少裝的像是對我好了！你以為我是笨蛋嗎？我會真的什麼都不知道嗎？自從我發現我和其他家人都不一樣的時候我早就了解我根本和他們不是同類了！如果我和他們一樣的話，母親大人就會讓我和他們一樣去撕裂敵人、而不是鎖在別宮中像是寵物一樣豢養著……」\n　　她像是洩憤般，拳頭敲擊留聲機的力道越來越大，雙胞胎本想上前阻止卻被D伯爵阻止，縱慾王之女眼冒淚光，過往無從說起委屈越說越氣:「我怎麼會不知道母親大人是不是我的母親？但是我想要家人錯了嗎？你知道我怎麼長大的嗎？我是個孤兒、只能在暗巷裡摸爬滾打，有時候從黑暗處向大道看去的時候我好忌妒啊！為什麼我只能在黑暗中奔跑呢？為什麼有父母的傢伙都笑得那麼開心呢？沒有父母是我的錯嗎？你說啊！」\n　　「……所以當我有母親大人關愛的時候，我感覺一切都不重要了，反正根本沒有人在乎我。孤兒而已，就算死在暗巷中也只是數百人中的一個，只會哀嘆著好可憐啊然後被草草埋在一個土地下而已。」\n　　敲著留聲機的拳頭逐漸被淚水的雨點覆蓋，少女抽泣著沒有了早前的傲慢：「但是在這裡的話我就算死了，也好歹能被感謝一聲，你懂嗎？」\n　　【任務：賭局】\n　　「……我很抱歉。」D伯爵哀愁的聲音從留聲機中傳來，充滿了無限的悲傷:「我很遺憾剝奪了妳重要的事物，但即使如此我也有要把妳帶走的原因。」\n　　「如果我說，即使不用被洗腦妳也能夠遇到宛如家人般的夥伴呢？」D伯爵的聲音變得很輕柔，像是哼唱搖籃曲一樣：「雖然未來艱辛不斷，但能遇到與妳真誠相待、對妳毫不畏懼，只有妳才能擁有的人生搭檔……即使這樣妳也不願意回到現實嗎？」\n　　「……你的根據在哪裡？」抹掉眼淚，少女有些生氣的瞪著留聲機裡面的黑洞，像是直直看著D伯爵的眼睛一樣。\n　　「嗯……這算是我的能力吧？」他說:「我不能告訴妳太多，但我把妳帶出來到原因是因為我看到了妳的『無限可能』，而這個『可能性』是以妳為紐帶而編織的故事，要是少了妳、這故事就沒有任何編寫下去的必要……因為這是妳們齊聚才能編織的故事。」\n　　「……」她沒有再回應，眼神閃著光芒像是考慮著什麼，但神色卻已經猶豫。\n　　「我們來打賭吧！」D伯爵說：「事實上，妳無法帶走在這個劇場內的一切，包括記憶。所以妳不會記得任何有關這個劇場的記憶，直到妳再度拜訪這裡為止。」\n　　「我和妳賭，妳給我一樣物品，我將妳和妳的母親的記憶、和我的賭約封印在這個物品中，直到妳下一次來到劇場。若妳來到劇場時仍舊覺得我觀測到的妳的故事一點意義都沒有，我就將記憶歸還給妳、讓你去做妳任何想做的事情。反之，我希望妳可以幫我一件事。」\n　　她思考了起來，這個賭約究竟有沒有意義——亦或者是，這代表是否會再受傷一次？雖然她內心對於新家人般的渴望相當強烈，但也不免懷疑其中圈套：「……我要幫你什麼？」\n　　「這個嘛……故事總是要留點懸念好，但我可以向妳保證絕對不會是壞事。」\n　　「我還是不服氣。」她說，她知道自己現在已經沒有選擇了，但她還不肯放棄幾乎已經飄渺的現實：「我不知道要怎麼做才好，因為我覺得所有承諾都是謊言。」\n　　「伯爵大人才不會說謊！」杜格娜很生氣，身為伯爵的僕人她無法見到有人說伯爵壞話。\n　　「杜格娜！」瑪格娜拉住妹妹，讓她不要打擾兩人的談話。\n　　「我不知道、我真的不知道。」少女握緊雙拳，稍稍感覺到自己還剩下一點力量，她轉頭看向雙胞胎：「喂，妳們來陪我打一場。」\n　　「輸了的話我就答應你們。」\n　　(進行戰鬥)\n　　(戰鬥結束)\n　　【任務：少女名為飛鳥】\n　　「呼……哈啊……呼……！」少女大口的喘氣，抬起手確定自己已經沒有任何力量後開口承認：「——是我輸了，我答應你。」\n　　「明明知道自己已經沒有多少力量了，為何還要這麼魯莽……」杜格娜將少女扶起，有些不解。\n　　「只是最後的掙扎罷了，就像是出氣一樣。」\n　　站穩後的少女向瑪格娜借來剪刀，俐落的將一縷短髮剪下交給她們：「我從來沒有擁有過什麼東西，只能剪頭髮給你們了。」\n　　「這也是沒問題的。」D伯爵的聲音從留聲機傳出，是高揚略帶愉悅的語氣：「這樣賭局就成立了，親愛的小姐，希望妳喜歡我為妳描寫的一小段故事。」\n　　「哼，真的會這樣嗎？」她坐上馬車，最後看了一眼雙胞胎與留聲機，最後朝著外面向三人說：「叫我燕！我可是有名字的！」\n　　雖然沒有聽到回應，但是她相信三個人應該會記住吧。\n　　-\n　　【任務：賭局的結果】\n　　「是我輸了呢大叔。」姜燕露出雪白牙齒、笑得猖狂且不斷拍打著留聲機，像是拍打一個朋友的背一樣。\n　　「姜、姜燕小姐……！」雙胞胎緊張的想去拉開姜燕，但沒想到長大後的姜燕力氣誇張的大，兩人拉扯都無動於衷。\n　　「沒事的，這部留聲機沒有那麼容易壞……應該沒有。」D伯爵心情愉悅，像是看了一齣好戲般的餘韻，沒有阻止姜燕大力拍打他的留聲機。\n　　「所以說那個賭約是什麼啊？」突然想到了賭約，姜燕問起：「當時說賭局揭開就告訴我，你要我幫什麼？」\n　　「哈哈，那件事已經為我辦到了。」D伯爵說，但姜燕不解歪著頭。\n　　「什麼事情啊？」\n　　「我本來想要在妳來的時候和妳說『賭約就是妳要比現在活的更開心、讓我看到做好的劇目』，但是沒想到妳的表現太好了，遠超出我的想像，所以妳已經完成了。」\n　　「這樣啊。」姜燕沒有多想，不如說少了這份記憶的她變得非常單純且樂天，雖然沒有當時那麼精明，但可能正是因為缺少了這份智慧、所以她比任何人都還要樂觀開朗。\n　　但半晌後她又歪頭詢問：「那這個記憶我可以不要了嗎？」\n　　「妳不想要拿回去嗎？」D伯爵有些詫異。\n　　「嗯，對啊，因為遇到了狡兔的大家、所以這個記憶我不想要了。」從姜燕臉上看不出來任何留念的情緒，這份舊日的記憶像是她無意間留下的兒時玩具一樣。\n　　「那我推薦妳可以把記憶送給——」\n　　【任務：最後的縱慾王之女】\n　　「咦？不要還給妳？」諾亞半張的眼睛微微張開，過長的袖子掩蓋著她的驚訝神色：「為什麼呢？」\n　　「嗯……我也不知道該怎麼說明，反正妳實際看看應該就知道了！」對姜燕來說說明是一件極其動腦的事情，而她本來就不喜歡動腦。她將記憶化為的書本推給諾亞：「反正這記憶我不要了，也不要還給我！諾亞妳就隨便收著吧！弄丟了也沒關係！」\n　　說完她就頭也快步離開了，走出圖書館前她自言自語著：「要是留在我身上的話……我應該就不能好好面對她們了吧！因為不想要這樣，所以丟掉了是最好的！」\n　　「好奇怪的特工……」雖然奇怪的特工不缺姜燕一樣，但她還是翻閱起姜燕丟棄的記憶:「這……這個是！」",

        "yan": "　　「吶吶瑪莉亞，妳喜歡我嗎？」姜燕抱著瑪莉亞的肩膀，輕輕搖晃著問。\n　　「喜歡啊。」瑪莉亞沒有發現姜燕的異常，並沒有將視線轉向她，一邊翻著書頁一邊用著一如既往、平淡而肯定的聲音回覆道。\n　　「全世界最最最愛我的那種嗎？」姜燕沒有鬆手而是將頭壓在瑪莉亞頭上，又問了一遍。瑪莉亞感受到腦袋上的壓力，終於停下動作再度回答她：「當然了，世界上最最最喜歡妳的那種。妳到底怎麼了突然這麼問？」\n　　姜燕並不是會主動問這個問題的類型，因為姜燕總是無條件的相信她和戴莉，而且只要一個點頭就會死心塌地的跟在身後的死忠個性，所以這樣問的姜燕相當反常。\n　　姜燕沒有回答瑪莉亞，而是鬆開了手走向一旁滑手機的戴莉，一屁股坐在她旁邊緊貼著她的手臂、整個人像是無尾熊一樣，開口又問了一樣的問題：「戴莉，妳喜歡我嗎？」\n　　「什麼？」戴莉的手明顯顫抖了一下，隨後發出一如既往慌張又藏著害羞，用力抽掉被抓住的手後紅著臉回應：：「我、我、我愛你去死啦！」\n　　這次姜燕就沒有問第二次了，只是站起來渾渾噩噩的走向房間，輕輕地關門、「喀噠」一聲躲在了房間裡。\n　　「她今天是有什麼毛病？」戴莉有些莫名其妙，今天這傢伙怎麼這麼魂不守舍的？\n　　「我也不知道。」瑪莉亞看著關起的房門，有些擔心。因為困惑和擔心，兩人靠近房門口瑪莉亞輕輕敲門：「姜燕？怎麼了嗎？妳身體不舒服嗎？」\n　　房內沒有人回應，就像姜燕根本不在房間裡面一樣。\n　　戴莉皺著眉伸手去轉門把手——也沒鎖。\n　　她直接走進去伸手掀翻棉被，只見抱著戴莉和瑪莉亞兩人玩偶的姜燕掉淚，整個人委屈到不行像是被責罵的幼童般，躲在窩裡偷偷哭。\n　　「戴莉……！」瑪莉亞輕扯戴莉的衣角，搖搖頭要她別太誇張的對待姜燕。\n　　看著瑪莉亞擔心的目光，她只能微微點頭表示同意——其實她本來就沒生氣，怎麼大家都常常覺得自己一直發火？她只是常常覺得莫名其妙而已，那種話不說清楚的感覺讓她不適所以語氣才有點差而已。\n　　「喂，妳先別哭。」戴莉伸手把姜燕拉起來，坐在床邊問：「妳今天是怎樣了？」\n　　「戴莉……」妳這個問法一點都不好。瑪莉亞有些無言，但她也順勢坐在姜燕另一邊，拿出手帕擦拭姜燕掉的眼淚:「不管發生了什麼都要跟我們說，不是妳自己提的嗎？要是我和戴莉哪裡讓妳難過了，妳要跟我們說啊。」\n　　姜燕紅著眼、細瞳委屈左右來回悄悄瞄著兩人的身體。戴莉雖然嘴巴上還是那樣聽起來很煩她的樣子，但手在她背後輕輕拍個不停、比起嘴巴更習慣使用身體表達；瑪莉亞則擔心的看著她語氣輕柔像是哄小孩子、溫柔的用手帕擦拭掉她的眼淚。\n　　「我、我夢到戴莉跟瑪莉亞妳們生氣的跟我說『照顧姜燕妳真的太累了，妳太麻煩了、再也不想理妳了』然後轉身離開就再也不理我了……我道歉也沒用，妳們說不喜歡我了最討厭我了就走掉了……」姜燕委屈的抱緊懷中的玩偶，將臉埋進雙腿中發出悶悶的聲音:「剛剛問妳們的時候感覺妳們好像對我也有點冷淡了所以我想說夢裡面說的該不會是真的吧？妳們真的開始討厭我了……越想越難過就躲起來了。」\n　　「雖然照顧姜燕妳確實比其他人還要……費神一些，但是我跟戴莉從來都沒有覺得照顧妳很麻煩過，對吧戴莉？」瑪莉亞揉揉她的腦袋安慰道，同時看向戴莉用力的晃著腦袋要她說點附和然後什麼。\n　　「照顧妳當然麻煩的要死啊？妳是我照顧過最爛的一屆了。」戴莉挑眉無視瑪莉亞的暗示直接把話說出來：「妳自己反省一下，妳從頭到腳哪個地方不是我跟瑪莉亞照顧出來的？頭髮要人洗梳綁、身體也是我們兩個人每天仔仔細細的清理的、更別說衣服妳身上哪個扣子是妳扣的？妳真的是我培養過最難養的那個了。」\n　　「戴莉……！妳這樣說也太過分了吧？姜燕已經很難過了，這邊我們應該要……」\n　　瑪莉亞惱怒，輕聲斥責她(因為姜燕還在難過)，但戴莉沒有管而是聳聳肩再度開口：「我只是說她好麻煩而已，這是實話，但我從來都沒有說我不照顧了。」\n　　「……？」瑪莉亞愣住了，姜燕則是露出困惑的目光看向戴莉，戴莉用力的揉了下姜燕的腦袋瓜，感覺這裡面空空的大概姜燕真的沒腦子吧。\n　　總之她揉了下那粉色的腦袋瓜、柔順且在燈光照射下反射出好看光芒的髮絲，像是看著自己的勞動成果一樣。\n　　「真的要說，我照顧妳這白癡從學校開始也已經照顧兩年了，真的要討厭妳到直接走人我早就這麼做了，怎麼可能還照顧妳兩年啊？」\n　　「我什麼個性妳不是最清楚了嗎？遇到討厭的傢伙轉頭就走了，怎麼還可能忍妳兩年多。」\n　　「嗚嗚嗚戴莉……」姜燕因她的話語變得放鬆，輕輕靠在她身上掉淚：「戴莉我最喜歡妳了——」\n　　「等、等一下，不要搞得我很死板一樣好不好……」瑪莉亞沒想到姜燕好的這麼快，頓時滿臉通紅去扯姜燕：「在、在照顧姜燕妳上我也花了很多心思的……！妳想想看我每天都幫妳把衣服穿好、還有刷牙洗臉這些的……」\n　　「嗚嗚嗚瑪莉亞……」姜燕毫不猶豫的又往瑪莉亞身上靠，掉下開心的淚水:「瑪莉亞我也最喜歡妳了——」\n　　「嗯，我也最喜歡姜燕了喔——」感覺自己爭贏的瑪莉亞像是安撫小狗一樣來回摸姜燕的肚子，喉嚨裡發出來的回應帶著小小的得意。\n　　「……！」很難把喜歡說出口的戴莉感覺自己吃了啞巴虧，漲紅著臉不知道該說什麼好，最後只好用力的去抱住兩個人：「該死的 ……。」\n　　",

        "maria": "　　「……唉。」瑪莉亞長長嘆了一口氣，撐著臉看著窗外很是煩惱的樣子。\n　　「幹嘛？」戴莉古怪的問，從剛剛開始她就時不時嘆氣，不知道的人還以為家裡欠了八百萬一樣。\n　　「沒有什麼……」瑪莉亞回應，但眉頭皺在一起的樣子讓戴莉有些不爽。她最討厭話不說清楚的人，但對象是瑪莉亞、以她的個性來說可能是思考很多的事情，也許也和她們兩個有關，所以現在她還能忍耐。\n　　「沒有要說的話就不要嘆氣那麼大聲，如果是真的想找人說話的話就現在說一說。」戴莉抱怨道，環著手語氣非常不滿：「一直在人家旁邊嘆氣不就是想有人搭理嗎？」\n　　「話是這樣說啦……」瑪莉亞有些拘謹的看向戴莉，後者則滿腦子疑惑。瑪莉亞攪著手，低下頭不好意思的說：「這、這種事情也只能跟戴莉妳說了。」\n　　「就是、上次跟姜燕玩扳手的時候要我發現自己力氣小的很可憐……想要增加自己的力氣，結果發現我連小的啞鈴都很難拿起來……」瑪莉亞越說臉越紅，聲音也逐漸變得像蚊子一樣，最後整張臉埋在雙手中感覺她說了一個天大的秘密一樣。\n　　「這難道不是單純因為那傢伙力氣太大嗎？」姜燕的武器少說有二十公斤以上，但她可以像是拿根竹竿一樣揮舞，所以比起瑪莉亞的問題戴莉更覺得原因出在姜燕身上。\n　　「但是……」瑪莉亞支支吾吾的，想說點什麼又說不出來。\n　　好麻煩的女人。戴莉感覺自己的不爽度更上一層樓了，這兩個人怎麼有成天煩惱不完的事情？\n　　真是沒辦法……\n　　「把手伸出來。」戴莉伸手向她要，瑪莉亞疑惑聽話伸出右手，她直接將手扣了上去。\n　　「這這這這這這是要做什麼!」瑪莉亞的臉色瞬間漲紅，都快變成番茄了。戴莉對她慌亂的樣子很不解、只是一個十指相扣的動作有什麼好大驚小怪的?這樣才好測試她的力氣啊。\n　　「妳在臉紅什麼?」\n　　「前、前幾天跟微歐莉特特工借了幾本小說看看，以前沒接觸過這類型的故事書不是嗎?所以被推薦了。然後裡面男主角就這樣和女主角十指相扣訂下愛的誓言……」瑪莉亞有些結巴的解釋、但戴莉只覺得很無言。那種小說她當然有看過，而且還是幹詐騙的時候同伴說很好看推薦給她的。\n　　當然看了之後非常一言難盡。\n　　「那妳現在是要我跟妳求婚嗎？」戴莉愈發無言，但她想趕快解決問題：「……算了，這種事情先放一邊，我只是要測試妳的力氣而已。快點握緊我的手。」\n　　「我、我剛剛就緊張到握緊了……」瑪莉亞紅著臉低下頭說，戴莉往兩人交扣的手看去，只見瑪莉亞用力的指間都發白了、但自己只有感覺到被握住、沒有其他更多的感覺。\n　　「妳真的有出力嗎？」\n　　戴莉有些用力的回握，瑪莉亞立即痛到大喊：「好痛好痛好痛！鬆手！戴莉鬆手！」\n　　鬆手，肉眼可見瑪莉亞指尖白皙皮膚中被勒出的紅痕，戴莉開始思考要是上手掐瑪莉亞的話會不會不用半分鐘她就死掉了。但最終沒有將這個想法說出來，只是聳聳肩：「妳這樣不行啊瑪莉亞小妹妹。」\n　　「什、什麼小妹妹……！我已經是一個獨立的大人了……！」因疼痛而眼淚即將溢出眼眶的瑪莉亞反駁：「是戴莉妳、妳太用力了所以我才……」\n　　「好好好，是我太用力了。對不起喔。」戴莉沒打算堅持下去，抱手看著她：「妳力氣只有這樣的話那之前妳推姜燕她怎麼會被推走？」\n　　「啊……那個……」瑪莉亞不好意思的撇開目光：「一部份是她感覺我在推她所以她配合我，另一部份是我用超能力推的……」\n　　超能力比她自己還有力氣，懂了。",

        "daili": "　　悶熱的夜晚總是會想到一些有的沒有，平時根本不會想起來、但因為某個小事突然冒出來的的記憶。\n　　帳篷內就算開著電風扇也還是難擋夏日悶熱的空氣，尤其是在一張大床上塞了三個人的時候更是如此。我推開姜燕那張白癡的臉和壓在我身上的手臂後勉強找到呼吸的空間，從兩人中間坐了起來。\n　　好熱，突然睡不著了。\n　　帳篷的捲簾門縫隙中透過一點點白光我猜現在大概是五點多一點、太陽開始升起的時候，如果是平時我大概會躺回去賴床到九點正式起床的時候，但今天、現在、就此時此刻，我睡意全都因為剛剛做的夢消失了。\n　　好吧、偶爾早起應該不是什麼壞事，我決定起床吹一下晨風。\n　　稍微整理了一下裝備，我將腰包小心翼翼的扣好，一一細數過裡面的東西沒有缺少後回頭看了一眼還睡的香甜的那兩人輕聲離開帳篷。\n　　狡兔的帳篷設在一個比較微妙的地方，總之和黑羊那些小隊有一些距離，最近的嚙鼠帳篷也大概要走五百公尺，因為我們負責最外圍的安危、也是最容易聽到次元警報的地方，因為隔了些距離所以不用擔心遇到其他特工，這點我還是挺放心的，但為了不要遇見他們，我決定還是不要走太遠，就在海洋公園邊緣走走吹個海風就行了。\n　　邊走邊想著剛剛的夢境，雖然也說不上是夢境、是一個被我放很久的記憶，但還是有些毛骨悚然……讓我不禁緊抓著腰包深怕一不注意就被搶走了。這個腰包……不，是裡面的那個「遺物」，是絕對不能被搶走、被拿走的東西。\n　　因為「約定」，所以我必須保證它萬無一失。\n　　但最近我有些迷茫了——以復仇換來的這個「東西」，它究竟有這個價值嗎？又或者是它、價值真的與復仇「同等價值」嗎？\n　　雖然那個女人說一定是等價的，但我內心隨著成為特工後開始逐漸不安了，早就知道那女人不簡單……不，簡直是危險的存在，光是聽她講話的聲音和語氣，如果不穩定心神的話根本無法維持理智，就連自己都不敢保證當時絕對的冷靜，說不定在無意識中中了她的催眠而答應這筆交易。\n　　「妳的復仇就由我來實現。」\n　　「不，這是我自己的復仇。」\n　　我眨著眼看著對方，黯淡無波的藍瞳柔和而誘惑，但自己卻怎麼樣都覺得陰冷，淡淡吐出：「我不是要妳幫我復仇，如果不是自己去做的話就沒有意義了。」\n　　「呼呼，妳也是很有趣的人呢。」淡金色的髮絲在空中飄盪，藍瞳微微瞇起露出愉悅的模樣，搭上周圍不斷燃燒的火焰有種說不出來的邪惡感，但當時卻沒有感覺到不適。\n　　「可以啊，交易就這麼成立吧。」女人將一旁獨眼男人拿來的東西交給我，小小的盒子、裡面裝著金黃色的戒指、如火焰在其中燃燒般的寶石和指鏈。\n　　「我很期待妳的活躍喔，✕✕✕。」\n　　「戴莉……現在叫戴莉。」\n　　我有些沉重的吐氣，將新的名字說出，但老實說我也不知道這名字能夠用多久。\n　　「好的，我……不，火焰王教團會祝福妳前程順遂的——騙子小姐。」\n　　「隨便吧。」\n　　我收起盒子，看著她富饒趣味的臉，仔細看是真的好看、但同時給人相當不安的感覺，我離開的時刻快要到了，只剩下一個問題的時間：「什麼時候用？」\n　　「這個嘛……」她饒有趣味的摸著唇故作思考、相當做作，半晌後莞爾：「當妳想復仇的對象出現在妳的面前的時候吧。」\n　　「那一定是……不遠的將來。」\n　　「……唉。」\n　　當時大概被機油矇了眼，沒有多想就答應了這麼荒唐的事情。明明當時那麼激烈的想要復仇，現在卻有點退縮了。\n　　不、不是不想復仇，我現在也仍舊懷抱著想要讓那些人下地獄的恨意，但是一想到姜燕和瑪莉亞卻又……。\n　　「突然有點希望……那些人已經被次元獸吃了，我就找不到復仇的對象了。」\n　　看著目前還風平浪靜的海面，我摸著腰包、感覺像是抓著「那位東西」一樣。\n　　「“火焰王的契約“……希望不會有用到的那天。」\n　　-\n　　？？？？？：「這還不好說了呢……騙子小姐……」",

function getEpisodeViews(episode) {
  return episode?.content ?? {};
}

function normalizeViewText(value) {
  return typeof value === 'string' ? value.replace(/\r/g, '').trim() : '';
}

function isPlaceholderContent(value) {
  const raw = normalizeViewText(value);
  const text = raw.replace(/^【[^】]+】\s*/, '').trim();

  return (
    text === '' ||
    text === '待補。' ||
    text === '待補' ||
    text === '此視角尚無內容。' ||
    text === '此視角尚無內容'
  );
}

function getSelectableViewGroups() {
  return LOG_PREVIEW_DATA.viewGroups.filter((group) => {
    if (group.id === 'unknown') return true;

    return LOG_PREVIEW_DATA.episodes.some((episode) => {
      const contentMap = getEpisodeViews(episode);
      return !isPlaceholderContent(contentMap[group.id]);
    });
  });
}

function getEpisodesForCurrentView() {
  return LOG_PREVIEW_DATA.episodes
    .map((episode, originalIndex) => ({ episode, originalIndex }))
    .filter(({ episode }) => {
      const contentMap = getEpisodeViews(episode);
      return !isPlaceholderContent(contentMap[currentViewId]);
    });
}

function getCurrentEpisodeEntry() {
  const visibleEpisodes = getEpisodesForCurrentView();

  if (!visibleEpisodes.length) {
    return null;
  }

  if (currentEpisodeIndex < 0 || currentEpisodeIndex >= visibleEpisodes.length) {
    currentEpisodeIndex = 0;
  }

  return visibleEpisodes[currentEpisodeIndex];
}

let currentEpisodeIndex = 0;
let currentViewId = 'yan';
let switchAnimationTimer = null;

function renderViewSwitch() {
  const container = document.getElementById('logViewSwitch');
  container.innerHTML = '';

  const groups = getSelectableViewGroups();

  groups.forEach((group) => {
    const btn = document.createElement('button');
    btn.className = 'log-view-btn' + (group.id === currentViewId ? ' active' : '');

    if (group.id === 'unknown') {
      btn.classList.add('locked-view-btn');
    }

    btn.textContent = group.label;

    btn.addEventListener('click', () => {
      if (group.id === 'unknown') {
        playLockedAnimation();
        playDeniedText(btn);
        return;
      }

      if (currentViewId === group.id) return;

      currentViewId = group.id;
      currentEpisodeIndex = 0;
      renderEpisodeList();
      renderEpisodeContent(0);
      playViewSwitchAnimation();
    });

    container.appendChild(btn);
  });
}

function playViewSwitchAnimation() {
  const contentEl = document.querySelector('.log-content');
  if (!contentEl) return;

  contentEl.classList.remove('is-switching');
  void contentEl.offsetWidth;
  contentEl.classList.add('is-switching');

  clearTimeout(switchAnimationTimer);
  switchAnimationTimer = setTimeout(() => {
    contentEl.classList.remove('is-switching');
  }, 340);
}

function renderEpisodeList() {
  const listEl = document.getElementById('logEpisodeList');
  listEl.innerHTML = '';

  const visibleEpisodes = getEpisodesForCurrentView();

  if (!visibleEpisodes.length) {
    listEl.innerHTML = `
      <div class="log-entry-kicker" style="padding:12px 4px;">
        此視角目前沒有收錄劇情
      </div>
    `;
    return;
  }

  visibleEpisodes.forEach(({ episode, originalIndex }, visibleIndex) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.episodeIndex = String(visibleIndex);
    button.dataset.originalIndex = String(originalIndex);
    button.className =
      `log-episode-btn${visibleIndex === currentEpisodeIndex ? ' active' : ''}`;

    button.innerHTML = `
      <span class="log-episode-no">${episode.no}</span>
      <span class="log-episode-label">${episode.label}</span>
    `;

    button.addEventListener('click', () => {
      const isSameEpisode = currentEpisodeIndex === visibleIndex;
      renderEpisodeContent(visibleIndex);

      if (!isSameEpisode) {
        playViewSwitchAnimation();
        document.querySelector('.log-content')?.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }
    });

    listEl.appendChild(button);
  });
}

function renderEpisodeContent(episodeIndex) {
  currentEpisodeIndex = episodeIndex;

  const currentEntry = getCurrentEpisodeEntry();

  renderViewSwitch();
  renderEpisodeList();

  if (!currentEntry) {
    document.getElementById('logEntryKicker').textContent = '';
    document.getElementById('logEntryTitle').textContent = '未收錄劇情';
    document.getElementById('logEntryText').textContent = '';
    return;
  }

  const { episode } = currentEntry;
  const contentMap = getEpisodeViews(episode);
  const groupLabel =
    LOG_PREVIEW_DATA.viewGroups.find((v) => v.id === currentViewId)?.label || '';
  const content = normalizeViewText(contentMap[currentViewId]);

  document.getElementById('logEntryKicker').textContent = groupLabel;
  document.getElementById('logEntryTitle').textContent =
    `${episode.no}｜${episode.label}｜${groupLabel}`;
  document.getElementById('logEntryText').textContent = content;

  [...document.querySelectorAll('.log-episode-btn')].forEach((button) => {
    const isActive = button.dataset.episodeIndex === String(currentEpisodeIndex);
    button.classList.toggle('active', isActive);
  });
}

function init() {
  document.getElementById('logAreaTitle').textContent = LOG_PREVIEW_DATA.area;
  document.getElementById('logAreaSubtitle').textContent = LOG_PREVIEW_DATA.subtitle;

  const groups = getSelectableViewGroups().filter((group) => group.id !== 'unknown');
  if (groups.length) {
    currentViewId = groups[0].id;
  }

  currentEpisodeIndex = 0;
  renderViewSwitch();
  renderEpisodeList();
  renderEpisodeContent(0);
}

init();

function playLockedAnimation() {
  const panel = document.querySelector('.log-panel');

  panel.classList.add('locked');

  setTimeout(() => {
    panel.classList.remove('locked');
  }, 400);
}

function playDeniedText(btn) {
  const originalText = '【未開放】';

  btn.textContent = 'ACCESS DENIED';
  btn.classList.add('denied');

  setTimeout(() => {
    btn.textContent = originalText;
    btn.classList.remove('denied');
  }, 800);
}

document.getElementById('closeBtn').addEventListener('click', () => {
  if (window.history.length > 1) {
    // 有上一頁 → 回去
    window.history.back();
  } else {
    // 沒上一頁 → 跳到入口頁
    window.location.href = 'records.html';
  }
});
  </script>
</body>
</html>
