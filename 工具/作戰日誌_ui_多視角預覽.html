<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作戰日誌 UI 預覽</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(12, 11, 14, 0.96);
      --panel-2: rgba(18, 14, 13, 0.92);
      --frame: rgba(220, 120, 48, 0.24);
      --frame-soft: rgba(255, 180, 120, 0.08);
      --text-main: #fff3ea;
      --text-soft: rgba(255, 220, 198, 0.62);
      --text-dim: rgba(255, 210, 185, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(rgba(255,140,60,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.06) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px, 12px 12px, 12px 12px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(200,90,28,.18), transparent 26%),
        radial-gradient(circle at top right, rgba(255,150,80,.10), transparent 20%),
        radial-gradient(circle at bottom, rgba(140,50,10,.14), transparent 30%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .log-panel {
      position: relative;
      width: min(1180px, 100%);
      min-height: 680px;
      max-height: calc(100vh - 56px);
      display: grid;
      grid-template-rows: auto 1fr;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--frame);
      background: linear-gradient(180deg, rgba(14,12,14,.98), rgba(8,9,12,.98));
      box-shadow: 0 0 0 1px var(--frame-soft) inset, 0 0 72px rgba(120,40,10,.32);
    }

    .log-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,140,60,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.08) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: .24;
      pointer-events: none;
    }

    .log-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(220,120,48,.18);
      background: linear-gradient(90deg, rgba(200,90,28,.12), rgba(0,0,0,0));
    }

    .log-kicker {
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(240,176,138,.52);
    }

    .log-area-title {
      margin: 8px 0 4px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
      text-shadow: 0 0 18px rgba(255,120,48,.12);
    }

    .log-area-subtitle {
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,210,185,.52);
    }

    .log-close {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(220,120,48,.22);
      border-radius: 14px;
      background: rgba(18,14,13,.88);
      color: #ffe9dc;
      font-size: 20px;
      box-shadow: 0 0 0 1px rgba(255,170,120,.05) inset;
    }

    .log-body {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .log-sidebar {
      padding: 18px;
      border-right: 1px solid rgba(220,120,48,.14);
      background: linear-gradient(180deg, rgba(20,14,12,.84), rgba(12,11,13,.74));
      overflow: auto;
    }

    .log-view-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .log-view-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .14em;
      border-radius: 12px;
      border: 1px solid rgba(220,120,48,.18);
      background: rgba(24,16,13,.6);
      color: var(--text-soft);
      cursor: pointer;
      transition: all .18s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .log-view-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,220,190,.18) 45%, transparent 70%);
      transform: translateX(-140%);
      opacity: 0;
    }

    .log-view-btn:hover::after {
      opacity: 1;
      transform: translateX(140%);
      transition: transform .45s ease, opacity .2s ease;
    }

    .log-view-btn.active {
      background: rgba(120,48,18,.7);
      color: var(--text-main);
      border-color: rgba(255,170,100,.4);
      box-shadow: 0 0 10px rgba(200,90,28,.2);
      transform: translateY(-1px);
    }

    .log-sidebar-title {
      margin: 0 0 14px;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,210,185,.48);
    }

    .log-episode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-episode-btn {
      width: 100%;
      text-align: left;
      padding: 14px 14px 13px;
      border: 1px solid rgba(220,120,48,.12);
      border-radius: 16px;
      background: rgba(24,16,13,.72);
      color: #ffece1;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .log-episode-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,160,90,.34);
      background: rgba(54,28,17,.78);
    }

    .log-episode-btn.active {
      border-color: rgba(255,170,100,.42);
      background: linear-gradient(180deg, rgba(120,48,18,.68), rgba(54,24,15,.82));
      box-shadow: 0 0 18px rgba(200,90,28,.18);
    }

    .log-episode-no {
      display: block;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--text-main);
    }

    .log-episode-label {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--text-soft);
    }

    .log-content {
      padding: 24px 28px 28px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .log-entry-text,
    .log-entry-title,
    .log-entry-kicker,
    .log-content-head {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .log-content.is-switching .log-content-head,
    .log-content.is-switching .log-entry-text {
      animation: viewSwapFade .32s ease;
    }

    .log-content.is-switching::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(255,140,60,.08) 48%, rgba(255,220,190,.18) 50%, rgba(255,140,60,.08) 52%, transparent 100%);
      mix-blend-mode: screen;
      animation: viewScan .32s ease;
    }

    .log-content-head {
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(220,120,48,.12);
      margin-bottom: 18px;
    }

    .log-entry-kicker {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .log-entry-title {
      margin: 10px 0 0;
      font-size: 24px;
      letter-spacing: .06em;
      color: var(--text-main);
    }

    .log-entry-text {
      white-space: pre-wrap;
      line-height: 2.05;
      color: rgba(255,236,224,.82);
      font-size: 17px;
    }

    /* Scrollbar 美化 */
    .log-content::-webkit-scrollbar,
    .log-sidebar::-webkit-scrollbar {
      width: 10px;
    }

    .log-content::-webkit-scrollbar-track,
    .log-sidebar::-webkit-scrollbar-track {
      background: rgba(20,14,12,.6);
      border-radius: 10px;
    }

    .log-content::-webkit-scrollbar-thumb,
    .log-sidebar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255,140,60,.6), rgba(200,80,30,.6));
      border-radius: 10px;
      border: 1px solid rgba(255,180,120,.2);
    }

    .log-content::-webkit-scrollbar-thumb:hover,
    .log-sidebar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255,160,90,.8), rgba(220,100,40,.8));
    }

    @keyframes viewSwapFade {
      0% {
        opacity: .2;
        transform: translateY(8px);
        filter: blur(4px);
      }
      55% {
        opacity: .82;
        transform: translateY(0);
        filter: blur(1px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes viewScan {
      0% {
        opacity: 0;
        transform: translateX(-28%);
      }
      30% {
        opacity: .85;
      }
      100% {
        opacity: 0;
        transform: translateX(28%);
      }
    }

    @media (max-width: 900px) {
      .page { padding: 14px; }
      .log-panel {
        min-height: auto;
        max-height: calc(100vh - 28px);
      }
      .log-body {
        grid-template-columns: 1fr;
      }
      .log-sidebar {
        max-height: 220px;
        border-right: 0;
        border-bottom: 1px solid rgba(220,120,48,.14);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="log-panel" role="dialog" aria-modal="true" aria-labelledby="logAreaTitle">
      <header class="log-header">
        <div>
          <div class="log-kicker">Operation Log</div>
          <h1 class="log-area-title" id="logAreaTitle">殉教者山丘</h1>
          <div class="log-area-subtitle" id="logAreaSubtitle">主線開放</div>
        </div>
        <button class="log-close" type="button" aria-label="關閉">×</button>
      </header>

      <div class="log-body">
        <aside class="log-sidebar">
          <div class="log-view-switch" id="logViewSwitch"></div>
          <h2 class="log-sidebar-title">視角索引</h2>
          <div class="log-episode-list" id="logEpisodeList"></div>
        </aside>

        <article class="log-content">
          <div class="log-content-head">
            <div class="log-entry-kicker" id="logEntryKicker">共通紀錄</div>
            <h2 class="log-entry-title" id="logEntryTitle">01｜共通紀錄</h2>
          </div>
          <div class="log-entry-text" id="logEntryText"></div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const LOG_PREVIEW_DATA = {
  area: '殉教者山丘',
  subtitle: '主線開放',
  viewGroups: [
    { id: 'group1', label: '姜戴瑪' },
    { id: 'group2', label: '洛潔莉雅' }
  ],
  episodes: [
    {
      no: '01',
      label: '山丘入口',
      content: {
        group1: `【姜戴瑪】
　　「戴莉，這個是什麼？」
　　我有一個煩惱。
　　「戴莉，為什麼它會這樣？」
　　非常大的煩惱。
　　「戴莉，這個好好看喔！」
　　由一個煩惱分裂成無數小煩惱的超級大煩惱。
　　「戴莉，能不能買這個啊？」
　　算了，不能算煩惱，只能算天降的大麻煩。
　　「戴莉——」
　　我毫不猶豫的揮出我的拳頭，沒有收力氣、沒有任何懸念、沒有任何猶豫和質疑，只有滿腔的憤怒和暴躁：「叫叫叫！叫叫叫！妳是雞啊？咕咕咕的叫個不停！」
　　一拳揮在那粉色的腦袋上，姜燕一邊喊著「好痛戴莉為什麼打我？」一邊露出楚楚可憐的樣子，但我不會被她的外表所蒙蔽。
　　不如說姜燕就是一個外表詐騙犯，表面上不說話看起來給人相當聰明且狠毒的存在，但可惜只要一開口就會覺得她是個腦袋萎縮、智商有缺陷、且非常我行我素的小朋友。
　　不對，說是人太抬舉她了，她是一隻豬頭、是個猴子、是條狗。
　　詐騙集團的信念講求耐心、毅力且技巧性的引導，在此前提下我練就了完美的耐心——但這一切在姜燕這頭豬的面前沒有任何用處，我只要被她纏上耐心就會迅速見底然後揮出我的拳頭。
　　雖然我平時比較常和瑪莉亞吵架……最近倒是沒有，大概是因為我們兩人關係緩和了許多、所以不怎麼會吵架了。但姜燕給人的那種煩躁的感覺始終揮散不去，而且總感覺只有我受不了她。
　　「戴莉……」她又用可憐兮兮的表情看著我，但我不會被她迷惑、因為她一直都是這樣，給人添麻煩、然後裝可憐、最後大家都會原諒她。
　　天底下哪有這麼好的事情？
　　如果有的話我搞詐騙的時候怎麼沒遇過？
　　總而言之，我絕對不會對她心軟。
　　但現實是，我還是得帶著她繼續往前走。
　　因為任務還沒結束。
　　而這座山丘，還在等著我們。`,
        group2: `【洛潔莉雅】
洛潔莉雅從遠處觀察山丘結構。
她並未接近主入口。
而是選擇高點視角。
光學裝置捕捉到異常反射。
地下似乎存在封閉系統。
她開始建立模型。
推測內部仍有運作核心。
風向變化帶來低頻回音。
頻率並不隨自然條件變動。
這代表人工干預。
她記錄每一次回響間隔。
數據呈現規律性。
這不像廢墟。
更像待機狀態。
洛潔莉雅調整感測器靈敏度。
發現能量殘留。
來源位置不固定。
這意味系統仍在運算。
她將結論標記為高風險。
但未立即通報。
她想再確認一次。
第二次掃描開始。
山丘依然沉默。
但她確信，有東西正在看著外面。`
      }
    },
    {
      no: '02',
      label: '地下回音',
      content: {
        group1: `【姜戴瑪】
隊伍抵達殉教者山丘外圍後，氣壓異常偏低。
地表殘留的裝置碎片顯示這裡曾是封鎖地。
姜燕先行標記入口座標。
戴莉則已經開始檢查武裝。
瑪莉亞持續觀測地形。
遠處風聲呈現不自然的迴響。
姜燕判斷需要建立據點。
戴莉對此表現出明顯不耐。
她認為應直接突破。
瑪莉亞提出反對。
她指出高處仍未確認。
隊伍暫時停止前進。
建立臨時通訊節點。
能量讀數出現微幅波動。
地下似乎存在活動源。
戴莉再次要求前進。
姜燕維持原命令。
氣氛逐漸緊繃。
瑪莉亞開始記錄聲紋。
夜色壓低了整個山丘。
第一階段觀測完成。
但沒有人真正放鬆。
所有人都在等待下一個變化。`,
        group2: `【洛潔莉雅】
洛潔莉雅從遠處觀察山丘結構。
她並未接近主入口。
而是選擇高點視角。
光學裝置捕捉到異常反射。
地下似乎存在封閉系統。
她開始建立模型。
推測內部仍有運作核心。
風向變化帶來低頻回音。
頻率並不隨自然條件變動。
這代表人工干預。
她記錄每一次回響間隔。
數據呈現規律性。
這不像廢墟。
更像待機狀態。
洛潔莉雅調整感測器靈敏度。
發現能量殘留。
來源位置不固定。
這意味系統仍在運算。
她將結論標記為高風險。
但未立即通報。
她想再確認一次。
第二次掃描開始。
山丘依然沉默。
但她確信，有東西正在看著外面。`
      }
    }
  ]
};

    function getEpisodeViews(episode) {
      return episode?.content ?? {};
    }

    let currentEpisodeIndex = 0;
let currentViewId = 'group1';
let switchAnimationTimer = null;

function renderViewSwitch() {
  const container = document.getElementById('logViewSwitch');
  container.innerHTML = '';

  LOG_PREVIEW_DATA.viewGroups.forEach(group => {
    const btn = document.createElement('button');
    btn.className = 'log-view-btn' + (group.id === currentViewId ? ' active' : '');
    btn.textContent = group.label;
    btn.addEventListener('click', () => {
      if (currentViewId === group.id) return;
      currentViewId = group.id;
      renderEpisodeContent(currentEpisodeIndex);
      playViewSwitchAnimation();
    });
    container.appendChild(btn);
  });
}

function playViewSwitchAnimation() {
      const contentEl = document.querySelector('.log-content');
      if (!contentEl) return;

      contentEl.classList.remove('is-switching');
      void contentEl.offsetWidth;
      contentEl.classList.add('is-switching');

      clearTimeout(switchAnimationTimer);
      switchAnimationTimer = setTimeout(() => {
        contentEl.classList.remove('is-switching');
      }, 340);
    }

    function renderEpisodeContent(episodeIndex) {
      currentEpisodeIndex = episodeIndex;
      const episode = LOG_PREVIEW_DATA.episodes[episodeIndex];
      if (!episode) return;

      const contentMap = getEpisodeViews(episode);
      const content = contentMap[currentViewId] ?? '此視角尚無內容。';
      renderViewSwitch();

      const groupLabel = LOG_PREVIEW_DATA.viewGroups.find(v => v.id === currentViewId)?.label || '';
      document.getElementById('logEntryKicker').textContent = groupLabel;
      document.getElementById('logEntryTitle').textContent = `${episode.no}｜${episode.label}｜${groupLabel}`;
      document.getElementById('logEntryText').textContent = content;

      [...document.querySelectorAll('.log-episode-btn')].forEach((button) => {
        const isActive = button.dataset.episodeIndex === String(episodeIndex);
        button.classList.toggle('active', isActive);
      });
    }

    function renderEpisodeList() {
      const listEl = document.getElementById('logEpisodeList');
      listEl.innerHTML = '';

      LOG_PREVIEW_DATA.episodes.forEach((episode, episodeIndex) => {

        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.episodeIndex = String(episodeIndex);
        button.className = `log-episode-btn${episodeIndex === 0 ? ' active' : ''}`;
        button.innerHTML = `
          <span class="log-episode-no">${episode.no}</span>
          <span class="log-episode-label">${episode.label}</span>
        `;
        button.addEventListener('click', () => {
          const isSameEpisode = currentEpisodeIndex === episodeIndex;
          renderEpisodeContent(episodeIndex);
          if (!isSameEpisode) {
            playViewSwitchAnimation();
            document.querySelector('.log-content')?.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
        listEl.appendChild(button);
      });
    }

    function init() {
      document.getElementById('logAreaTitle').textContent = LOG_PREVIEW_DATA.area;
      document.getElementById('logAreaSubtitle').textContent = LOG_PREVIEW_DATA.subtitle;
      renderEpisodeList();
      renderEpisodeContent(0);
    }

    init();
  </script>
</body>
</html>
