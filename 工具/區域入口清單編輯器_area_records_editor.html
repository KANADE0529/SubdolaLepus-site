<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>區域入口清單編輯器</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(12, 11, 14, 0.96);
      --panel-soft: rgba(20, 14, 12, 0.84);
      --frame: rgba(220, 120, 48, 0.24);
      --frame-strong: rgba(255, 160, 90, 0.38);
      --text-main: #fff3ea;
      --text-soft: rgba(255, 220, 198, 0.72);
      --text-dim: rgba(255, 210, 185, 0.46);
      --danger: rgba(160, 42, 32, 0.86);
      --danger-border: rgba(255, 120, 100, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.18) 1px, transparent 1px),
        linear-gradient(rgba(255,140,60,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,140,60,.06) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px, 12px 12px, 12px 12px;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      padding: 24px;
      overflow: hidden;
    }

    .shell {
      max-width: 1760px;
      height: calc(100vh - 48px);
      margin: 0 auto;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid var(--frame);
      background: linear-gradient(180deg, rgba(14,12,14,.98), rgba(8,9,12,.98));
      box-shadow: 0 0 0 1px rgba(255,170,120,.06) inset, 0 0 72px rgba(120,40,10,.24);
      display: flex;
      flex-direction: column;
    }

    .shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(220,120,48,.18);
      background: linear-gradient(90deg, rgba(200,90,28,.12), rgba(0,0,0,0));
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(240,176,138,.52);
    }

    .title {
      margin: 8px 0 4px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,210,185,.52);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(220,120,48,.18);
      background: rgba(24,16,13,.72);
      color: #ffece1;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,160,90,.34);
      background: rgba(54,28,17,.78);
    }

    .btn.primary {
      background: linear-gradient(180deg, rgba(120,48,18,.78), rgba(54,24,15,.88));
      border-color: rgba(255,170,100,.42);
    }

    .btn.danger {
      background: var(--danger);
      border-color: var(--danger-border);
    }

    .body {
      display: grid;
      grid-template-columns: 360px 420px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
    }

    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(220,120,48,.14);
      background: rgba(14, 12, 14, 0.78);
    }

    .panel:last-child { border-right: 0; }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(220,120,48,.14);
      background: linear-gradient(180deg, rgba(20,14,12,.84), rgba(12,11,13,.74));
    }

    .section-title {
      margin: 0;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,210,185,.48);
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .field { margin-bottom: 16px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: rgba(255,220,198,.76);
      letter-spacing: .08em;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid rgba(220,120,48,.18);
      border-radius: 14px;
      background: rgba(22,16,15,.86);
      color: #fff0e8;
      padding: 12px 14px;
      outline: none;
    }

    .textarea {
      min-height: 220px;
      resize: none;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow: auto;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--frame-strong);
      box-shadow: 0 0 0 1px rgba(255,170,100,.16) inset;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid rgba(220,120,48,.18);
      border-radius: 14px;
      background: rgba(22,16,15,.86);
    }

    .stack,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: rgba(255,220,198,.74);
      font-size: 13px;
      line-height: 1.7;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .item-list {
      display: grid;
      gap: 10px;
    }

    .item-card {
      width: 100%;
      text-align: left;
      padding: 14px;
      border: 1px solid rgba(220,120,48,.12);
      border-radius: 16px;
      background: rgba(24,16,13,.72);
      color: #ffece1;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .item-card:hover {
      transform: translateY(-1px);
      border-color: rgba(255,160,90,.34);
      background: rgba(54,28,17,.78);
    }

    .item-card.active {
      border-color: rgba(255,170,100,.42);
      background: linear-gradient(180deg, rgba(120,48,18,.68), rgba(54,24,15,.82));
      box-shadow: 0 0 18px rgba(200,90,28,.18);
    }

    .item-card-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .item-card-meta {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(255,220,198,.72);
      word-break: break-all;
    }

    .window-preview {
      width: 100%;
      min-height: 640px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--frame);
      background: linear-gradient(180deg, rgba(14,12,14,.98), rgba(8,9,12,.98));
      box-shadow: 0 0 0 1px rgba(255,170,120,.06) inset;
    }

    .preview-titlebar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(220,120,48,.18);
      background: linear-gradient(90deg, rgba(200,90,28,.12), rgba(0,0,0,0));
      color: rgba(255,220,198,.72);
      font-size: 12px;
      letter-spacing: .12em;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      border: 1px solid rgba(255,140,60,.25);
      background: rgba(255,140,60,.08);
      color: #ffd9bf;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.red { background: #d65a3a; }
    .dot.yellow { background: #cfa05a; }
    .dot.green { background: #7fbf7f; }

    .window-title {
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path {
      font-size: 11px;
      color: #d8b8a0;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .preview-content {
      padding: 24px;
      min-height: 0;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 28px 24px;
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      padding: 8px;
      border-radius: 12px;
    }

    .icon-box {
      width: 150px;
      height: 104px;
      border-radius: 4px;
      border: 1px solid rgba(255, 140, 60, 0.45);
      background: linear-gradient(180deg, rgba(255, 150, 60, 0.35), rgba(200, 90, 20, 0.25));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      letter-spacing: 0.15em;
      color: #ffd9bf;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 180, 0.25),
        inset 0 -1px 4px rgba(120, 50, 10, 0.25),
        0 4px 10px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: visible;
    }

    .icon-box::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 14px;
      width: 48px;
      height: 18px;
      background: linear-gradient(180deg, rgba(255, 160, 70, 0.45), rgba(200, 90, 20, 0.25));
      border: 1px solid rgba(255, 140, 60, 0.45);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
    }

    .icon-box::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 3px;
      border: 1px solid rgba(255, 200, 150, 0.12);
      pointer-events: none;
    }

    .icon-code {
      font-weight: 700;
    }

    .icon-label {
      font-size: 15px;
      font-weight: 500;
      color: #e8cdb8;
      text-align: center;
      line-height: 1.45;
    }

    .anomaly .icon-box {
      background: linear-gradient(180deg, rgba(170, 80, 50, 0.28), rgba(70, 22, 20, 0.22));
      border-color: rgba(255, 120, 95, 0.28);
      color: rgba(255, 210, 198, 0.8);
    }

    .export-box {
      min-height: 240px;
      resize: vertical;
    }

    .sidebar-scroll::-webkit-scrollbar,
    .panel-body::-webkit-scrollbar,
    .textarea::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .sidebar-scroll::-webkit-scrollbar-track,
    .panel-body::-webkit-scrollbar-track,
    .textarea::-webkit-scrollbar-track {
      background: rgba(20,14,12,.6);
      border-radius: 10px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb,
    .panel-body::-webkit-scrollbar-thumb,
    .textarea::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255,140,60,.6), rgba(200,80,30,.6));
      border-radius: 10px;
      border: 1px solid rgba(255,180,120,.2);
    }

    @media (max-width: 1400px) {
      .body {
        grid-template-columns: 320px 380px minmax(0, 1fr);
      }
    }

    @media (max-width: 1180px) {
      .page {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .shell {
        height: auto;
        min-height: calc(100vh - 48px);
      }

      .body {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid rgba(220,120,48,.14);
      }

      .panel:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 900px) {
      .page { padding: 14px; }
      .shell-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar { justify-content: flex-start; }
      .field-row { grid-template-columns: 1fr; }
      .preview-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .path { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <header class="shell-header">
        <div>
          <div class="eyebrow">Area Records Manager</div>
          <h1 class="title">區域入口清單編輯器</h1>
          <div class="subtitle">專門編 area-extra-records.html 的入口按鈕</div>
        </div>
        <div class="toolbar">
          <button class="btn" id="newItemBtn" type="button">新增區塊</button>
          <button class="btn" id="duplicateItemBtn" type="button">複製目前區塊</button>
          <button class="btn danger" id="deleteItemBtn" type="button">刪除目前區塊</button>
          <button class="btn" id="importBtn" type="button">讀取既有資料</button>
          <button class="btn primary" id="exportGridBtn" type="button">產生可貼上清單</button>
          <button class="btn primary" id="copyBtn" type="button">複製輸出內容</button>
        </div>
      </header>

      <div class="body">
        <section class="panel">
          <div class="panel-head">
            <h2 class="section-title">區塊清單</h2>
          </div>
          <div class="panel-body sidebar-scroll">
            <div class="item-list" id="itemList"></div>
            <div class="status" id="statusText">尚未變更。</div>
            <div class="hint">
              左邊是入口按鈕清單。<br />
              點一個項目後，在中間修改它的名稱、路徑、鎖定狀態。<br />
              最後按「產生可貼上清單」就好。
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="section-title">目前區塊設定</h2>
          </div>
          <div class="panel-body">
            <div class="field-row">
              <div class="field">
                <label class="label" for="labelInput">顯示名稱</label>
                <input class="input" id="labelInput" type="text" placeholder="例如：南極" />
              </div>
              <div class="field">
                <label class="label" for="codeInput">圖示代碼</label>
                <input class="input" id="codeInput" type="text" placeholder="例如：AR 或 ??" />
              </div>
            </div>

            <div class="field">
              <label class="label" for="hrefInput">連結路徑</label>
              <input class="input" id="hrefInput" type="text" placeholder="例如：areas/antarctica.html" />
            </div>

            <div class="field-row">
              <div class="field">
                <label class="label" for="cssClassInput">額外 class</label>
                <input class="input" id="cssClassInput" type="text" placeholder="例如：anomaly" />
              </div>
              <div class="field">
                <label class="label">鎖定狀態</label>
                <label class="check-row"><input id="lockedInput" type="checkbox" /> <span>這個區塊是鎖住的</span></label>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label class="label" for="titleInput">視窗標題</label>
                <input class="input" id="titleInput" type="text" placeholder="ARCHIVE-01 / AREA RECORDS" />
              </div>
              <div class="field">
                <label class="label" for="pathInput">頂部路徑文字</label>
                <input class="input" id="pathInput" type="text" placeholder="C:/archive/area_extra_records" />
              </div>
            </div>

            <div class="stack">
              <button class="btn primary" id="saveItemBtn" type="button">套用目前設定</button>
              <button class="btn" id="moveUpBtn" type="button">往上移</button>
              <button class="btn" id="moveDownBtn" type="button">往下移</button>
            </div>

            <div class="hint">
              鎖住的項目會自動變成：<br />
              <code>href="#"</code> ＋ <code>data-locked</code><br />
              通常圖示代碼就填 <code>??</code>。
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="section-title">預覽 / 輸出</h2>
          </div>
          <div class="panel-body">
            <div class="window-preview">
              <div class="preview-titlebar">
                <div class="window-controls">
                  <button class="back-btn" type="button">← BACK</button>
                  <div class="dot red"></div>
                  <div class="dot yellow"></div>
                  <div class="dot green"></div>
                </div>
                <div class="window-title" id="previewWindowTitle">ARCHIVE-01 / AREA RECORDS</div>
                <div class="path" id="previewWindowPath">C:/archive/area_extra_records</div>
              </div>
              <div class="preview-content">
                <div class="preview-grid" id="previewGrid"></div>
              </div>
            </div>

            <div class="field" style="margin-top: 18px;">
              <label class="label" for="importTextarea">貼上你現有的 area-extra-records.html 內容</label>
              <textarea class="textarea" id="importTextarea" placeholder="把整份 area-extra-records.html 貼進來，按『讀取既有資料』就會自動抓出按鈕清單"></textarea>
            </div>

            <div class="field">
              <label class="label" for="exportTextarea">可直接貼回去的 grid 區塊內容</label>
              <textarea class="textarea export-box" id="exportTextarea" spellcheck="false"></textarea>
              <div class="hint">把這段覆蓋回 <code>&lt;div class="grid"&gt; ... &lt;/div&gt;</code> 裡面就好。</div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const state = {
      activeIndex: 0,
      title: 'ARCHIVE-01 / AREA RECORDS',
      path: 'C:/archive/area_extra_records',
      items: [
        { label: '南極', code: 'AR', href: 'areas/antarctica.html', className: '', locked: false },
        { label: '九老車站', code: '??', href: '#', className: 'anomaly', locked: true },
        { label: '國際機場', code: '??', href: '#', className: 'anomaly', locked: true },
        { label: '賽騰城', code: 'AR', href: 'areas/saiteng-city.html', className: '', locked: false },
        { label: '殉教者山丘', code: 'AR', href: 'areas/martyr-hill.html', className: '', locked: false },
        { label: '地下監管所', code: '??', href: '#', className: 'anomaly', locked: true },
        { label: '世界和平之門', code: '??', href: '#', className: 'anomaly', locked: true },
        { label: '獵者之夜', code: 'AR', href: 'areas/hunter-night.html', className: '', locked: false },
        { label: '仁川港', code: '??', href: '#', className: 'anomaly', locked: true },
        { label: '首爾', code: '??', href: '#', className: 'anomaly', locked: true }
      ]
    };

    const itemList = document.getElementById('itemList');
    const statusText = document.getElementById('statusText');
    const labelInput = document.getElementById('labelInput');
    const codeInput = document.getElementById('codeInput');
    const hrefInput = document.getElementById('hrefInput');
    const cssClassInput = document.getElementById('cssClassInput');
    const lockedInput = document.getElementById('lockedInput');
    const titleInput = document.getElementById('titleInput');
    const pathInput = document.getElementById('pathInput');
    const previewGrid = document.getElementById('previewGrid');
    const previewWindowTitle = document.getElementById('previewWindowTitle');
    const previewWindowPath = document.getElementById('previewWindowPath');
    const exportTextarea = document.getElementById('exportTextarea');
    const importTextarea = document.getElementById('importTextarea');

    function setStatus(text) {
      statusText.textContent = text;
    }

    function ensureActiveIndex() {
      if (!state.items.length) {
        state.items.push({ label: '新區塊', code: 'AR', href: 'areas/new-area.html', className: '', locked: false });
      }
      if (state.activeIndex < 0) state.activeIndex = 0;
      if (state.activeIndex >= state.items.length) state.activeIndex = state.items.length - 1;
    }

    function getActiveItem() {
      ensureActiveIndex();
      return state.items[state.activeIndex];
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function buildItemHtml(item) {
      const classes = ['icon'];
      if (item.className.trim()) {
        classes.push(...item.className.trim().split(/\s+/));
      }
      const href = item.locked ? '#' : (item.href.trim() || '#');
      const lockedAttr = item.locked ? ' data-locked' : '';
      return `
          <a class="${classes.join(' ')}" href="${escapeHtml(href)}"${lockedAttr}>
            <div class="icon-box"><span class="icon-code">${escapeHtml(item.code || 'AR')}</span></div>
            <div class="icon-label">${escapeHtml(item.label || '未命名')}</div>
          </a>`;
    }

    function buildGridHtml() {
      return state.items.map((item) => buildItemHtml(item)).join('\n\n');
    }

    function renderItemList() {
      ensureActiveIndex();
      itemList.innerHTML = '';
      state.items.forEach((item, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'item-card' + (index === state.activeIndex ? ' active' : '');
        button.innerHTML = `
          <div class="item-card-title">${escapeHtml(item.label || '未命名區塊')}</div>
          <div class="item-card-meta">${escapeHtml(item.locked ? '鎖定' : '可進入')}<br>${escapeHtml(item.locked ? '#' : item.href || '#')}</div>
        `;
        button.addEventListener('click', () => {
          state.activeIndex = index;
          renderAll();
          setStatus('已切換區塊');
        });
        itemList.appendChild(button);
      });
    }

    function renderForm() {
      const item = getActiveItem();
      labelInput.value = item.label || '';
      codeInput.value = item.code || '';
      hrefInput.value = item.locked ? '#' : (item.href || '');
      cssClassInput.value = item.className || '';
      lockedInput.checked = !!item.locked;
      titleInput.value = state.title;
      pathInput.value = state.path;
    }

    function renderPreview() {
      previewWindowTitle.textContent = state.title || 'ARCHIVE-01 / AREA RECORDS';
      previewWindowPath.textContent = state.path || 'C:/archive/area_extra_records';
      previewGrid.innerHTML = buildGridHtml();
    }

    function renderExport() {
      exportTextarea.value = buildGridHtml();
    }

    function renderAll() {
      renderItemList();
      renderForm();
      renderPreview();
      renderExport();
    }

    function applyForm() {
      const item = getActiveItem();
      item.label = labelInput.value.trim();
      item.code = codeInput.value.trim() || (lockedInput.checked ? '??' : 'AR');
      item.className = cssClassInput.value.trim();
      item.locked = lockedInput.checked;
      item.href = item.locked ? '#' : (hrefInput.value.trim() || '#');
      state.title = titleInput.value.trim() || 'ARCHIVE-01 / AREA RECORDS';
      state.path = pathInput.value.trim() || 'C:/archive/area_extra_records';
      renderItemList();
      renderPreview();
      renderExport();
    }

    function createDefaultItem() {
      return { label: '新區塊', code: 'AR', href: 'areas/new-area.html', className: '', locked: false };
    }

    function parseAreaRecordsHtml(text) {
      const source = String(text || '');
      if (!source.trim()) throw new Error('empty');

      const titleMatch = source.match(/<div class="window-title">([\s\S]*?)<\/div>/);
      const pathMatch = source.match(/<div class="path">([\s\S]*?)<\/div>/);
      const gridMatch = source.match(/<div class="grid">([\s\S]*?)<\/div>\s*<\/div>/);

      const result = {
        title: titleMatch ? titleMatch[1].trim() : state.title,
        path: pathMatch ? pathMatch[1].trim() : state.path,
        items: []
      };

      const itemRegex = /<a class="([^"]*)" href="([^"]*)"([^>]*)>[\s\S]*?<span class="icon-code">([\s\S]*?)<\/span>[\s\S]*?<div class="icon-label">([\s\S]*?)<\/div>[\s\S]*?<\/a>/g;
      const gridSource = gridMatch ? gridMatch[1] : source;
      let match;
      while ((match = itemRegex.exec(gridSource)) !== null) {
        const classList = match[1].trim().split(/\s+/).filter(Boolean);
        const extraClasses = classList.filter((name) => name !== 'icon');
        const href = match[2];
        const attrText = match[3] || '';
        const code = match[4].trim();
        const label = match[5].trim();
        result.items.push({
          label,
          code,
          href,
          className: extraClasses.join(' '),
          locked: /data-locked/.test(attrText)
        });
      }

      if (!result.items.length) {
        throw new Error('no-items');
      }

      return result;
    }

    document.getElementById('newItemBtn').addEventListener('click', () => {
      state.items.push(createDefaultItem());
      state.activeIndex = state.items.length - 1;
      renderAll();
      setStatus('已新增區塊');
    });

    document.getElementById('duplicateItemBtn').addEventListener('click', () => {
      const copy = JSON.parse(JSON.stringify(getActiveItem()));
      copy.label = (copy.label || '新區塊') + ' - 複製';
      state.items.splice(state.activeIndex + 1, 0, copy);
      state.activeIndex += 1;
      renderAll();
      setStatus('已複製目前區塊');
    });

    document.getElementById('deleteItemBtn').addEventListener('click', () => {
      state.items.splice(state.activeIndex, 1);
      ensureActiveIndex();
      renderAll();
      setStatus('已刪除目前區塊');
    });

    document.getElementById('saveItemBtn').addEventListener('click', () => {
      applyForm();
      setStatus('已套用目前設定');
    });

    document.getElementById('moveUpBtn').addEventListener('click', () => {
      if (state.activeIndex <= 0) return;
      const [item] = state.items.splice(state.activeIndex, 1);
      state.items.splice(state.activeIndex - 1, 0, item);
      state.activeIndex -= 1;
      renderAll();
      setStatus('已往上移');
    });

    document.getElementById('moveDownBtn').addEventListener('click', () => {
      if (state.activeIndex >= state.items.length - 1) return;
      const [item] = state.items.splice(state.activeIndex, 1);
      state.items.splice(state.activeIndex + 1, 0, item);
      state.activeIndex += 1;
      renderAll();
      setStatus('已往下移');
    });

    document.getElementById('exportGridBtn').addEventListener('click', () => {
      applyForm();
      renderExport();
      setStatus('已產生可貼上清單');
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(exportTextarea.value);
        setStatus('已複製輸出內容');
      } catch (error) {
        setStatus('複製失敗，請手動複製');
      }
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      try {
        const parsed = parseAreaRecordsHtml(importTextarea.value);
        state.title = parsed.title;
        state.path = parsed.path;
        state.items = parsed.items;
        state.activeIndex = 0;
        renderAll();
        setStatus('已讀取既有資料');
      } catch (error) {
        setStatus('讀取失敗，請確認你貼的是 area-extra-records.html');
      }
    });

    [labelInput, codeInput, hrefInput, cssClassInput, lockedInput, titleInput, pathInput].forEach((el) => {
      el.addEventListener('input', applyForm);
      el.addEventListener('change', applyForm);
    });

    renderAll();
  </script>
</body>
</html>
